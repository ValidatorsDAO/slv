name: GCE ephemeral runner smoke

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: slv-gce-runner-smoke
  cancel-in-progress: false

jobs:
  provision:
    if: github.repository == 'ValidatorsDAO/slv' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: slv-gce-runners
    permissions:
      contents: read
      id-token: write
    outputs:
      runner_label: ${{ steps.runner.outputs.runner_label }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Provision a disposable runner
        id: runner
        uses: ./.github/actions/gce-control
        with:
          onepassword-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          operation: provision
          job-keys: smoke
          project-id: ${{ vars.GCP_PROJECT_ID }}
          zone: ${{ vars.GCP_RUNNER_ZONE }}
          template: ${{ vars.GCP_RUNNER_TEMPLATE }}
          service-account: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          app-id: ${{ vars.SLV_RUNNER_APP_ID }}
          app-key-ref: ${{ vars.SLV_RUNNER_APP_KEY_REF }}

  smoke:
    needs: provision
    if: needs.provision.outputs.runner_label != ''
    runs-on: ${{ needs.provision.outputs.runner_label }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify runner hardware and credential isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(nproc)" -eq 16
          test ! -e /run/slv-actions-runner/jit-config
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${OP_SERVICE_ACCOUNT_TOKEN:-}"
          test -z "${SLV_RUNNER_APP_PRIVATE_KEY:-}"
          for resource in instance/service-accounts/ instance/attributes/slv-jit-config; do
            status="$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' -H 'Metadata-Flavor: Google' "http://metadata.google.internal/computeMetadata/v1/$resource")"
            test "$status" = 404
          done
          printf 'Verified Linux x64, 16 CPUs, no attached service account, and no retained JIT metadata.\n'

  cleanup:
    needs: [provision, smoke]
    if: always() && github.repository == 'ValidatorsDAO/slv' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: slv-gce-runners
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Delete runner leases
        uses: ./.github/actions/gce-control
        with:
          onepassword-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          operation: cleanup
          job-keys: smoke
          project-id: ${{ vars.GCP_PROJECT_ID }}
          zone: ${{ vars.GCP_RUNNER_ZONE }}
          template: ${{ vars.GCP_RUNNER_TEMPLATE }}
          service-account: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          app-id: ${{ vars.SLV_RUNNER_APP_ID }}
          app-key-ref: ${{ vars.SLV_RUNNER_APP_KEY_REF }}
