name: SLV verified release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Existing CalVer tag to verify or publish when no draft exists; it cannot overwrite a draft
        required: true
        type: string
      operation:
        description: Normal release flow, the explicitly reviewed legacy-bootstrap transition mode, or the bounded native diagnostic
        required: false
        default: release
        type: choice
        options: [
          release,
          legacy-bootstrap-preflight,
          legacy-bootstrap-apply,
          source-native-diagnostic,
        ]
      reviewed_sha:
        description: Exact reviewed commit for the bounded native diagnostic
        required: false
        type: string
      source_sha:
        description: Reviewed immutable release source commit for a legacy-bootstrap operation
        required: false
        type: string
      expected_preimage_sha256:
        description: Reviewed current legacy object SHA-256 for a legacy-bootstrap apply
        required: false
        type: string
      expected_payload_sha256:
        description: Independently reviewed STOP payload SHA-256 for a legacy-bootstrap apply
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'legacy-bootstrap-preflight' || inputs.operation == 'legacy-bootstrap-apply') && format('slv-legacy-bootstrap-dispatch-{0}', github.repository) || format('slv-release-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: false

jobs:
  legacy-bootstrap:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.operation == 'source-native-diagnostic') && (github.event_name == 'workflow_dispatch' && (inputs.operation == 'legacy-bootstrap-preflight' || inputs.operation == 'legacy-bootstrap-apply')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release
    concurrency:
      group: slv-legacy-bootstrap-object-${{ github.repository }}-slv-install
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Refuse any ref other than main before credentials are exposed
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REF" = refs/heads/main
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: denoland/setup-deno@01524fade784327df1a5ad1ead94235d392cd443 # v2.0.1
        with:
          deno-version: v2.9.3
      - name: Replace the legacy bootstrap only after immutable release verification
        env:
          OPERATION: ${{ inputs.operation }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_PREIMAGE_SHA256: ${{ inputs.expected_preimage_sha256 }}
          EXPECTED_PAYLOAD_SHA256: ${{ inputs.expected_payload_sha256 }}
          SLV_R2_CREDENTIALS_JSON: ${{ secrets.SLV_R2_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          operation="${OPERATION#legacy-bootstrap-}"
          args=("$operation" --version "$VERSION" --output-dir legacy-bootstrap-evidence)
          if [ -n "$SOURCE_SHA" ]; then args+=(--source-sha "$SOURCE_SHA"); fi
          if [ -n "$EXPECTED_PREIMAGE_SHA256" ]; then args+=(--expected-preimage-sha256 "$EXPECTED_PREIMAGE_SHA256"); fi
          if [ -n "$EXPECTED_PAYLOAD_SHA256" ]; then args+=(--expected-payload-sha256 "$EXPECTED_PAYLOAD_SHA256"); fi
          endpoint_host="$(deno run --frozen --no-prompt --allow-env=SLV_R2_CREDENTIALS_JSON scripts/release/r2-fixed-object.ts endpoint-host)"
          [[ "$endpoint_host" =~ ^[0-9a-f]{32}(\.(eu|us|fedramp))?\.r2\.cloudflarestorage\.com$ ]] || { printf '%s\n' 'Invalid R2 endpoint host' >&2; exit 65; }
          deno run --frozen --no-prompt --allow-read --allow-write --allow-env=SLV_R2_CREDENTIALS_JSON --allow-net="$endpoint_host,api.github.com,storage.slv.dev" scripts/release/legacy-bootstrap.ts "${args[@]}"
      - name: Preserve legacy-bootstrap evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slv-legacy-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: legacy-bootstrap-evidence
          if-no-files-found: warn
          retention-days: 7

  resolve:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.operation == 'source-native-diagnostic') && (!(github.event_name == 'workflow_dispatch' && (inputs.operation == 'legacy-bootstrap-preflight' || inputs.operation == 'legacy-bootstrap-apply'))) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      release_required: ${{ steps.resolve.outputs.release_required }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      source_timestamp: ${{ steps.resolve.outputs.source_timestamp }}
      publication: ${{ steps.resolve.outputs.publication }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@01524fade784327df1a5ad1ead94235d392cd443 # v2.0.1
        with:
          deno-version: v2.9.3
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_REPO: ValidatorsDAO/slv
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force origin main --tags
          deno run --frozen --allow-read --allow-write --allow-run --allow-env scripts/release/workflow.ts resolve

  test:
    needs: resolve
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.operation == 'source-native-diagnostic') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      license_artifact_id: ${{ steps.upload-license-evidence.outputs.artifact-id }}
      license_artifact_digest: ${{ steps.upload-license-evidence.outputs.artifact-digest }}
      license_producer_run_id: ${{ steps.prepare-licenses.outputs.producer_run_id }}
      license_producer_attempt: ${{ steps.prepare-licenses.outputs.producer_attempt }}
      license_notice_sha256: ${{ steps.prepare-licenses.outputs.notice_sha256 }}
    env:
      DENO_DIR: /tmp/slv-deno-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
      - uses: denoland/setup-deno@01524fade784327df1a5ad1ead94235d392cd443 # v2.0.1
        with:
          deno-version: v2.9.3
      - name: Typecheck and run release safety tests
        run: |
          set -euo pipefail
          deno install --frozen --allow-scripts=npm:protobufjs@7.4.0
          deno check --frozen cli/src/index.ts
          deno task check:version-sync
          deno test -A --no-config test-solana-key/test.ts
          python3 -m unittest discover -s cli/lib/release -p '*_test.py' -v
          deno test --frozen --allow-read --allow-write --allow-run --allow-env --allow-net=127.0.0.1,localhost --allow-sys=uid cli/test cli/src/gateway/ui/static_test.ts scripts/create-release_test.ts scripts/release cli/lib/release/index_test.ts cli/lib/migrate/migrateVersionsYml_test.ts source-rebuild/verify-native_test.ts
          deno test --frozen --allow-read --allow-write --allow-run --allow-env --allow-net=127.0.0.1,localhost --allow-sys=uid source-rebuild/verify-linux-product_test.ts
      - name: Materialize the canonical third-party notices from the actual module graph
        id: prepare-licenses
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p dist/release-inputs
          deno info --json --frozen cli/src/index.ts > dist/release-inputs/deno-info.json
          deno run --frozen --allow-read --allow-write scripts/release/release.ts graph dist/release-inputs/deno-info.json
          deno run --frozen --allow-read --allow-write scripts/release/release.ts prepare-licenses "$SOURCE_SHA" "$PRODUCER_RUN_ID" "$PRODUCER_RUN_ATTEMPT"
          producer_run_id="$(jq -er '.producer_run_id' dist/release-inputs/license-bundle.json)"
          producer_attempt="$(jq -er '.producer_run_attempt' dist/release-inputs/license-bundle.json)"
          notice_sha256="$(jq -er '.sha256' dist/release-inputs/license-bundle.json)"
          test "$producer_run_id" = "$PRODUCER_RUN_ID"
          test "$producer_attempt" = "$PRODUCER_RUN_ATTEMPT"
          test "$(sha256sum dist/release-inputs/THIRD_PARTY_NOTICES | cut -d ' ' -f 1)" = "$notice_sha256"
          {
            echo "producer_run_id=$producer_run_id"
            echo "producer_attempt=$producer_attempt"
            echo "notice_sha256=$notice_sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Persist only the canonical notice bytes and identity binding
        id: upload-license-evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slv-license-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/release-inputs/THIRD_PARTY_NOTICES
            dist/release-inputs/license-bundle.json
          if-no-files-found: error
          retention-days: 7

  source-native-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'source-native-diagnostic'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the reviewed diagnostic revision before any acquisition
        env:
          EXPECTED_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation }}
          REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVIEWED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$ACTUAL_SHA" = "$EXPECTED_REVIEWED_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_REVIEWED_SHA"
          test "$REPOSITORY" = ValidatorsDAO/slv
          test "$EVENT_NAME" = workflow_dispatch
          test "$OPERATION" = source-native-diagnostic
          test "$REF" = refs/heads/codex/slv-eu-oss-delivery
          test "$WORKFLOW_REF" = ValidatorsDAO/slv/.github/workflows/slv-remote-build.yml@refs/heads/codex/slv-eu-oss-delivery
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: denoland/setup-deno@01524fade784327df1a5ad1ead94235d392cd443 # v2.0.1
        with:
          deno-version: v2.9.3
      - name: Bind the diagnostic context to the checked-out revision
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$REVIEWED_SHA"
          test "$ACTUAL_SHA" = "$REVIEWED_SHA"
          test "$WORKFLOW_SHA" = "$REVIEWED_SHA"
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          mkdir "$RUNNER_TEMP/arm-diagnostic-input" "$RUNNER_TEMP/arm-diagnostic-output" "$RUNNER_TEMP/arm-diagnostic-acquisition" "$RUNNER_TEMP/arm-diagnostic-acquisition-work"
          jq -n \
            --arg repository "$REPOSITORY" \
            --arg workflow_ref "$WORKFLOW_REF" \
            --arg workflow_sha "$WORKFLOW_SHA" \
            --arg diagnostic_source_commit "$actual_head" \
            --arg run_id "$RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" \
            '{schema_version: 1, kind: "slv-native-diagnostic-context", repository: $repository, workflow_ref: $workflow_ref, workflow_sha: $workflow_sha, diagnostic_source_commit: $diagnostic_source_commit, run_id: $run_id, run_attempt: $run_attempt}' \
            > "$RUNNER_TEMP/arm-diagnostic-context.json"
      - name: Download the fixed ARM diagnostic artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 5
        with:
          repository: ValidatorsDAO/slv
          run-id: 38628703267
          artifact-ids: 11935008486
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/arm-diagnostic-input
      - name: Acquire existing or frozen official Ubuntu gdb
        id: acquire-debugger
        timeout-minutes: 3
        env:
          CHECKOUT_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          case "$CHECKOUT_ROOT" in /*) ;; *) exit 64 ;; esac
          acquisition_deadline_epoch="$(( $(/bin/date +%s) + 180 ))"
          validator_module="$RUNNER_TEMP/arm-diagnostic-acquisition-work/validate-stored-artifact.ts"
          cat > "$validator_module" <<'DENO'
          import { pathToFileURL } from 'node:url'

          const [modulePath, artifactRoot] = Deno.args
          if (!modulePath.startsWith('/')) throw new Error('validator must be an absolute reviewed checkout path')
          const { validateStoredArtifact } = await import(pathToFileURL(modulePath).href)
          const artifact = await validateStoredArtifact(artifactRoot)
          console.log(JSON.stringify({
            denort: artifact.denort,
            probe: artifact.probe,
            denort_sha256: artifact.programMeasurements['baseline-denort'].sha256,
            denort_size: artifact.programMeasurements['baseline-denort'].size,
            probe_sha256: artifact.programMeasurements['baseline-probe'].sha256,
            probe_size: artifact.programMeasurements['baseline-probe'].size,
          }))
          DENO
          if /usr/bin/timeout --kill-after=2s 20s deno run --frozen --allow-read "$validator_module" "$CHECKOUT_ROOT/source-rebuild/diagnose-native.ts" "$RUNNER_TEMP/arm-diagnostic-input" > "$RUNNER_TEMP/arm-diagnostic-acquisition/validated-programs.json"; then
            :
          else
            validator_status=$?
            printf '%s\n' '{"schema_version":1,"kind":"slv-native-diagnostic-acquisition","stage":"stored-artifact-validation","status":"failed","runtime_unchanged":false,"controls_not_run":"stored-artifact-validation"}' > "$RUNNER_TEMP/arm-diagnostic-acquisition/acquisition-summary.json"
            printf '%s\n' 'runtime_unchanged=false' >> "$GITHUB_OUTPUT"
            exit "$validator_status"
          fi
          controller_seconds_remaining="$(( acquisition_deadline_epoch - $(/bin/date +%s) ))"
          python3 - "$RUNNER_TEMP/arm-diagnostic-acquisition" "$RUNNER_TEMP/arm-diagnostic-acquisition-work" "$RUNNER_TEMP/arm-diagnostic-acquisition/validated-programs.json" "$GITHUB_OUTPUT" "$controller_seconds_remaining" <<'PY'
          # BEGIN BOUNDED_GDB_ACQUISITION_CONTROLLER
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import selectors
          import signal
          import stat
          import subprocess
          import sys
          import time
          from dataclasses import dataclass
          from pathlib import Path
          from urllib.parse import urlparse

          RETAINED_LIMIT = 2 * 1024 * 1024
          SUMMARY_RESERVE = 96 * 1024
          COMMAND_LOG_LIMIT = 64 * 1024
          AUTHORITATIVE_OUTPUT_LIMIT = 512 * 1024
          ACQUISITION_REASON_LIMIT = 512
          SOURCE_TELEMETRY_LIMIT = 16 * 1024
          SOURCE_TELEMETRY_RECORD_LIMIT = 64
          SOURCE_TELEMETRY_PHASE_LIMIT = SOURCE_TELEMETRY_LIMIT // 2
          SOURCE_TELEMETRY_PHASE_RECORD_LIMIT = SOURCE_TELEMETRY_RECORD_LIMIT // 2
          SOURCE_TELEMETRY_PHASE_NORMAL_RECORD_LIMIT = SOURCE_TELEMETRY_PHASE_RECORD_LIMIT - 1
          DEADLINE_SECONDS = 180
          AUDIT_RESERVE_SECONDS = 20
          FINAL_AUDIT_PHASES = frozenset({'postimage-audit', 'postimage-keyring'})
          INTERPRETER = '/lib/ld-linux-aarch64.so.1'
          KEYRING = '/usr/share/keyrings/ubuntu-archive-keyring.gpg'
          FIXED_MIRROR_DESCRIPTOR_URI = 'mirror+file:/etc/apt/apt-mirrors.txt'
          FIXED_MIRROR_DESCRIPTOR_PATH = '/etc/apt/apt-mirrors.txt'
          FIXED_MIRROR_DESCRIPTOR_BYTES = (
              b'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1\n'
              b'https://archive.ubuntu.com/ubuntu/\tpriority:2\n'
              b'https://security.ubuntu.com/ubuntu/\tpriority:3\n'
          )
          FIXED_MIRROR_DESCRIPTOR_SHA256 = 'e0d6b0af979e4662d16357a27ae456cc6f21e26da031540f4df8706ebed1d583'
          FIXED_MIRROR_DESCRIPTOR_READ_LIMIT = 145
          FIXED_MIRROR_URIS = (
              'http://azure.archive.ubuntu.com/ubuntu/',
              'https://archive.ubuntu.com/ubuntu/',
              'https://security.ubuntu.com/ubuntu/',
          )
          FIXED_MIRROR_RESOLVED_URI = FIXED_MIRROR_URIS[0]
          FIXED_MIRROR_REFUSAL_CODES = frozenset({
              'descriptor-content-mismatch',
              'descriptor-metadata-mismatch',
              'descriptor-raced',
              'descriptor-unavailable',
              'descriptor-uri-policy',
              'unsafe-descriptor-parent',
              'unsafe-descriptor-file',
          })
          DPKG_QUERY_FORMAT = '${binary:Package}\t${Architecture}\t${Version}\t${db:Status-Abbrev}\n'
          SAFE_ENV = {
              'PATH': '/usr/sbin:/usr/bin:/sbin:/bin',
              'LC_ALL': 'C',
              'LANG': 'C.UTF-8',
          }

          class AcquisitionError(RuntimeError):
              def __init__(self, message='', *, code='acquisition-declined'):
                  super().__init__(message)
                  self.code = code

          class UnsafePostimage(AcquisitionError):
              pass

          def canonical(value):
              return json.dumps(value, sort_keys=True, separators=(',', ':'))

          def sha_text(value):
              return hashlib.sha256(value.encode()).hexdigest()

          def sha_file(path):
              digest = hashlib.sha256()
              with open(path, 'rb') as source:
                  for block in iter(lambda: source.read(1024 * 1024), b''):
                      digest.update(block)
              return digest.hexdigest()

          def regular(path, label):
              info = os.lstat(path)
              if not stat.S_ISREG(info.st_mode) or stat.S_ISLNK(info.st_mode):
                  raise AcquisitionError(f'{label} is not a regular non-symlink file')
              return info

          class Retention:
              def __init__(self, directory):
                  self.directory = Path(directory)
                  self.total = 0
                  self.directory.mkdir(mode=0o700, parents=True, exist_ok=True)

              def _reserve(self, amount, terminal=False):
                  limit = RETAINED_LIMIT if terminal else RETAINED_LIMIT - SUMMARY_RESERVE
                  if amount < 0 or self.total + amount > limit:
                      raise AcquisitionError('bounded acquisition evidence would exceed its retention limit')
                  self.total += amount

              def import_existing(self, name):
                  path = self.directory / name
                  self._reserve(path.stat().st_size)

              def write_exact(self, name, data, terminal=False):
                  if '/' in name or name.startswith('.'):
                      raise AcquisitionError('unsafe acquisition evidence name')
                  encoded = data if isinstance(data, bytes) else data.encode()
                  self._reserve(len(encoded), terminal)
                  (self.directory / name).write_bytes(encoded)

              def write_json(self, name, value, terminal=False):
                  self.write_exact(name, canonical(value) + '\n', terminal)

          @dataclass
          class Result:
              code: int
              timed_out: bool
              stdout: bytes
              stderr: bytes
              stdout_bytes: int
              stderr_bytes: int
              stdout_complete: bool
              stderr_complete: bool
              capture_complete: bool

          class Controller:
              def __init__(self, evidence, work, validated, github_output, seconds_remaining=DEADLINE_SECONDS):
                  self.evidence = Retention(evidence)
                  self.work = Path(work)
                  self.work.mkdir(mode=0o700, parents=True, exist_ok=True)
                  self.work.chmod(0o700)
                  self.home = self.work / 'home'
                  self.home.mkdir(mode=0o700, exist_ok=True)
                  self.child_env = {**SAFE_ENV, 'HOME': str(self.home)}
                  self.validated = self.load_validated(validated)
                  self.github_output = Path(github_output)
                  if not isinstance(seconds_remaining, int) or seconds_remaining <= 0:
                      raise AcquisitionError('acquisition budget exhausted during stored artifact validation', code='acquisition-budget-exhausted')
                  self.deadline = time.monotonic() + min(DEADLINE_SECONDS, seconds_remaining)
                  self.commands = []
                  self.phase = 'initializing'
                  self.plan = []
                  self.source_records = []
                  self.initial_fixed_mirror_binding = None
                  self.fixed_mirror_binding_unsafe = False
                  self.post_fixed_mirror_binding = None
                  self.keyring = None
                  self.post_sources = None
                  self.post_keyring = None
                  self.preimage = None
                  self.postimage = None
                  self.status = 'acquisition-unavailable'
                  self.failure_stage = None
                  self.acquisition_reason = None
                  self.audit_error = None
                  self.image_codename = None
                  self.gdb = None

              def sanitized_failure(self, error):
                  known = {
                      'no-supported-source': ('no-supported-source', 'no supported configured official Ubuntu binary source'),
                      'fixed-mirror-descriptor-refused': ('fixed-mirror-descriptor-refused', 'fixed mirror descriptor was refused'),
                      'acquisition-budget-exhausted': ('acquisition-budget-exhausted', 'acquisition time budget was exhausted'),
                  }
                  if isinstance(error, AcquisitionError):
                      code, message = known.get(getattr(error, 'code', None), ('acquisition-declined', 'acquisition was declined'))
                      error_type = 'UnsafePostimage' if isinstance(error, UnsafePostimage) else 'AcquisitionError'
                  else:
                      code, message = 'operation-failed', 'operation failed; details redacted'
                      error_type = type(error).__name__ if type(error).__name__ in {'OSError', 'PermissionError', 'FileNotFoundError', 'UnicodeDecodeError', 'ValueError'} else 'Exception'
                  value = {'code': code, 'message': message, 'error_type': error_type}
                  errno = getattr(error, 'errno', None)
                  if isinstance(errno, int):
                      value['errno'] = errno
                  encoded = canonical(value).encode('utf-8')
                  if len(encoded) > ACQUISITION_REASON_LIMIT:
                      raise AcquisitionError('sanitized acquisition reason exceeded its evidence bound')
                  return value

              def capture_acquisition_failure(self, error):
                  if self.failure_stage is None:
                      self.failure_stage = self.phase if self.phase else 'acquisition'
                  if self.acquisition_reason is None:
                      self.acquisition_reason = self.sanitized_failure(error)

              def load_validated(self, path):
                  self.evidence.import_existing('validated-programs.json')
                  value = json.loads(Path(path).read_text())
                  expected = {'denort', 'probe', 'denort_sha256', 'denort_size', 'probe_sha256', 'probe_size'}
                  if set(value) != expected:
                      raise AcquisitionError('stored artifact validator returned an unexpected program set')
                  programs = []
                  for name, prefix in [('baseline-denort', 'denort'), ('baseline-probe', 'probe')]:
                      path_value = value[prefix]
                      digest = value[f'{prefix}_sha256']
                      size = value[f'{prefix}_size']
                      if not isinstance(path_value, str) or not path_value.startswith('/'):
                          raise AcquisitionError('validator returned a non-absolute program path')
                      if not re.fullmatch(r'[a-f0-9]{64}', str(digest)) or not isinstance(size, int) or size <= 0:
                          raise AcquisitionError('validator returned an invalid program identity')
                      info = regular(path_value, name)
                      if info.st_size != size or sha_file(path_value) != digest:
                          raise AcquisitionError('validated program changed before loader inspection')
                      programs.append({'name': name, 'path': path_value, 'sha256': digest, 'size': size})
                  return programs

              def remaining(self, reserve=0):
                  return self.deadline - time.monotonic() - reserve

              def run(self, command, phase, cap, privileged=False):
                  remaining = self.remaining(0 if phase in FINAL_AUDIT_PHASES else AUDIT_RESERVE_SECONDS)
                  if remaining <= 0:
                      raise AcquisitionError('acquisition budget exhausted before final audit reserve', code='acquisition-budget-exhausted')
                  seconds = max(1, min(int(remaining), cap))
                  wrapped = ['/usr/bin/timeout', '--kill-after=2s', f'{seconds}s', *command]
                  if privileged:
                      wrapped = ['sudo', '-n', *wrapped]
                  process = subprocess.Popen(
                      wrapped,
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      env=self.child_env,
                      start_new_session=True,
                      bufsize=0,
                  )
                  preview = {'stdout': bytearray(), 'stderr': bytearray()}
                  authoritative = {'stdout': bytearray(), 'stderr': bytearray()}
                  counted = {'stdout': 0, 'stderr': 0}
                  stream_complete = {'stdout': False, 'stderr': False}
                  stream_errors = {'stdout': None, 'stderr': None}
                  selector = selectors.DefaultSelector()
                  streams = {}
                  for key, stream in [('stdout', process.stdout), ('stderr', process.stderr)]:
                      descriptor = stream.fileno()
                      os.set_blocking(descriptor, False)
                      selector.register(descriptor, selectors.EVENT_READ, key)
                      streams[descriptor] = key
                  def drain(descriptor, key):
                      try:
                          block = os.read(descriptor, 8192)
                          if not block:
                              selector.unregister(descriptor)
                              streams.pop(descriptor, None)
                              stream_complete[key] = True
                              return
                          counted[key] += len(block)
                          if len(preview[key]) < COMMAND_LOG_LIMIT:
                              preview[key].extend(block[:COMMAND_LOG_LIMIT - len(preview[key])])
                          if len(authoritative[key]) < AUTHORITATIVE_OUTPUT_LIMIT:
                              authoritative[key].extend(block[:AUTHORITATIVE_OUTPUT_LIMIT - len(authoritative[key])])
                      except BlockingIOError:
                          return
                      except Exception as error:
                          stream_errors[key] = str(error)
                          try:
                              selector.unregister(descriptor)
                          except Exception:
                              pass
                          streams.pop(descriptor, None)
                  timed_out = False
                  capture_complete = True
                  def terminate_group():
                      nonlocal capture_complete
                      try:
                          os.killpg(process.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      except Exception:
                          capture_complete = False
                      try:
                          process.wait(timeout=1)
                      except subprocess.TimeoutExpired:
                          capture_complete = False
                  command_deadline = time.monotonic() + seconds + 3
                  pipe_deadline = None
                  try:
                      while process.poll() is None or streams:
                          now = time.monotonic()
                          exited = process.poll() is not None
                          if not exited and now >= command_deadline:
                              timed_out = True
                              terminate_group()
                              exited = process.poll() is not None
                              if not exited:
                                  capture_complete = False
                                  break
                          if exited and streams and pipe_deadline is None:
                              pipe_deadline = min(command_deadline, now + 1)
                          if streams and pipe_deadline is not None and now >= pipe_deadline:
                              capture_complete = False
                              terminate_group()
                              break
                          if exited and not streams:
                              break
                          wait_until = pipe_deadline if pipe_deadline is not None else command_deadline
                          timeout = max(0, min(0.1, wait_until - now))
                          for selected, _ in selector.select(timeout):
                              drain(selected.fd, selected.data)
                  finally:
                      selector.close()
                  if process.poll() is None:
                      capture_complete = False
                      terminate_group()
                  if streams:
                      capture_complete = False
                  capture_complete = capture_complete and all(stream_complete.values()) and not any(stream_errors.values())
                  result = Result(
                      process.returncode if process.returncode is not None else 124,
                      timed_out or process.returncode in {124, 137, -signal.SIGKILL},
                      bytes(authoritative['stdout']),
                      bytes(authoritative['stderr']),
                      counted['stdout'],
                      counted['stderr'],
                      stream_complete['stdout'] and counted['stdout'] <= AUTHORITATIVE_OUTPUT_LIMIT,
                      stream_complete['stderr'] and counted['stderr'] <= AUTHORITATIVE_OUTPUT_LIMIT,
                      capture_complete,
                  )
                  number = len(self.commands)
                  log_name = f'command-{number:02d}.json'
                  self.evidence.write_json(log_name, {
                      'phase': phase,
                      'argv': command,
                      'privileged': privileged,
                      'timeout_seconds': seconds,
                      'exit_code': result.code,
                      'timed_out': result.timed_out,
                      'stdout_bytes': result.stdout_bytes,
                      'stderr_bytes': result.stderr_bytes,
                      'stdout_authoritative_bytes': len(result.stdout),
                      'stderr_authoritative_bytes': len(result.stderr),
                      'stdout_complete': result.stdout_complete,
                      'stderr_complete': result.stderr_complete,
                      'capture_complete': result.capture_complete,
                      'stdout_preview_bytes': len(preview['stdout']),
                      'stderr_preview_bytes': len(preview['stderr']),
                      'stdout_truncated': result.stdout_bytes > len(preview['stdout']),
                      'stderr_truncated': result.stderr_bytes > len(preview['stderr']),
                      'stdout': preview['stdout'].decode('utf-8', 'replace'),
                      'stderr': preview['stderr'].decode('utf-8', 'replace'),
                  })
                  self.commands.append({'phase': phase, 'log': log_name, 'exit_code': result.code, 'timed_out': result.timed_out})
                  return result

              def require(self, command, phase, cap, privileged=False):
                  result = self.run(command, phase, cap, privileged)
                  if result.code != 0 or result.timed_out or not result.capture_complete or not result.stdout_complete or not result.stderr_complete:
                      raise AcquisitionError(f'{phase} failed or produced incomplete output')
                  return result

              def package_inventory(self, phase):
                  result = self.require(['/usr/bin/dpkg-query', '-W', '-f=' + DPKG_QUERY_FORMAT], phase, 8)
                  if not getattr(result, 'capture_complete', True) or not getattr(result, 'stdout_complete', True):
                      raise AcquisitionError('package inventory output was incomplete')
                  installed, residual, malformed = {}, {}, []
                  for line in result.stdout.decode('utf-8', 'replace').splitlines():
                      fields = line.split('\t')
                      if len(fields) != 4 or not all(fields[:3]):
                          malformed.append(line)
                          continue
                      package, arch, version, status_text = fields
                      normalized_package = package if ':' in package else f'{package}:{arch}'
                      item = {'package': package, 'normalized_package': normalized_package, 'architecture': arch, 'version': version, 'status': status_text}
                      if re.fullmatch(r'[hi]i\s*', status_text):
                          if normalized_package in installed:
                              malformed.append(line)
                          installed[normalized_package] = item
                      elif re.fullmatch(r'rc\s*', status_text):
                          residual[normalized_package] = item
                      else:
                          malformed.append(line)
                  if malformed:
                      raise AcquisitionError('package database contains pending, broken, or malformed installed states')
                  return {'installed': installed, 'residual': residual, 'sha256': sha_text(canonical({'installed': installed, 'residual': residual}))}

              def symlink_chain(self, requested):
                  current = Path(requested)
                  chain = []
                  seen = set()
                  for _ in range(32):
                      current_text = str(current)
                      if current_text in seen:
                          raise AcquisitionError('library symlink loop')
                      seen.add(current_text)
                      info = os.lstat(current)
                      chain.append(current_text)
                      if stat.S_ISLNK(info.st_mode):
                          target = os.readlink(current)
                          current = Path(target) if os.path.isabs(target) else current.parent / target
                          continue
                      if not stat.S_ISREG(info.st_mode):
                          raise AcquisitionError('resolved runtime object is not a regular file')
                      resolved = str(current.resolve())
                      if resolved != current_text:
                          chain.append(resolved)
                      return chain, resolved
                  raise AcquisitionError('library symlink chain is too deep')

              def installed_owner(self, requested, resolved, installed, phase):
                  owners = []
                  for candidate in dict.fromkeys([requested, resolved]):
                      result = self.run(['/usr/bin/dpkg-query', '-S', candidate], phase, 5)
                      if not result.capture_complete or not result.stdout_complete:
                          raise AcquisitionError('runtime owner query output was incomplete')
                      if result.code != 0 or result.timed_out:
                          continue
                      for line in result.stdout.decode('utf-8', 'replace').splitlines():
                          if ': ' not in line:
                              continue
                          owner, owned_path = line.split(': ', 1)
                          if owned_path == candidate:
                              owners.append(owner)
                  owners = list(dict.fromkeys(owners))
                  matching = []
                  for owner in owners:
                      if owner in installed:
                          matching.append(owner)
                      else:
                          matching.extend(key for key in installed if key.split(':', 1)[0] == owner)
                  matching = list(dict.fromkeys(matching))
                  if len(matching) != 1:
                      raise AcquisitionError('runtime object has ambiguous or unowned package identity')
                  return matching[0], installed[matching[0]]

              def parse_loader(self, text):
                  values = []
                  for raw in text.splitlines():
                      line = raw.strip()
                      if not line:
                          continue
                      if line.startswith('linux-vdso.so.1'):
                          continue
                      if '=>' in line:
                          label, value = line.split('=>', 1)
                          path = value.strip().split(' ', 1)[0]
                      else:
                          label = 'interpreter'
                          path = line.split(' ', 1)[0]
                      if not path.startswith('/'):
                          raise AcquisitionError('loader output contained an unresolved or unsafe path')
                      values.append((label.strip(), path))
                  if not values:
                      raise AcquisitionError('loader output contained no resolved runtime objects')
                  return values

              def runtime_snapshot(self, packages, phase):
                  records = {}
                  for program in self.validated:
                      header = self.require(['/usr/bin/readelf', '-l', program['path']], phase, 8).stdout.decode('utf-8', 'replace')
                      match = re.search(r'Requesting program interpreter:\s*([^\]]+)', header)
                      if not match or match.group(1).strip() != INTERPRETER:
                          raise AcquisitionError('target program has an unexpected ELF interpreter')
                      dynamic = self.require(['/usr/bin/readelf', '-d', program['path']], phase, 8).stdout.decode('utf-8', 'replace')
                      if '(RPATH)' in dynamic or '(RUNPATH)' in dynamic:
                          raise AcquisitionError('target program has an unexpected RPATH or RUNPATH')
                      chain, interpreter = self.symlink_chain(INTERPRETER)
                      regular(interpreter, 'ELF interpreter')
                      listed = self.require([interpreter, '--list', program['path']], phase, 10).stdout.decode('utf-8', 'replace')
                      objects = [('interpreter', INTERPRETER)] + self.parse_loader(listed)
                      for label, requested in objects:
                          object_chain, resolved = self.symlink_chain(requested)
                          info = regular(resolved, 'resolved runtime object')
                          owner, owner_tuple = self.installed_owner(requested, resolved, packages['installed'], phase)
                          key = f"{program['name']}:{label}:{requested}"
                          records[key] = {
                              'label': label,
                              'requested_path': requested,
                              'symlink_chain': object_chain,
                              'realpath': resolved,
                              'sha256': sha_file(resolved),
                              'size': info.st_size,
                              'owner': owner,
                              'owner_tuple': owner_tuple,
                          }
                  return records

              def image_identity(self):
                  values = {}
                  for raw in Path('/etc/os-release').read_text().splitlines():
                      if '=' in raw and not raw.startswith('#'):
                          key, value = raw.split('=', 1)
                          values[key] = value.strip().strip('"')
                  if values.get('ID') != 'ubuntu':
                      raise AcquisitionError('diagnostic runner is not an allowlisted Ubuntu image')
                  uname = self.require(['/usr/bin/uname', '-a'], 'image-identity', 5).stdout.decode('utf-8', 'replace').strip()
                  return {'os_release': {key: values.get(key) for key in ['ID', 'VERSION_ID', 'VERSION_CODENAME']}, 'uname': uname, 'image_os': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion')}

              def trusted_gdb(self):
                  for candidate in ['/usr/bin/gdb', '/bin/gdb']:
                      try:
                          info = regular(candidate, 'gdb')
                      except (FileNotFoundError, AcquisitionError):
                          continue
                      if info.st_mode & stat.S_IXUSR:
                          return candidate
                  return None

              def official_uri(self, uri):
                  parsed = urlparse(uri)
                  host = (parsed.hostname or '').lower()
                  allowed = host in {'ports.ubuntu.com', 'archive.ubuntu.com', 'security.ubuntu.com'} or re.fullmatch(r'[a-z]{2}\.archive\.ubuntu\.com', host) or host == 'azure.archive.ubuntu.com'
                  if not allowed or parsed.scheme not in {'http', 'https'} or parsed.username or parsed.password or parsed.port or parsed.query or parsed.fragment:
                      return False
                  return parsed.path.startswith('/ubuntu')

              def source_location(self, root, path, ordinal):
                  if path == root / 'sources.list':
                      return 'sources.list'
                  return 'sources.list.d/ubuntu.sources' if path.name == 'ubuntu.sources' else f'sources.list.d/{ordinal}'

              def source_suite(self, suite):
                  try:
                      codename = self.image_codename
                      allowed = {codename, *(f'{codename}{suffix}' for suffix in ['-updates', '-security', '-backports', '-proposed'])} if isinstance(codename, str) and codename else set()
                      if isinstance(suite, str) and suite in allowed and re.fullmatch(r'[a-z0-9][a-z0-9.-]{0,63}', suite):
                          return suite
                  except Exception:
                      pass
                  return 'redacted'

              def source_architectures(self, value):
                  try:
                      tokens = re.split(r'[\s,]+', value or '')
                      visible = [token for token in tokens if token in {'arm64', 'amd64', 'all'}]
                      if any(token and token not in {'arm64', 'amd64', 'all'} for token in tokens):
                          visible.append('other')
                      return list(dict.fromkeys(visible)) or ['redacted']
                  except Exception:
                      return ['redacted']

              def source_host(self, uri):
                  try:
                      if self.official_uri(uri):
                          return (urlparse(uri).hostname or '').lower()
                  except Exception:
                      pass
                  return 'redacted'

              def fixed_mirror_refusal(self, code, error=None):
                  if code not in FIXED_MIRROR_REFUSAL_CODES:
                      code = 'descriptor-unavailable'
                  refused = AcquisitionError('fixed mirror descriptor was refused', code='fixed-mirror-descriptor-refused')
                  refused.descriptor_code = code
                  errno = getattr(error, 'errno', None)
                  if isinstance(errno, int):
                      refused.errno = errno
                  return refused

              @staticmethod
              def protected_identity(info):
                  return {
                      'device': info.st_dev,
                      'inode': info.st_ino,
                      'uid': info.st_uid,
                      'gid': info.st_gid,
                      'mode': stat.S_IMODE(info.st_mode),
                      'size': info.st_size,
                      'mtime_ns': info.st_mtime_ns,
                      'ctime_ns': info.st_ctime_ns,
                  }

              def fixed_mirror_directory(self, path):
                  info = os.lstat(path)
                  if stat.S_ISLNK(info.st_mode) or not stat.S_ISDIR(info.st_mode) or info.st_uid != 0 or info.st_mode & 0o022:
                      raise self.fixed_mirror_refusal('unsafe-descriptor-parent')
                  return self.protected_identity(info)

              def fixed_mirror_file_identity(self, info):
                  if stat.S_ISLNK(info.st_mode) or not stat.S_ISREG(info.st_mode) or info.st_uid != 0 or info.st_mode & 0o022:
                      raise self.fixed_mirror_refusal('unsafe-descriptor-file')
                  return self.protected_identity(info)

              def fixed_mirror_descriptor(self):
                  try:
                      initial_parents = [self.fixed_mirror_directory('/etc'), self.fixed_mirror_directory('/etc/apt')]
                      initial_path = self.fixed_mirror_file_identity(os.lstat(FIXED_MIRROR_DESCRIPTOR_PATH))
                      flags = os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW | os.O_NONBLOCK
                      descriptor_fd = os.open(FIXED_MIRROR_DESCRIPTOR_PATH, flags)
                      try:
                          opened_identity = self.fixed_mirror_file_identity(os.fstat(descriptor_fd))
                          if initial_path != opened_identity:
                              raise self.fixed_mirror_refusal('descriptor-raced')
                          data = bytearray()
                          while len(data) < FIXED_MIRROR_DESCRIPTOR_READ_LIMIT:
                              block = os.read(descriptor_fd, FIXED_MIRROR_DESCRIPTOR_READ_LIMIT - len(data))
                              if not block:
                                  break
                              data.extend(block)
                          final_opened_identity = self.fixed_mirror_file_identity(os.fstat(descriptor_fd))
                          final_path = self.fixed_mirror_file_identity(os.lstat(FIXED_MIRROR_DESCRIPTOR_PATH))
                          final_parents = [self.fixed_mirror_directory('/etc'), self.fixed_mirror_directory('/etc/apt')]
                          if opened_identity != final_opened_identity or final_opened_identity != final_path or initial_parents != final_parents:
                              raise self.fixed_mirror_refusal('descriptor-raced')
                      finally:
                          os.close(descriptor_fd)
                  except AcquisitionError:
                      raise
                  except (OSError, ValueError, TypeError, AttributeError) as error:
                      raise self.fixed_mirror_refusal('descriptor-unavailable', error) from None
                  data = bytes(data)
                  if len(data) != len(FIXED_MIRROR_DESCRIPTOR_BYTES) or hashlib.sha256(data).hexdigest() != FIXED_MIRROR_DESCRIPTOR_SHA256 or data != FIXED_MIRROR_DESCRIPTOR_BYTES:
                      raise self.fixed_mirror_refusal('descriptor-content-mismatch')
                  uri_results = []
                  for uri in FIXED_MIRROR_URIS:
                      try:
                          uri_results.append(self.official_uri(uri))
                      except Exception:
                          uri_results.append(False)
                  if not all(uri_results):
                      raise self.fixed_mirror_refusal('descriptor-uri-policy')
                  return {
                      'path': FIXED_MIRROR_DESCRIPTOR_PATH,
                      'sha256': FIXED_MIRROR_DESCRIPTOR_SHA256,
                      'size': len(FIXED_MIRROR_DESCRIPTOR_BYTES),
                      'identity': final_opened_identity,
                      'validated_uri_count': len(FIXED_MIRROR_URIS),
                      'resolved_uri': FIXED_MIRROR_RESOLVED_URI,
                  }

              def fixed_mirror_telemetry(self, descriptor=None, error=None):
                  if descriptor is not None:
                      return {
                          'path': FIXED_MIRROR_DESCRIPTOR_PATH,
                          'sha256': FIXED_MIRROR_DESCRIPTOR_SHA256,
                          'size': len(FIXED_MIRROR_DESCRIPTOR_BYTES),
                          'identity': descriptor['identity'],
                          'validated_uri_count': len(FIXED_MIRROR_URIS),
                          'resolved_uri': FIXED_MIRROR_RESOLVED_URI,
                      }
                  code = getattr(error, 'descriptor_code', 'descriptor-unavailable')
                  if code not in FIXED_MIRROR_REFUSAL_CODES:
                      code = 'descriptor-unavailable'
                  return {'path': FIXED_MIRROR_DESCRIPTOR_PATH, 'refusal': code}

              @staticmethod
              def fixed_mirror_binding(descriptor):
                  return {
                      'uri': FIXED_MIRROR_DESCRIPTOR_URI,
                      'descriptor': json.loads(canonical(descriptor)),
                      'resolved_uri': descriptor['resolved_uri'].rstrip('/'),
                  }

              def retain_initial_fixed_mirror_binding(self, descriptor):
                  binding = self.fixed_mirror_binding(descriptor)
                  initial = getattr(self, 'initial_fixed_mirror_binding', None)
                  if initial is None:
                      self.initial_fixed_mirror_binding = binding
                  elif canonical(initial) != canonical(binding):
                      self.fixed_mirror_binding_unsafe = True
                  return binding

              def fixed_mirror_source(self, uri, suite, components, architectures, retain_initial=True):
                  if uri != FIXED_MIRROR_DESCRIPTOR_URI:
                      return {'uri': uri.rstrip('/'), 'suite': suite, 'components': components, 'architectures': architectures}, None
                  descriptor = self.fixed_mirror_descriptor()
                  if retain_initial:
                      self.retain_initial_fixed_mirror_binding(descriptor)
                  return {
                      'uri': uri,
                      'suite': suite,
                      'components': components,
                      'architectures': architectures,
                      'descriptor': descriptor,
                      'resolved_uri': descriptor['resolved_uri'].rstrip('/'),
                  }, descriptor

              def source_telemetry(self, phase):
                  return {
                      'schema_version': 1,
                      'phase': phase,
                      'counts': {'discovered': 0, 'read': 0, 'selected': 0, 'rejected': 0},
                      'details_truncated': False,
                      'details': [],
                      'terminal_failure': None,
                      'fixed_mirror_descriptor': None,
                  }

              def source_event(self, telemetry, location, format_name, entry, outcome, code, uri=None, suite=None, architectures=None, error=None, descriptor=None):
                  if outcome == 'selected':
                      telemetry['counts']['selected'] += 1
                  else:
                      telemetry['counts']['rejected'] += 1
                  try:
                      value = {'location': location, 'format': format_name, 'entry': entry, 'outcome': outcome, 'code': code}
                      if uri is not None:
                          value['host'] = self.source_host(uri)
                      if suite is not None:
                          value['suite'] = self.source_suite(suite)
                      if architectures is not None:
                          value['architectures'] = self.source_architectures(architectures)
                      errno = getattr(error, 'errno', None)
                      if isinstance(errno, int):
                          value['errno'] = errno
                      if descriptor is not None:
                          telemetry['fixed_mirror_descriptor'] = descriptor
                  except Exception:
                      value = {'location': location, 'format': format_name, 'entry': entry, 'outcome': outcome, 'code': 'telemetry-redacted'}
                  if len(telemetry['details']) < SOURCE_TELEMETRY_PHASE_NORMAL_RECORD_LIMIT:
                      telemetry['details'].append(value)
                      return
                  telemetry['details_truncated'] = True
                  if outcome != 'selected':
                      telemetry['terminal_failure'] = value

              def source_telemetry_value(self, telemetry):
                  details = list(telemetry['details'])
                  if telemetry['terminal_failure'] is not None:
                      details.append(telemetry['terminal_failure'])
                  return {
                      'schema_version': telemetry['schema_version'],
                      'phase': telemetry['phase'],
                      'counts': telemetry['counts'],
                      'details_truncated': telemetry['details_truncated'],
                      'details': details,
                      'fixed_mirror_descriptor': telemetry['fixed_mirror_descriptor'],
                  }

              def persist_source_telemetry(self, telemetry):
                  name = 'source-selection.json' if telemetry['phase'] == 'initial' else 'source-selection-post-audit.json'
                  while True:
                      encoded = (canonical(self.source_telemetry_value(telemetry)) + '\n').encode('utf-8')
                      if len(encoded) <= SOURCE_TELEMETRY_PHASE_LIMIT:
                          self.evidence.write_exact(name, encoded)
                          return
                      if telemetry['details']:
                          telemetry['details'].pop()
                          telemetry['details_truncated'] = True
                          continue
                      if telemetry['terminal_failure'] is not None:
                          raise AcquisitionError('source-selection failure telemetry exceeded its evidence bound')
                      if not telemetry['details']:
                          raise AcquisitionError('source-selection telemetry exceeded its evidence bound')

              def select_sources(self, root=Path('/etc/apt'), observation='initial'):
                  telemetry = self.source_telemetry(observation)
                  records = []
                  descriptor_failure = None
                  list_directory = root / 'sources.list.d'
                  paths = [(root / 'sources.list', 'list'), *[(path, 'list') for path in sorted(list_directory.glob('*.list'))], *[(path, 'deb822') for path in sorted(list_directory.glob('*.sources'))]]
                  try:
                      for ordinal, (path, format_name) in enumerate(paths, 1):
                          location = self.source_location(root, path, ordinal)
                          if not path.exists():
                              if path == root / 'sources.list':
                                  self.source_event(telemetry, location, format_name, 0, 'rejected', 'missing')
                              continue
                          telemetry['counts']['discovered'] += 1
                          try:
                              content = path.read_text()
                          except Exception as error:
                              self.source_event(telemetry, location, format_name, 0, 'rejected', 'read-error', error=error)
                              raise
                          telemetry['counts']['read'] += 1
                          if format_name == 'list':
                              for line_number, raw in enumerate(content.splitlines(), 1):
                                  line = raw.strip()
                                  if not line or line.startswith('#'):
                                      continue
                                  if not line.startswith('deb '):
                                      if line.startswith('deb-src'):
                                          self.source_event(telemetry, location, format_name, line_number, 'rejected', 'no-binary-type')
                                      continue
                                  match = re.fullmatch(r'deb\s+(?:\[([^]]+)\]\s+)?(\S+)\s+(\S+)(?:\s+(.+))?', line)
                                  if not match:
                                      self.source_event(telemetry, location, format_name, line_number, 'rejected', 'malformed-format')
                                      continue
                                  options, uri, suite, components = match.groups()
                                  option_text = (options or '').lower()
                                  architectures = re.search(r'(?:^|\s)arch=([^\s]+)', options or '', re.I)
                                  architecture_value = architectures.group(1) if architectures else None
                                  if 'trusted=yes' in option_text:
                                      self.source_event(telemetry, location, format_name, line_number, 'rejected', 'insecure-trust', uri, suite, architecture_value)
                                      continue
                                  values = (components or '').split()
                                  if uri == FIXED_MIRROR_DESCRIPTOR_URI and suite and values:
                                      try:
                                          record, descriptor = self.fixed_mirror_source(uri, suite, values, architecture_value, observation == 'initial')
                                      except AcquisitionError as error:
                                          descriptor_failure = descriptor_failure or error
                                          self.source_event(telemetry, location, format_name, line_number, 'rejected', 'fixed-mirror-descriptor-refused', uri, suite, architecture_value, error=error, descriptor=self.fixed_mirror_telemetry(error=error))
                                          continue
                                  elif uri == FIXED_MIRROR_DESCRIPTOR_URI:
                                      self.source_event(telemetry, location, format_name, line_number, 'rejected', 'empty-suite-or-components', uri, suite, architecture_value)
                                      continue
                                  else:
                                      try:
                                          official = self.official_uri(uri)
                                      except Exception as error:
                                          self.source_event(telemetry, location, format_name, line_number, 'rejected', 'uri-parse-failure', error=error)
                                          raise
                                      if not official:
                                          self.source_event(telemetry, location, format_name, line_number, 'rejected', 'nonofficial-or-malformed-uri', uri, suite, architecture_value)
                                          continue
                                      record, descriptor = self.fixed_mirror_source(uri, suite, values, architecture_value, observation == 'initial')
                                  records.append(record)
                                  self.source_event(telemetry, location, format_name, line_number, 'selected' if suite and values else 'rejected', 'selected' if suite and values else 'empty-suite-or-components', uri, suite, architecture_value, descriptor=self.fixed_mirror_telemetry(descriptor=descriptor) if descriptor else None)
                          else:
                              for stanza_number, stanza in enumerate(re.split(r'\n\s*\n', content), 1):
                                  fields = {}
                                  for raw in stanza.splitlines():
                                      if ':' in raw:
                                          key, value = raw.split(':', 1)
                                          fields[key.lower()] = value.strip()
                                  if not fields:
                                      if stanza.strip():
                                          self.source_event(telemetry, location, format_name, stanza_number, 'rejected', 'malformed-format')
                                      continue
                                  if 'deb' not in fields.get('types', '').split():
                                      self.source_event(telemetry, location, format_name, stanza_number, 'rejected', 'no-binary-type')
                                      continue
                                  if fields.get('enabled', 'yes').lower() in {'no', 'false'}:
                                      self.source_event(telemetry, location, format_name, stanza_number, 'rejected', 'disabled')
                                      continue
                                  if fields.get('trusted', '').lower() == 'yes':
                                      self.source_event(telemetry, location, format_name, stanza_number, 'rejected', 'insecure-trust')
                                      continue
                                  uris = fields.get('uris', '').split()
                                  suites = fields.get('suites', '').split()
                                  components = fields.get('components', '').split()
                                  if not uris:
                                      self.source_event(telemetry, location, format_name, stanza_number, 'rejected', 'missing-uri')
                                  if not suites or not components:
                                      self.source_event(telemetry, location, format_name, stanza_number, 'rejected', 'empty-suite-or-components')
                                  for uri in uris:
                                      for suite in suites:
                                          if uri == FIXED_MIRROR_DESCRIPTOR_URI and suite and components:
                                              try:
                                                  record, descriptor = self.fixed_mirror_source(uri, suite, components, fields.get('architectures'), observation == 'initial')
                                              except AcquisitionError as error:
                                                  descriptor_failure = descriptor_failure or error
                                                  self.source_event(telemetry, location, format_name, stanza_number, 'rejected', 'fixed-mirror-descriptor-refused', uri, suite, fields.get('architectures'), error=error, descriptor=self.fixed_mirror_telemetry(error=error))
                                                  continue
                                          elif uri == FIXED_MIRROR_DESCRIPTOR_URI:
                                              self.source_event(telemetry, location, format_name, stanza_number, 'rejected', 'empty-suite-or-components', uri, suite, fields.get('architectures'))
                                              continue
                                          else:
                                              try:
                                                  official = self.official_uri(uri)
                                              except Exception as error:
                                                  self.source_event(telemetry, location, format_name, stanza_number, 'rejected', 'uri-parse-failure', error=error)
                                                  raise
                                              if not official:
                                                  self.source_event(telemetry, location, format_name, stanza_number, 'rejected', 'nonofficial-or-malformed-uri', uri, suite, fields.get('architectures'))
                                                  continue
                                              record, descriptor = self.fixed_mirror_source(uri, suite, components, fields.get('architectures'), observation == 'initial')
                                          records.append(record)
                                          self.source_event(telemetry, location, format_name, stanza_number, 'selected' if suite and components else 'rejected', 'selected' if suite and components else 'empty-suite-or-components', uri, suite, fields.get('architectures'), descriptor=self.fixed_mirror_telemetry(descriptor=descriptor) if descriptor else None)
                      records = [record for record in records if record['suite'] and record['components']]
                      if descriptor_failure is not None:
                          raise descriptor_failure
                      if not records:
                          raise AcquisitionError('no supported already-configured official Ubuntu binary source', code='no-supported-source')
                      return records
                  finally:
                      self.persist_source_telemetry(telemetry)

              def keyring_identity(self, packages, phase):
                  key_info = regular(KEYRING, 'Ubuntu archive keyring')
                  owner, owner_tuple = self.installed_owner(KEYRING, str(Path(KEYRING).resolve()), packages['installed'], phase)
                  return {'path': KEYRING, 'sha256': sha_file(KEYRING), 'size': key_info.st_size, 'owner': owner, 'owner_tuple': owner_tuple}

              def write_private_sources(self, sources, packages):
                  self.phase = 'keyring-qualification'
                  self.keyring = self.keyring_identity(packages, 'keyring-owner')
                  self.phase = 'private-source-write'
                  destination = self.work / 'selected.list'
                  lines = []
                  for source in sources:
                      arch = f" arch={source['architectures'].replace(' ', ',')}" if source['architectures'] else ''
                      selected_uri = source.get('resolved_uri', source['uri'])
                      lines.append(f"deb [signed-by={KEYRING}{arch}] {selected_uri} {source['suite']} {' '.join(source['components'])}")
                  destination.write_text('\n'.join(lines) + '\n')
                  destination.chmod(0o600)
                  self.source_records = sources
                  return destination

              def apt_options(self, source_file):
                  lists = self.work / 'lists'
                  archives = self.work / 'archives'
                  lists.mkdir(mode=0o700, exist_ok=True)
                  archives.mkdir(mode=0o700, exist_ok=True)
                  (lists / 'partial').mkdir(mode=0o700, exist_ok=True)
                  (archives / 'partial').mkdir(mode=0o700, exist_ok=True)
                  return [
                      '-o', f'Dir::Etc::sourcelist={source_file}', '-o', 'Dir::Etc::sourceparts=-',
                      '-o', f'Dir::State::lists={lists}', '-o', f'Dir::Cache::archives={archives}',
                      '-o', f'Dir::Cache::pkgcache={self.work / "pkgcache.bin"}', '-o', f'Dir::Cache::srcpkgcache={self.work / "srcpkgcache.bin"}',
                      '-o', 'Acquire::Retries=0', '-o', 'Acquire::http::Timeout=10', '-o', 'Acquire::https::Timeout=10',
                      '-o', 'Acquire::AllowInsecureRepositories=false', '-o', 'Acquire::AllowDowngradeToInsecureRepositories=false',
                      '-o', 'APT::Get::AllowUnauthenticated=false', '-o', 'APT::Update::Error-Mode=any', '-o', 'DPkg::Lock::Timeout=5',
                  ]

              @staticmethod
              def package_key(name, arch):
                  return name if ':' in name else f'{name}:{arch}'

              def parse_solver(self, output, installed, native_arch='arm64'):
                  plan, configured = {}, set()
                  summary = None
                  for raw in output.splitlines():
                      line = raw.strip()
                      if re.match(r'^(Remv|Purg)\s+', line):
                          raise AcquisitionError('solver proposed removal or purge')
                      if line.startswith('Inst '):
                          if re.match(r'^Inst\s+\S+\s+\[', line):
                              raise AcquisitionError('solver proposed an existing-package transition')
                          match = re.match(r'^Inst\s+(\S+)\s+\(([^ )]+)(?:[^)]*)\)', line)
                          if not match:
                              raise AcquisitionError('solver installation line is malformed')
                          name, version = match.groups()
                          brackets = re.findall(r'\[([A-Za-z0-9_-]+)\]', line)
                          arch = brackets[-1] if brackets else native_arch
                          key = self.package_key(name, arch)
                          if key in installed or key in plan:
                              raise AcquisitionError('solver proposed an installed or duplicate package')
                          plan[key] = {'package': key, 'version': version, 'architecture': arch}
                      elif line.startswith('Conf '):
                          name = line.split()[1]
                          matches = [key for key in plan if key == name or key.split(':', 1)[0] == name]
                          if len(matches) != 1:
                              raise AcquisitionError('solver configured an unplanned package')
                          configured.add(matches[0])
                      elif re.fullmatch(r'\d+ upgraded, \d+ newly installed, \d+ to remove and \d+ not upgraded\.', line):
                          summary = tuple(int(value) for value in re.findall(r'\d+', line))
                  if not plan or not any(item['package'].split(':', 1)[0] == 'gdb' for item in plan.values()):
                      raise AcquisitionError('solver plan does not install gdb')
                  if configured != set(plan) or summary is None or summary[0] != 0 or summary[2] != 0 or summary[1] != len(plan):
                      raise AcquisitionError('solver summary or configuration set does not match the new-only plan')
                  return [plan[key] for key in sorted(plan)]

              def control_stanzas(self, text):
                  stanzas = []
                  for block in re.split(r'\n\s*\n', text):
                      fields = {}
                      for line in block.splitlines():
                          if ':' in line:
                              key, value = line.split(':', 1)
                              fields[key] = value.strip()
                      if fields:
                          stanzas.append(fields)
                  return stanzas

              def metadata_for_plan(self, options, plan):
                  metadata = []
                  for item in plan:
                      result = self.require(['/usr/bin/apt-cache', *options, 'show', f"{item['package']}={item['version']}"], 'authenticated-metadata', 12)
                      matching = [fields for fields in self.control_stanzas(result.stdout.decode('utf-8', 'replace')) if fields.get('Package') == item['package'].split(':', 1)[0] and fields.get('Version') == item['version'] and fields.get('Architecture') == item['architecture']]
                      if len(matching) != 1:
                          raise AcquisitionError('authenticated package metadata is ambiguous')
                      fields = matching[0]
                      if not re.fullmatch(r'[a-f0-9]{64}', fields.get('SHA256', '')) or not fields.get('Filename') or not fields.get('Size', '').isdigit() or int(fields['Size']) <= 0 or fields['Filename'].startswith('/') or '..' in Path(fields['Filename']).parts:
                          raise AcquisitionError('authenticated package metadata is incomplete')
                      metadata.append({**item, 'filename': fields['Filename'], 'size': int(fields['Size']), 'sha256': fields['SHA256']})
                  return metadata

              def uri_is_selected(self, uri):
                  parsed = urlparse(uri)
                  for source in self.source_records:
                      selected = urlparse(source.get('resolved_uri', source['uri']))
                      if parsed.scheme == selected.scheme and parsed.netloc == selected.netloc and parsed.path.startswith(selected.path.rstrip('/') + '/'):
                          return True
                  return False

              def parse_print_uris(self, output, metadata):
                  seen = {}
                  for line in output.splitlines():
                      match = re.match(r"^'([^']+)'\s+(\S+)\s+(\d+)\s+", line.strip())
                      if not match:
                          continue
                      uri, filename, size = match.groups()
                      if not self.official_uri(uri) or not self.uri_is_selected(uri):
                          raise AcquisitionError('print-uris selected an untrusted repository')
                      seen[filename] = {'uri': uri, 'size': int(size)}
                  expected = {Path(item['filename']).name: item for item in metadata}
                  if set(seen) != set(expected):
                      raise AcquisitionError('print-uris download set differs from frozen plan')
                  for filename, item in expected.items():
                      if seen[filename]['size'] != item['size']:
                          raise AcquisitionError('print-uris size differs from authenticated metadata')
                  return seen

              def inspect_debs(self, metadata):
                  archives = self.work / 'archives'
                  expected = {Path(item['filename']).name: item for item in metadata}
                  debs = sorted(path for path in archives.iterdir() if path.suffix == '.deb')
                  if {path.name for path in debs} != set(expected):
                      raise AcquisitionError('downloaded deb set differs from frozen plan')
                  selected = []
                  for deb in debs:
                      info = regular(deb, 'downloaded deb')
                      item = expected[deb.name]
                      if info.st_size != item['size'] or sha_file(deb) != item['sha256']:
                          raise AcquisitionError('downloaded deb identity differs from authenticated metadata')
                      fields = self.require(['/usr/bin/dpkg-deb', '--field', str(deb), 'Package', 'Version', 'Architecture'], 'deb-identity', 8).stdout.decode('utf-8', 'replace')
                      parsed = {key: value.strip() for key, value in (line.split(':', 1) for line in fields.splitlines() if ': ' in line)}
                      if parsed.get('Package') != item['package'].split(':', 1)[0] or parsed.get('Version') != item['version'] or parsed.get('Architecture') != item['architecture']:
                          raise AcquisitionError('downloaded deb control identity differs from frozen plan')
                      selected.append(str(deb.resolve()))
                  return selected

              def measure(self, phase):
                  packages = self.package_inventory(phase)
                  runtime = self.runtime_snapshot(packages, phase)
                  return {'packages': packages, 'runtime': runtime, 'runtime_sha256': sha_text(canonical(runtime))}

              def compare_postimage(self, preimage, postimage, plan):
                  if preimage['packages']['installed']:
                      if any(postimage['packages']['installed'].get(key) != value for key, value in preimage['packages']['installed'].items()):
                          return False
                  planned = {item['package']: item for item in plan}
                  additions = {key: value for key, value in postimage['packages']['installed'].items() if key not in preimage['packages']['installed']}
                  if not set(additions).issubset(planned) or any(
                      additions[key].get('version') != planned[key]['version'] or
                      additions[key].get('architecture') != planned[key]['architecture'] or
                      not re.fullmatch(r'[hi]i\s*', additions[key].get('status', ''))
                      for key in additions
                  ):
                      return False
                  for key, value in preimage['packages']['residual'].items():
                      if key in planned:
                          continue
                      if postimage['packages']['residual'].get(key) != value:
                          return False
                  if {key: value for key, value in postimage['packages']['residual'].items() if key not in planned} != {key: value for key, value in preimage['packages']['residual'].items() if key not in planned}:
                      return False
                  return preimage['runtime'] == postimage['runtime']

              def plan_is_installed(self, postimage):
                  if postimage is None or not self.plan:
                      return False
                  installed = postimage['packages']['installed']
                  return all(
                      item['package'] in installed and
                      installed[item['package']].get('version') == item['version'] and
                      installed[item['package']].get('architecture') == item['architecture'] and
                      re.fullmatch(r'[hi]i\s*', installed[item['package']].get('status', ''))
                      for item in self.plan
                  )

              def execute(self):
                  self.phase = 'preimage'
                  image = self.image_identity()
                  self.image_codename = image.get('os_release', {}).get('VERSION_CODENAME')
                  self.preimage = self.measure('preimage')
                  self.evidence.write_json('preimage.json', {'image': image, **self.preimage})
                  self.gdb = self.trusted_gdb()
                  if self.gdb:
                      self.status = 'gdb-already-present'
                      return
                  self.phase = 'select-sources'
                  sources = self.select_sources()
                  self.phase = 'private-source-write'
                  source_file = self.write_private_sources(sources, self.preimage['packages'])
                  options = self.apt_options(source_file)
                  self.phase = 'metadata-refresh'
                  self.require(['/usr/bin/apt-get', *options, 'update'], 'apt-update', 30, privileged=True)
                  self.phase = 'solver-initial'
                  simulation = self.require(['/usr/bin/apt-get', *options, '--simulate', '--no-install-recommends', '--no-upgrade', '--no-remove', 'install', 'gdb'], 'solver-initial', 10, privileged=True)
                  self.plan = self.parse_solver(simulation.stdout.decode('utf-8', 'replace'), self.preimage['packages']['installed'])
                  self.phase = 'authenticated-metadata'
                  metadata = self.metadata_for_plan(options, self.plan)
                  specs = [f"{item['package']}={item['version']}" for item in metadata]
                  self.phase = 'print-uris'
                  printed = self.require(['/usr/bin/apt-get', *options, '--print-uris', '--download-only', '--yes', '--no-install-recommends', '--no-upgrade', '--no-remove', 'install', *specs], 'print-uris', 20, privileged=True)
                  uris = self.parse_print_uris(printed.stdout.decode('utf-8', 'replace'), metadata)
                  self.evidence.write_json('frozen-plan.json', {'plan': metadata, 'plan_sha256': sha_text(canonical(metadata)), 'uris': uris, 'sources': self.source_records, 'keyring': self.keyring})
                  self.phase = 'download-debs'
                  self.require(['/usr/bin/apt-get', *options, '--download-only', '--yes', '--no-install-recommends', '--no-upgrade', '--no-remove', 'install', *specs], 'download-debs', 55, privileged=True)
                  self.phase = 'deb-identity'
                  debs = self.inspect_debs(metadata)
                  self.phase = 'solver-frozen'
                  second = self.require(['/usr/bin/apt-get', *options, '--simulate', '--no-install-recommends', '--no-upgrade', '--no-remove', 'install', *specs], 'solver-frozen', 10, privileged=True)
                  if self.parse_solver(second.stdout.decode('utf-8', 'replace'), self.preimage['packages']['installed']) != self.plan:
                      raise AcquisitionError('second solver plan differs from the frozen new-only plan')
                  self.phase = 'preinstall-audit'
                  preinstall = self.measure('preinstall-audit')
                  if not self.compare_postimage(self.preimage, preinstall, []):
                      raise UnsafePostimage('pre-install package or target runtime drift')
                  self.phase = 'deb-identity'
                  debs = self.inspect_debs(metadata)
                  self.phase = 'offline-dpkg-install'
                  installed = self.run(['/usr/bin/dpkg', '--install', '--', *debs], 'offline-dpkg-install', 25, privileged=True)
                  if installed.code != 0 or installed.timed_out or not installed.capture_complete or not installed.stdout_complete or not installed.stderr_complete:
                      self.status = 'installation-incomplete'
                      if self.failure_stage is None:
                          self.failure_stage = 'offline-dpkg-install'
                          self.acquisition_reason = {
                              'code': 'installation-incomplete',
                              'message': 'offline debugger installation did not complete',
                              'error_type': 'Result',
                          }
                  else:
                      self.status = 'gdb-installed'

              def finish(self):
                  comparison = False
                  audit_error = None
                  self.post_fixed_mirror_binding = None
                  try:
                      if self.preimage is not None:
                          self.postimage = self.measure('postimage-audit')
                          self.evidence.write_json('postimage.json', self.postimage)
                          self.post_sources = self.select_sources(observation='post-audit') if self.source_records else None
                          initial_fixed_mirror_binding = getattr(self, 'initial_fixed_mirror_binding', None)
                          if initial_fixed_mirror_binding is not None:
                              self.post_fixed_mirror_binding = self.fixed_mirror_binding(self.fixed_mirror_descriptor())
                          self.post_keyring = self.keyring_identity(self.postimage['packages'], 'postimage-keyring') if self.keyring else None
                          comparison = self.compare_postimage(self.preimage, self.postimage, self.plan) and (
                              self.post_sources is None or canonical(self.source_records) == canonical(self.post_sources)
                          ) and (
                              initial_fixed_mirror_binding is None or (
                                  not getattr(self, 'fixed_mirror_binding_unsafe', False) and
                                  canonical(initial_fixed_mirror_binding) == canonical(self.post_fixed_mirror_binding)
                              )
                          ) and (
                              self.post_keyring is None or self.keyring == self.post_keyring
                          )
                  except Exception as error:
                      audit_error = self.sanitized_failure(error)
                  self.audit_error = audit_error
                  self.gdb = self.trusted_gdb()
                  if self.status == 'gdb-installed' and (not self.gdb or not self.plan_is_installed(self.postimage)):
                      self.status = 'installation-incomplete'
                      if self.failure_stage is None:
                          self.failure_stage = 'offline-dpkg-install'
                          self.acquisition_reason = {'code': 'installation-incomplete', 'message': 'frozen debugger plan was incomplete after a successful install exit', 'error_type': 'AcquisitionError'}
                  unchanged = comparison and audit_error is None
                  if not unchanged:
                      self.status = 'unsafe-or-unknown-postimage'
                  summary = {
                      'schema_version': 1,
                      'kind': 'slv-native-diagnostic-acquisition',
                      'stage': self.failure_stage or self.phase,
                      'failure_stage': self.failure_stage,
                      'acquisition_reason': self.acquisition_reason,
                      'status': self.status,
                      'runtime_unchanged': unchanged,
                      'plan_sha256': sha_text(canonical(self.plan)),
                      'plan': self.plan,
                      'commands': self.commands,
                      'preimage_sha256': self.preimage['packages']['sha256'] if self.preimage else None,
                      'postimage_sha256': self.postimage['packages']['sha256'] if self.postimage else None,
                      'runtime_preimage_sha256': self.preimage['runtime_sha256'] if self.preimage else None,
                      'runtime_postimage_sha256': self.postimage['runtime_sha256'] if self.postimage else None,
                      'sources_sha256': sha_text(canonical(self.source_records)) if self.source_records else None,
                      'post_sources_sha256': sha_text(canonical(self.post_sources)) if self.post_sources is not None else None,
                      'initial_fixed_mirror_binding': getattr(self, 'initial_fixed_mirror_binding', None),
                      'post_fixed_mirror_binding': self.post_fixed_mirror_binding,
                      'fixed_mirror_binding_unsafe': bool(getattr(self, 'fixed_mirror_binding_unsafe', False)),
                      'keyring': self.keyring,
                      'post_keyring': self.post_keyring,
                      'debugger': {'available': self.gdb is not None, 'path': self.gdb},
                      'controls_not_run': None if unchanged else 'unsafe-or-unknown-postimage',
                      'audit_error': audit_error,
                      'retained_bytes_before_summary': self.evidence.total,
                  }
                  self.evidence.write_json('acquisition-summary.json', summary, terminal=True)
                  if unchanged:
                      self.github_output.parent.mkdir(parents=True, exist_ok=True)
                      with self.github_output.open('a') as output:
                          output.write('runtime_unchanged=true\n')
                      return 0
                  with self.github_output.open('a') as output:
                      output.write('runtime_unchanged=false\n')
                  return 1

          def main():
              evidence, work, validated, github_output, seconds_remaining = sys.argv[1:]
              controller = Controller(evidence, work, validated, github_output, int(seconds_remaining))
              try:
                  controller.execute()
              except Exception as error:
                  controller.capture_acquisition_failure(error)
                  if not isinstance(error, UnsafePostimage):
                      controller.status = 'acquisition-declined-or-incomplete'
              raise SystemExit(controller.finish())

          if __name__ == '__main__':
              main()
          # END BOUNDED_GDB_ACQUISITION_CONTROLLER
          PY
      - name: Run bounded ARM native diagnostic
        id: run_native_diagnostic
        if: steps.acquire-debugger.outputs.runtime_unchanged == 'true'
        timeout-minutes: 13
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          set -euo pipefail
          deno run --frozen --allow-read --allow-write --allow-run --allow-env source-rebuild/diagnose-native.ts --artifact-root "$RUNNER_TEMP/arm-diagnostic-input" --out "$RUNNER_TEMP/arm-diagnostic-output" --diagnostic-context "$RUNNER_TEMP/arm-diagnostic-context.json" --reviewed-sha "$REVIEWED_SHA"
      - name: Finalize bounded ARM acquisition evidence
        if: ${{ always() && !cancelled() }}
        timeout-minutes: 1
        env:
          ACQUISITION_OUTCOME: ${{ steps.acquire-debugger.outcome }}
          HELPER_OUTCOME: ${{ steps.run_native_diagnostic.outcome }}
        run: |
          set -euo pipefail
          acquisition="$RUNNER_TEMP/arm-diagnostic-acquisition"
          if [ ! -f "$acquisition/acquisition-summary.json" ]; then
            jq -n --arg acquisition_outcome "$ACQUISITION_OUTCOME" --arg helper_outcome "$HELPER_OUTCOME" '{schema_version: 1, kind: "slv-native-diagnostic-acquisition", stage: "finalization", status: "acquisition-incomplete", runtime_unchanged: false, controls_not_run: "unsafe-or-unknown-acquisition", acquisition_outcome: $acquisition_outcome, helper_outcome: $helper_outcome}' > "$acquisition/finalization-summary.json"
          fi
      - name: Persist bounded ARM diagnostic evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 3
        with:
          name: slv-arm-runtime-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/arm-diagnostic-output
            ${{ runner.temp }}/arm-diagnostic-acquisition
          if-no-files-found: warn
          retention-days: 7

  build:
    needs: [
      resolve,
      test,
      source-materials,
      source-native-linux-x64,
      source-native-macos-x64,
      source-native-macos-arm64,
      source-arm-build,
      source-arm-merge,
    ]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.operation == 'source-native-diagnostic') && (needs.resolve.outputs.release_required == 'true' || github.event_name == 'pull_request') }}
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
            apple: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04-arm
            apple: false
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            apple: true
          - target: aarch64-apple-darwin
            runner: macos-15
            apple: true
    env:
      DENO_DIR: /tmp/slv-deno-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: denoland/setup-deno@01524fade784327df1a5ad1ead94235d392cd443 # v2.0.1
        with:
          deno-version: v2.9.3
      - name: Select the reviewed Xcode and macOS SDK
        if: matrix.apple
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 16.2'
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          test "$(xcrun --sdk macosx --show-sdk-version)" = 15.2
          test -d "$sdk_path"
          {
            echo "DEVELOPER_DIR=$DEVELOPER_DIR"
            echo "SLV_APPLE_SDK_PATH=$sdk_path"
          } >> "$GITHUB_ENV"
      - name: Download the test job's exact canonical notice artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.test.outputs.license_artifact_id }}
          merge-multiple: true
          path: dist/release-inputs
      - name: Download exact target proof records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.source-materials.outputs.artifact_id }},${{ needs.source-native-linux-x64.outputs.artifact_id }},${{ needs.source-native-macos-x64.outputs.artifact_id }},${{ needs.source-native-macos-arm64.outputs.artifact_id }},${{ needs.source-arm-merge.outputs.artifact_id }}
          merge-multiple: true
          path: dist/release-inputs
      - name: Download Linux x64 baseline runtime by exact artifact ID
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.source-native-linux-x64.outputs.runtime_artifact_id }}
          merge-multiple: true
          path: dist/release-inputs/runtime-source/x86_64-unknown-linux-gnu
      - name: Download Linux ARM baseline runtime by exact artifact ID
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.source-arm-build.outputs.runtime_artifact_id }}
          merge-multiple: true
          path: dist/release-inputs/runtime-source/aarch64-unknown-linux-gnu
      - name: Download macOS Intel baseline runtime by exact artifact ID
        if: matrix.target == 'x86_64-apple-darwin'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.source-native-macos-x64.outputs.runtime_artifact_id }}
          merge-multiple: true
          path: dist/release-inputs/runtime-source/x86_64-apple-darwin
      - name: Download macOS ARM baseline runtime by exact artifact ID
        if: matrix.target == 'aarch64-apple-darwin'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.source-native-macos-arm64.outputs.runtime_artifact_id }}
          merge-multiple: true
          path: dist/release-inputs/runtime-source/aarch64-apple-darwin
      - name: Compile and execute the source-bound native target
        run: |
          set -euo pipefail
          deno install --frozen --allow-scripts=npm:protobufjs@7.4.0
          test '${{ needs.test.outputs.license_producer_run_id }}' = '${{ github.run_id }}'
          deno run --frozen --allow-read scripts/release/release.ts verify-licenses '${{ needs.resolve.outputs.source_sha }}' '${{ github.run_id }}' '${{ needs.test.outputs.license_producer_attempt }}' '${{ needs.test.outputs.license_notice_sha256 }}'
          deno run --frozen --allow-read scripts/release/source-materials.ts verify-source-proofs dist/release-inputs/source-materials-receipt.json dist/release-inputs/source-materials dist/release-inputs/source-proofs '${{ needs.resolve.outputs.source_sha }}' source-materials/pins.json dist/release-inputs/tool-pins dist/release-inputs/THIRD_PARTY_NOTICES
          deno run --frozen --allow-read scripts/release/workflow.ts verify-baseline-runtime '${{ matrix.target }}' '${{ needs.resolve.outputs.source_sha }}' dist/release-inputs/source-materials-receipt.json "dist/release-inputs/source-proofs/${{ matrix.target }}/native-proof.json" "dist/release-inputs/runtime-source/${{ matrix.target }}" > runtime.env
          runtime_value() { sed -n "s/^$1=//p" runtime.env | head -n 1; }
          runtime_path="$(runtime_value runtime_path)"
          baseline_denort_sha256="$(runtime_value baseline_denort_sha256)"
          bridge_path="$(runtime_value bridge_path)"
          baseline_bridge_sha256="$(runtime_value baseline_bridge_sha256)"
          source_selected_cargo_lock_sha256="$(runtime_value source_selected_cargo_lock_sha256)"
          derived_relink_cargo_lock_sha256="$(runtime_value derived_relink_cargo_lock_sha256)"
          source_receipt_sha256="$(runtime_value source_receipt_sha256)"
          native_proof_sha256="$(runtime_value native_proof_sha256)"
          build_receipt_sha256="$(runtime_value build_receipt_sha256)"
          for value in "$runtime_path" "$baseline_denort_sha256" "$bridge_path" "$baseline_bridge_sha256" "$source_selected_cargo_lock_sha256" "$derived_relink_cargo_lock_sha256" "$source_receipt_sha256" "$native_proof_sha256" "$build_receipt_sha256"; do test -n "$value"; done
          test -f "$runtime_path"
          test -f "$bridge_path"
          if command -v sha256sum >/dev/null; then runtime_sha256="$(sha256sum "$runtime_path" | awk '{print $1}')"; else runtime_sha256="$(shasum -a 256 "$runtime_path" | awk '{print $1}')"; fi
          if command -v sha256sum >/dev/null; then bridge_sha256="$(sha256sum "$bridge_path" | awk '{print $1}')"; else bridge_sha256="$(shasum -a 256 "$bridge_path" | awk '{print $1}')"; fi
          test "$runtime_sha256" = "$baseline_denort_sha256"
          test "$bridge_sha256" = "$baseline_bridge_sha256"
          # Artifact extraction deliberately does not preserve executable bits.
          # The source proof and canonical bytes above are complete before this
          # one-file mode restoration; no other downloaded entry is executable.
          chmod u+x "$runtime_path" "$bridge_path"
          test -x "$runtime_path"
          test -x "$bridge_path"
          deno check --frozen --cached-only cli/src/index.ts
          mkdir -p dist "dist/release-inputs/product-runtime/${{ matrix.target }}"
          DENORT_BIN="$runtime_path" deno compile --frozen --cached-only -A --include cli/lib/release/engine.py --include dist/release-inputs/THIRD_PARTY_NOTICES --target '${{ matrix.target }}' --output 'dist/slv-${{ matrix.target }}-exe' cli/src/index.ts
          'dist/slv-${{ matrix.target }}-exe' --version
          private_home="$RUNNER_TEMP/slv-licenses-${{ matrix.target }}"
          mkdir -p "$private_home"
          env -i PATH="$PATH" HOME="$private_home" 'dist/slv-${{ matrix.target }}-exe' licenses > 'dist/slv-${{ matrix.target }}-licenses'
          cmp dist/release-inputs/THIRD_PARTY_NOTICES 'dist/slv-${{ matrix.target }}-licenses'
          'dist/slv-${{ matrix.target }}-exe' --help >/dev/null
          deno run --frozen --cached-only --allow-read --allow-write --allow-run --allow-env cli/lib/release/compiled_bridge_smoke.ts
          "$bridge_path"
          if [ '${{ matrix.target }}' = x86_64-unknown-linux-gnu ] || [ '${{ matrix.target }}' = aarch64-unknown-linux-gnu ]; then
            target='${{ matrix.target }}'
            product_executable="$(pwd -P)/dist/slv-$target-exe"
            execution_tools_root="$RUNNER_TEMP/product-execution-tools/$target"
            execution_tools_receipt="$RUNNER_TEMP/product-execution-tools/$target-receipt.json"
            deno run --frozen --allow-read --allow-write --allow-run --allow-env --allow-net source-rebuild/prepare-tools.ts --target "$target" --build-host "$target" --purpose execution --pins source-rebuild/tool-prereqs.json --out "$execution_tools_root" --receipt "$execution_tools_receipt" --descriptor "dist/release-inputs/tool-pins/$target.json"
            compatibility_dir="dist/release-inputs/product-runtime/$target/linux-compatibility"
            deno run --frozen --allow-read --allow-write --allow-run --allow-env source-rebuild/verify-linux-product.ts --target "$target" --build-receipt "dist/release-inputs/runtime-source/$target/build-receipt.json" --native-proof "dist/release-inputs/source-proofs/$target/native-proof.json" --runtime-dir "dist/release-inputs/runtime-source/$target/transport" --tools-receipt "$execution_tools_receipt" --executable "$product_executable" --bridge "$bridge_path" --out "$compatibility_dir"
            cp "$compatibility_dir/linux-compatibility-receipt.json" "dist/release-inputs/product-runtime/$target/linux-compatibility-receipt.json"
            cp "$bridge_path" "dist/release-inputs/product-runtime/$target/release-bridge-smoke"
          fi
          deno run --frozen --allow-read --allow-write scripts/release/release.ts executable 'dist/slv-${{ matrix.target }}-exe' 'dist/slv-${{ matrix.target }}-exe.tar.gz' 'slv-${{ matrix.target }}-exe'
          executable_sha256="$(if command -v sha256sum >/dev/null; then sha256sum 'dist/slv-${{ matrix.target }}-exe' | awk '{print $1}'; else shasum -a 256 'dist/slv-${{ matrix.target }}-exe' | awk '{print $1}'; fi)"
          executable_tar_sha256="$(if command -v sha256sum >/dev/null; then sha256sum 'dist/slv-${{ matrix.target }}-exe.tar.gz' | awk '{print $1}'; else shasum -a 256 'dist/slv-${{ matrix.target }}-exe.tar.gz' | awk '{print $1}'; fi)"
          jq -n --arg target '${{ matrix.target }}' --arg executable_sha256 "$executable_sha256" --arg executable_tar_sha256 "$executable_tar_sha256" --arg baseline_denort_sha256 "$baseline_denort_sha256" --arg source_selected_cargo_lock_sha256 "$source_selected_cargo_lock_sha256" --arg derived_relink_cargo_lock_sha256 "$derived_relink_cargo_lock_sha256" --arg source_receipt_sha256 "$source_receipt_sha256" --arg native_proof_sha256 "$native_proof_sha256" --arg build_receipt_sha256 "$build_receipt_sha256" '{schema_version: 1, kind: "slv-product-runtime-receipt", target: $target, executable_sha256: $executable_sha256, executable_tar_sha256: $executable_tar_sha256, baseline_denort_sha256: $baseline_denort_sha256, source_selected_cargo_lock_sha256: $source_selected_cargo_lock_sha256, derived_relink_cargo_lock_sha256: $derived_relink_cargo_lock_sha256, source_receipt_sha256: $source_receipt_sha256, native_proof_sha256: $native_proof_sha256, build_receipt_sha256: $build_receipt_sha256}' > "dist/release-inputs/product-runtime/${{ matrix.target }}/product-runtime-receipt.json"
      - name: Persist the exact target archive and runtime receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slv-product-${{ matrix.target }}-${{ github.run_id }}
          path: |
            dist/slv-${{ matrix.target }}-exe.tar.gz
            dist/release-inputs/product-runtime/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  source-materials:
    needs: [resolve, test]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.operation == 'source-native-diagnostic') && (needs.resolve.outputs.release_required == 'true' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-source-materials.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-source-materials.outputs.artifact-digest }}
      producer_run_id: ${{ github.run_id }}
      producer_attempt: ${{ github.run_attempt }}
      receipt_sha256: ${{ steps.stage.outputs.receipt_sha256 }}
    env:
      DENO_DIR: /tmp/slv-deno-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: denoland/setup-deno@01524fade784327df1a5ad1ead94235d392cd443 # v2.0.1
        with:
          deno-version: v2.9.3
      - name: Download the test job's exact canonical notice artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.test.outputs.license_artifact_id }}
          merge-multiple: true
          path: dist/release-inputs
      - name: Freeze the three immutable source archives
        id: stage
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-logs"
          test '${{ needs.test.outputs.license_producer_run_id }}' = '${{ github.run_id }}'
          deno run --frozen --allow-read scripts/release/release.ts verify-licenses '${{ needs.resolve.outputs.source_sha }}' '${{ github.run_id }}' '${{ needs.test.outputs.license_producer_attempt }}' '${{ needs.test.outputs.license_notice_sha256 }}'
          # The source assembler consumes this clean checkout. dist/ is ignored,
          # so immutable staging never becomes an executable source input.
          test -z "$(git status --porcelain --untracked-files=no)"
          deno run --frozen --allow-read --allow-write --allow-run --allow-env --allow-net scripts/release/source-materials.ts package \
            --source-root "$GITHUB_WORKSPACE" \
            --source-commit '${{ needs.resolve.outputs.source_sha }}' \
            --pins source-materials/pins.json \
            --cache "$RUNNER_TEMP/source-acquisition-cache" \
            --work-dir "$RUNNER_TEMP/source-assembly" \
            --out dist/release-inputs/source-materials \
            --receipt dist/release-inputs/source-materials-receipt.json \
            --notice-file dist/release-inputs/THIRD_PARTY_NOTICES 2>&1 | tee "$RUNNER_TEMP/source-logs/source-materials.log"
          test -z "$(git status --porcelain --untracked-files=no)"
          receipt_sha256="$(sha256sum dist/release-inputs/source-materials-receipt.json | cut -d ' ' -f 1)"
          test -n "$receipt_sha256"
          echo "receipt_sha256=$receipt_sha256" >> "$GITHUB_OUTPUT"
      - name: Persist only the source receipt and three official source archives
        id: upload-source-materials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slv-source-materials-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/release-inputs/source-materials/slv-source.tar.gz
            dist/release-inputs/source-materials/deno-source.tar.gz
            dist/release-inputs/source-materials/deno-cargo-vendor.tar.gz
            dist/release-inputs/source-materials-receipt.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failed source-material diagnostics separately
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-materials-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-logs
          if-no-files-found: warn
          retention-days: 7

  # These are deliberately individual jobs, not a matrix. GitHub collapses
  # matrix outputs to a last writer; each target must expose its own immutable
  # artifact ID, archive digest, producer identity, and proof checksum.
  source-native-linux-x64:
    needs: [resolve, test, source-materials]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.operation == 'source-native-diagnostic') && (needs.resolve.outputs.release_required == 'true' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-proof.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-proof.outputs.artifact-digest }}
      runtime_artifact_id: ${{ steps.upload-runtime.outputs.artifact-id }}
      runtime_artifact_digest: ${{ steps.upload-runtime.outputs.artifact-digest }}
      producer_run_id: ${{ github.run_id }}
      producer_attempt: ${{ github.run_attempt }}
      proof_sha256: ${{ steps.proof.outputs.proof_sha256 }}
      baseline_runtime_sha256: ${{ steps.proof.outputs.baseline_runtime_sha256 }}
      baseline_derived_lock_sha256: ${{ steps.proof.outputs.baseline_derived_lock_sha256 }}
      build_receipt_sha256: ${{ steps.proof.outputs.build_receipt_sha256 }}
    env:
      DENO_DIR: /tmp/slv-deno-cache
      TARGET: x86_64-unknown-linux-gnu
      BUILD_HOST: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: denoland/setup-deno@01524fade784327df1a5ad1ead94235d392cd443 # v2.0.1
        with:
          deno-version: v2.9.3
      - name: Download exact notice and source-material artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.test.outputs.license_artifact_id }},${{ needs.source-materials.outputs.artifact_id }}
          merge-multiple: true
          path: dist/release-inputs
      - name: Reclaim only measured unused Linux runner SDKs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-logs"
          df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee "$RUNNER_TEMP/source-logs/capacity-before-cleanup.txt"
          du -sk /usr/local/lib/android /usr/share/dotnet 2>/dev/null | tee "$RUNNER_TEMP/source-logs/unused-sdk-before.txt" || true
          if [ -d /usr/local/lib/android ]; then sudo rm -rf /usr/local/lib/android; fi
          if [ -d /usr/share/dotnet ]; then sudo rm -rf /usr/share/dotnet; fi
          df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee "$RUNNER_TEMP/source-logs/capacity-after-cleanup.txt"
      - name: Build, execute, and merge the native source proof
        id: proof
        run: |
          set -euo pipefail
          resolve_host_python() {
            for candidate in "$(command -v python3 || true)" /usr/local/bin/python3 /usr/bin/python3; do
              test -n "$candidate" && test -x "$candidate" || continue
              "$candidate" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)' || continue
              "$candidate" -c 'import os, sys; print(os.path.realpath(sys.executable))'
              return 0
            done
            return 1
          }
          SLV_HOST_PYTHON="$(resolve_host_python)"
          test "${SLV_HOST_PYTHON#/}" != "$SLV_HOST_PYTHON"
          export SLV_HOST_PYTHON
          sha256_file() { sha256sum "$1" | awk '{print $1}'; }
          mkdir -p "$RUNNER_TEMP/source-logs" dist/release-inputs/source-proofs dist/release-inputs/tool-pins "$RUNNER_TEMP/source-tools"
          test '${{ needs.test.outputs.license_producer_run_id }}' = '${{ github.run_id }}'
          test '${{ needs.source-materials.outputs.producer_run_id }}' = '${{ github.run_id }}'
          test -n '${{ needs.source-materials.outputs.producer_attempt }}'
          test "$(sha256_file dist/release-inputs/source-materials-receipt.json)" = '${{ needs.source-materials.outputs.receipt_sha256 }}'
          deno run --frozen --allow-read scripts/release/release.ts verify-licenses '${{ needs.resolve.outputs.source_sha }}' '${{ github.run_id }}' '${{ needs.test.outputs.license_producer_attempt }}' '${{ needs.test.outputs.license_notice_sha256 }}'
          deno run --frozen --allow-read --allow-write --allow-run --allow-env --allow-net source-rebuild/prepare-tools.ts --target "$TARGET" --build-host "$BUILD_HOST" --purpose build --pins source-rebuild/tool-prereqs.json --out "$RUNNER_TEMP/source-tools/build" --receipt "$RUNNER_TEMP/build-tools.json" --descriptor "dist/release-inputs/tool-pins/$TARGET.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/prepare-build.log"
          deno run --frozen --allow-read --allow-write --allow-run --allow-env --allow-net source-rebuild/prepare-tools.ts --target "$TARGET" --build-host "$BUILD_HOST" --purpose execution --pins source-rebuild/tool-prereqs.json --out "$RUNNER_TEMP/source-tools/execution" --receipt "$RUNNER_TEMP/execution-tools.json" --descriptor "dist/release-inputs/tool-pins/$TARGET.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/prepare-execution.log"
          mkdir -p "dist/release-inputs/source-proofs/$TARGET"
          common=(--target "$TARGET" --build-host "$BUILD_HOST" --out "dist/release-inputs/source-proofs/$TARGET" --pins source-materials/pins.json --source-receipt dist/release-inputs/source-materials-receipt.json --slv-source dist/release-inputs/source-materials/slv-source.tar.gz --deno-source dist/release-inputs/source-materials/deno-source.tar.gz --cargo-vendor dist/release-inputs/source-materials/deno-cargo-vendor.tar.gz --notice-file dist/release-inputs/THIRD_PARTY_NOTICES)
          deno run --frozen --allow-read --allow-write --allow-run --allow-env source-rebuild/verify-native.ts --phase build "${common[@]}" --source-root "$RUNNER_TEMP/build-source-root" --work-dir "$RUNNER_TEMP/build-work" --tools-receipt "$RUNNER_TEMP/build-tools.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/build.log"
          deno run --frozen --allow-read --allow-write --allow-run --allow-env source-rebuild/verify-native.ts --phase execute "${common[@]}" --source-root "$RUNNER_TEMP/execute-source-root" --work-dir "$RUNNER_TEMP/execute-work" --build-receipt "dist/release-inputs/source-proofs/$TARGET/build-receipt.json" --build-materials "dist/release-inputs/source-proofs/$TARGET/transport" --execution-tools-receipt "$RUNNER_TEMP/execution-tools.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/execute.log"
          deno run --frozen --allow-read --allow-write --allow-run --allow-env source-rebuild/verify-native.ts --phase merge "${common[@]}" --source-root "$RUNNER_TEMP/merge-source-root" --work-dir "$RUNNER_TEMP/merge-work" --build-receipt "dist/release-inputs/source-proofs/$TARGET/build-receipt.json" --execution-receipt "dist/release-inputs/source-proofs/$TARGET/execution-receipt.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/merge.log"
          proof_sha256="$(sha256_file "dist/release-inputs/source-proofs/$TARGET/native-proof.json")"
          build_receipt="dist/release-inputs/source-proofs/$TARGET/build-receipt.json"
          baseline_runtime_sha256="$(jq -er '.artifacts.baseline.denort_sha256' "$build_receipt")"
          baseline_derived_lock_sha256="$(jq -er '.artifacts.baseline.derived_relink_cargo_lock_sha256' "$build_receipt")"
          build_receipt_sha256="$(sha256_file "$build_receipt")"
          test -n "$proof_sha256"
          {
            echo "proof_sha256=$proof_sha256"
            echo "baseline_runtime_sha256=$baseline_runtime_sha256"
            echo "baseline_derived_lock_sha256=$baseline_derived_lock_sha256"
            echo "build_receipt_sha256=$build_receipt_sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Persist the three phase receipts for the native proof
        id: upload-proof
