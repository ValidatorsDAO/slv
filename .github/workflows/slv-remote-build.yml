              "$candidate" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)' || continue
              "$candidate" -c 'import os, sys; print(os.path.realpath(sys.executable))'
              return 0
            done
            return 1
          }
          SLV_HOST_PYTHON="$(resolve_host_python)"
          test "${SLV_HOST_PYTHON#/}" != "$SLV_HOST_PYTHON"
          export SLV_HOST_PYTHON
          sha256_file() { shasum -a 256 "$1" | awk '{print $1}'; }
          mkdir -p "$RUNNER_TEMP/source-logs" "$RUNNER_TEMP/source-tools" dist/release-inputs/tool-pins
          date -u +%FT%TZ | tee "$RUNNER_TEMP/source-logs/variant-started-at.txt"
          df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee "$RUNNER_TEMP/source-logs/variant-capacity.txt"
          sysctl -n hw.ncpu | tee "$RUNNER_TEMP/source-logs/variant-cpu-count.txt"
          sysctl -n hw.memsize | tee "$RUNNER_TEMP/source-logs/variant-memory-bytes.txt"
          test '${{ needs.test.outputs.license_producer_run_id }}' = '${{ github.run_id }}'
          test '${{ needs.source-materials.outputs.producer_run_id }}' = '${{ github.run_id }}'
          test -n '${{ needs.source-materials.outputs.producer_attempt }}'
          test "$(sha256_file dist/release-inputs/source-materials-receipt.json)" = '${{ needs.source-materials.outputs.receipt_sha256 }}'
          deno run --frozen --allow-read scripts/release/release.ts verify-licenses '${{ needs.resolve.outputs.source_sha }}' '${{ github.run_id }}' '${{ needs.test.outputs.license_producer_attempt }}' '${{ needs.test.outputs.license_notice_sha256 }}'
          deno run --frozen --allow-read --allow-write --allow-run --allow-env --allow-net source-rebuild/prepare-tools.ts --target "$TARGET" --build-host "$BUILD_HOST" --purpose build --pins source-rebuild/tool-prereqs.json --out "$RUNNER_TEMP/source-tools/build" --receipt "$RUNNER_TEMP/build-tools.json" --descriptor "dist/release-inputs/tool-pins/$TARGET.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/prepare-build.log"
          variant_out="dist/release-inputs/source-variants/$TARGET/$VARIANT"
          test ! -e "$variant_out"
          common=(--target "$TARGET" --build-host "$BUILD_HOST" --out "$variant_out" --pins source-materials/pins.json --source-receipt dist/release-inputs/source-materials-receipt.json --slv-source dist/release-inputs/source-materials/slv-source.tar.gz --deno-source dist/release-inputs/source-materials/deno-source.tar.gz --cargo-vendor dist/release-inputs/source-materials/deno-cargo-vendor.tar.gz --notice-file dist/release-inputs/THIRD_PARTY_NOTICES)
          deno run --frozen --allow-read --allow-write --allow-run --allow-env source-rebuild/verify-native.ts --phase build-variant "${common[@]}" --variant "$VARIANT" --jobs 4 --source-root "$RUNNER_TEMP/build-source-root" --work-dir "$RUNNER_TEMP/build-work" --tools-receipt "$RUNNER_TEMP/build-tools.json" --producer-context "$RUNNER_TEMP/producer-context.json" --evidence-out "$RUNNER_TEMP/source-logs/source-evidence-$VARIANT" 2>&1 | tee "$RUNNER_TEMP/source-logs/build-$VARIANT.log"
          cp "dist/release-inputs/tool-pins/$TARGET.json" "$variant_out/tool-pin.json"
          test "$(sha256_file "$variant_out/build-tools-receipt.json")" = "$(jq -er '.tools_receipt_sha256' "$variant_out/variant-receipt.json")"
          test "$(sha256_file "$variant_out/tool-pin.json")" = "$(jq -er '.tool_pin_sha256' "$variant_out/variant-receipt.json")"
          variant_receipt_sha256="$(sha256_file "$variant_out/variant-receipt.json")"
          [[ "$variant_receipt_sha256" =~ ^[a-f0-9]{64}$ ]]
          echo "variant_receipt_sha256=$variant_receipt_sha256" >> "$GITHUB_OUTPUT"
          date -u +%FT%TZ | tee "$RUNNER_TEMP/source-logs/variant-finished-at.txt"
      - name: Persist the cold macOS x64 baseline variant
        id: upload-variant
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 10
        with:
          name: source-native-variant-x86_64-apple-darwin-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/release-inputs/source-variants/x86_64-apple-darwin/baseline/variant-receipt.json
            dist/release-inputs/source-variants/x86_64-apple-darwin/baseline/build-tools-receipt.json
            dist/release-inputs/source-variants/x86_64-apple-darwin/baseline/tool-pin.json
            dist/release-inputs/source-variants/x86_64-apple-darwin/baseline/transport
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve macOS x64 baseline variant diagnostics
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 5
        with:
          name: source-native-variant-diagnostics-x86_64-apple-darwin-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-logs
          if-no-files-found: warn
          retention-days: 7

  source-macos-x64-modified:
    needs: [resolve, test, source-materials]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.operation == 'source-native-diagnostic') && (needs.resolve.outputs.release_required == 'true' || github.event_name == 'pull_request') }}
    runs-on: macos-15-intel
    timeout-minutes: 350
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-variant.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-variant.outputs.artifact-digest }}
      variant_receipt_sha256: ${{ steps.variant.outputs.variant_receipt_sha256 }}
      producer_run_id: ${{ github.run_id }}
      producer_attempt: ${{ github.run_attempt }}
      producer_repository: ${{ github.repository }}
      producer_workflow: ${{ github.workflow_ref }}
      producer_job_id: ${{ github.job }}
    env:
      DENO_DIR: /tmp/slv-deno-cache
      TARGET: x86_64-apple-darwin
      BUILD_HOST: x86_64-apple-darwin
      VARIANT: modified
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
