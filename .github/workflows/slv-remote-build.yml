      - name: Persist the baseline-only runtime compiler input
        id: upload-runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slv-source-runtime-x86_64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/release-inputs/source-proofs/x86_64-unknown-linux-gnu/build-receipt.json
            dist/release-inputs/source-proofs/x86_64-unknown-linux-gnu/transport/manifest.json
            dist/release-inputs/source-proofs/x86_64-unknown-linux-gnu/transport/baseline-denort
            dist/release-inputs/source-proofs/x86_64-unknown-linux-gnu/transport/baseline-bridge
            dist/release-inputs/source-proofs/x86_64-unknown-linux-gnu/transport/baseline-derived-relink-Cargo.lock
