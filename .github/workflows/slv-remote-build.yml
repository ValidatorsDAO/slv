name: Runner execution check
run-name: Execution check ${{ inputs.correlation }}

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Single-use runner label
        required: true
        type: string
      correlation:
        description: Execution check identifier
        required: true
        type: string

permissions: {}

jobs:
  execution:
    if: github.repository == 'ValidatorsDAO/slv' && startsWith(inputs.runner_label, 'slv-job-')
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Execution check
        shell: bash
        env:
          CHECK_CORRELATION: ${{ inputs.correlation }}
        run: |
          set -euo pipefail
          [[ "$CHECK_CORRELATION" =~ ^[A-Za-z0-9_-]{1,80}$ ]]
          test "$(uname -s)" = Linux
          python3 - <<'PYTHON'
          import hashlib
          import time

          deadline = time.monotonic() + 20
          payload = b"execution-check"
          while time.monotonic() < deadline:
              payload = hashlib.sha256(payload).digest()
          print("Execution check passed.")
          PYTHON
