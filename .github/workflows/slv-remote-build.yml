      - name: Download exact notice, source, and ARM build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.test.outputs.license_artifact_id }},${{ needs.source-materials.outputs.artifact_id }},${{ needs.source-arm-build.outputs.artifact_id }}
          merge-multiple: true
          path: dist/release-inputs
      - name: Download the exact ARM execution receipt into its proof directory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.source-arm-execute.outputs.artifact_id }}
          merge-multiple: true
          path: dist/release-inputs/source-proofs/aarch64-unknown-linux-gnu
      - name: Merge only the checked ARM build and execution receipts
        id: merge
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-logs"
          test '${{ needs.test.outputs.license_producer_run_id }}' = '${{ github.run_id }}'
          test '${{ needs.source-materials.outputs.producer_run_id }}' = '${{ github.run_id }}'
          test '${{ needs.source-arm-build.outputs.producer_run_id }}' = '${{ github.run_id }}'
          test '${{ needs.source-arm-execute.outputs.producer_run_id }}' = '${{ github.run_id }}'
