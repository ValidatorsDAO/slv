          persist-credentials: false
      - uses: denoland/setup-deno@01524fade784327df1a5ad1ead94235d392cd443 # v2.0.1
        with:
          deno-version: v2.9.3
      - name: Select the reviewed Xcode and macOS SDK
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 16.2'
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          test "$(xcrun --sdk macosx --show-sdk-version)" = 15.2
          test -d "$sdk_path"
          {
            echo "DEVELOPER_DIR=$DEVELOPER_DIR"
            echo "SLV_APPLE_SDK_PATH=$sdk_path"
          } >> "$GITHUB_ENV"
      - name: Reclaim only the measured unused macOS SDK image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-logs"
          df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee "$RUNNER_TEMP/source-logs/capacity-before-cleanup.txt"
          du -sk /Applications/Xcode_16.2.app 2>/dev/null | tee "$RUNNER_TEMP/source-logs/active-xcode-before.txt"
          if [ -d /Applications/Xcode_16.4.app ]; then sudo rm -rf /Applications/Xcode_16.4.app; fi
          df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee "$RUNNER_TEMP/source-logs/capacity-after-cleanup.txt"
          du -sk /Applications/Xcode_16.2.app 2>/dev/null | tee "$RUNNER_TEMP/source-logs/active-xcode-after.txt"
      - name: Download exact notice and source-material artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.test.outputs.license_artifact_id }},${{ needs.source-materials.outputs.artifact_id }}
          merge-multiple: true
          path: dist/release-inputs
      - name: Create producer context
        env:
          PRODUCER_REPOSITORY: ${{ github.repository }}
          PRODUCER_WORKFLOW: ${{ github.workflow_ref }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_JOB_ID: ${{ github.job }}
        run: |
          set -euo pipefail
          jq -n --arg repository "$PRODUCER_REPOSITORY" --arg workflow "$PRODUCER_WORKFLOW" --arg run_id "$PRODUCER_RUN_ID" --arg run_attempt "$PRODUCER_RUN_ATTEMPT" --arg job_id "$PRODUCER_JOB_ID" \
            '{schema_version: 1, kind: "slv-native-producer-context", repository: $repository, workflow: $workflow, run_id: $run_id, run_attempt: $run_attempt, job_id: $job_id}' > "$RUNNER_TEMP/producer-context.json"
      - name: Build cold source variant
        id: variant
        timeout-minutes: 320
        run: |
          set -euo pipefail
          resolve_host_python() {
            for candidate in "$(command -v python3 || true)" /usr/local/bin/python3 /opt/homebrew/bin/python3 /usr/bin/python3; do
              test -n "$candidate" && test -x "$candidate" || continue
              "$candidate" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)' || continue
              "$candidate" -c 'import os, sys; print(os.path.realpath(sys.executable))'
              return 0
            done
            return 1
          }
          SLV_HOST_PYTHON="$(resolve_host_python)"
          test "${SLV_HOST_PYTHON#/}" != "$SLV_HOST_PYTHON"
          export SLV_HOST_PYTHON
          sha256_file() { shasum -a 256 "$1" | awk '{print $1}'; }
          mkdir -p "$RUNNER_TEMP/source-logs" "$RUNNER_TEMP/source-tools" dist/release-inputs/tool-pins
          date -u +%FT%TZ | tee "$RUNNER_TEMP/source-logs/variant-started-at.txt"
          df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee "$RUNNER_TEMP/source-logs/variant-capacity.txt"
          sysctl -n hw.ncpu | tee "$RUNNER_TEMP/source-logs/variant-cpu-count.txt"
          sysctl -n hw.memsize | tee "$RUNNER_TEMP/source-logs/variant-memory-bytes.txt"
          test '${{ needs.test.outputs.license_producer_run_id }}' = '${{ github.run_id }}'
          test '${{ needs.source-materials.outputs.producer_run_id }}' = '${{ github.run_id }}'
          test -n '${{ needs.source-materials.outputs.producer_attempt }}'
          test "$(sha256_file dist/release-inputs/source-materials-receipt.json)" = '${{ needs.source-materials.outputs.receipt_sha256 }}'
          deno run --frozen --allow-read scripts/release/release.ts verify-licenses '${{ needs.resolve.outputs.source_sha }}' '${{ github.run_id }}' '${{ needs.test.outputs.license_producer_attempt }}' '${{ needs.test.outputs.license_notice_sha256 }}'
          deno run --frozen --allow-read --allow-write --allow-run --allow-env --allow-net source-rebuild/prepare-tools.ts --target "$TARGET" --build-host "$BUILD_HOST" --purpose build --pins source-rebuild/tool-prereqs.json --out "$RUNNER_TEMP/source-tools/build" --receipt "$RUNNER_TEMP/build-tools.json" --descriptor "dist/release-inputs/tool-pins/$TARGET.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/prepare-build.log"
          variant_out="dist/release-inputs/source-variants/$TARGET/$VARIANT"
          test ! -e "$variant_out"
          common=(--target "$TARGET" --build-host "$BUILD_HOST" --out "$variant_out" --pins source-materials/pins.json --source-receipt dist/release-inputs/source-materials-receipt.json --slv-source dist/release-inputs/source-materials/slv-source.tar.gz --deno-source dist/release-inputs/source-materials/deno-source.tar.gz --cargo-vendor dist/release-inputs/source-materials/deno-cargo-vendor.tar.gz --notice-file dist/release-inputs/THIRD_PARTY_NOTICES)
          deno run --frozen --allow-read --allow-write --allow-run --allow-env source-rebuild/verify-native.ts --phase build-variant "${common[@]}" --variant "$VARIANT" --jobs 4 --source-root "$RUNNER_TEMP/build-source-root" --work-dir "$RUNNER_TEMP/build-work" --tools-receipt "$RUNNER_TEMP/build-tools.json" --producer-context "$RUNNER_TEMP/producer-context.json" --evidence-out "$RUNNER_TEMP/source-logs/source-evidence-$VARIANT" 2>&1 | tee "$RUNNER_TEMP/source-logs/build-$VARIANT.log"
          cp "dist/release-inputs/tool-pins/$TARGET.json" "$variant_out/tool-pin.json"
          test "$(sha256_file "$variant_out/build-tools-receipt.json")" = "$(jq -er '.tools_receipt_sha256' "$variant_out/variant-receipt.json")"
          test "$(sha256_file "$variant_out/tool-pin.json")" = "$(jq -er '.tool_pin_sha256' "$variant_out/variant-receipt.json")"
          variant_receipt_sha256="$(sha256_file "$variant_out/variant-receipt.json")"
          [[ "$variant_receipt_sha256" =~ ^[a-f0-9]{64}$ ]]
          echo "variant_receipt_sha256=$variant_receipt_sha256" >> "$GITHUB_OUTPUT"
          date -u +%FT%TZ | tee "$RUNNER_TEMP/source-logs/variant-finished-at.txt"
      - name: Persist the cold macOS x64 modified variant
        id: upload-variant
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 10
        with:
          name: source-native-variant-x86_64-apple-darwin-modified-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/release-inputs/source-variants/x86_64-apple-darwin/modified/variant-receipt.json
            dist/release-inputs/source-variants/x86_64-apple-darwin/modified/build-tools-receipt.json
            dist/release-inputs/source-variants/x86_64-apple-darwin/modified/tool-pin.json
            dist/release-inputs/source-variants/x86_64-apple-darwin/modified/transport
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve macOS x64 modified variant diagnostics
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 5
        with:
          name: source-native-variant-diagnostics-x86_64-apple-darwin-modified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-logs
          if-no-files-found: warn
          retention-days: 7

  source-native-macos-x64:
    needs: [
      resolve,
      test,
      source-materials,
      source-macos-x64-baseline,
      source-macos-x64-modified,
    ]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.operation == 'source-native-diagnostic') && (!cancelled() && (needs.resolve.outputs.release_required == 'true' || github.event_name == 'pull_request')) }}
    runs-on: macos-15-intel
    timeout-minutes: 350
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-proof.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-proof.outputs.artifact-digest }}
      runtime_artifact_id: ${{ steps.upload-runtime.outputs.artifact-id }}
      runtime_artifact_digest: ${{ steps.upload-runtime.outputs.artifact-digest }}
      producer_run_id: ${{ github.run_id }}
      producer_attempt: ${{ github.run_attempt }}
      proof_sha256: ${{ steps.proof.outputs.proof_sha256 }}
      baseline_runtime_sha256: ${{ steps.proof.outputs.baseline_runtime_sha256 }}
      baseline_derived_lock_sha256: ${{ steps.proof.outputs.baseline_derived_lock_sha256 }}
      build_receipt_sha256: ${{ steps.proof.outputs.build_receipt_sha256 }}
    env:
      DENO_DIR: /tmp/slv-deno-cache
      TARGET: x86_64-apple-darwin
      BUILD_HOST: x86_64-apple-darwin
    steps:
      - name: Require every source prerequisite to succeed
        id: prerequisites
        timeout-minutes: 1
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e --slurp --argjson expected '["resolve","test","source-materials","source-macos-x64-baseline","source-macos-x64-modified"]' \
            'length == 1 and (.[0] | type == "object" and (keys == ($expected | sort)) and all(.[]; type == "object" and .result == "success"))' \
            <<< "$NEEDS_JSON" > /dev/null
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: denoland/setup-deno@01524fade784327df1a5ad1ead94235d392cd443 # v2.0.1
        with:
          deno-version: v2.9.3
      - name: Select the reviewed Xcode and macOS SDK
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 16.2'
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          test "$(xcrun --sdk macosx --show-sdk-version)" = 15.2
          test -d "$sdk_path"
          {
            echo "DEVELOPER_DIR=$DEVELOPER_DIR"
            echo "SLV_APPLE_SDK_PATH=$sdk_path"
          } >> "$GITHUB_ENV"
      - name: Reclaim only the measured unused macOS SDK image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-logs"
          df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee "$RUNNER_TEMP/source-logs/capacity-before-cleanup.txt"
          du -sk /Applications/Xcode_16.2.app 2>/dev/null | tee "$RUNNER_TEMP/source-logs/active-xcode-before.txt"
          if [ -d /Applications/Xcode_16.4.app ]; then sudo rm -rf /Applications/Xcode_16.4.app; fi
          df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee "$RUNNER_TEMP/source-logs/capacity-after-cleanup.txt"
          du -sk /Applications/Xcode_16.2.app 2>/dev/null | tee "$RUNNER_TEMP/source-logs/active-xcode-after.txt"
      - name: Download exact notice and source-material artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.test.outputs.license_artifact_id }},${{ needs.source-materials.outputs.artifact_id }}
          merge-multiple: true
          path: dist/release-inputs
      - name: Validate trusted macOS variant producer metadata
        env:
          BASELINE_ARTIFACT_ID: ${{ needs.source-macos-x64-baseline.outputs.artifact_id }}
          BASELINE_ARTIFACT_DIGEST: ${{ needs.source-macos-x64-baseline.outputs.artifact_digest }}
          BASELINE_RECEIPT_SHA256: ${{ needs.source-macos-x64-baseline.outputs.variant_receipt_sha256 }}
          BASELINE_REPOSITORY: ${{ needs.source-macos-x64-baseline.outputs.producer_repository }}
          BASELINE_WORKFLOW: ${{ needs.source-macos-x64-baseline.outputs.producer_workflow }}
          BASELINE_RUN_ID: ${{ needs.source-macos-x64-baseline.outputs.producer_run_id }}
          BASELINE_RUN_ATTEMPT: ${{ needs.source-macos-x64-baseline.outputs.producer_attempt }}
          BASELINE_JOB_ID: ${{ needs.source-macos-x64-baseline.outputs.producer_job_id }}
          MODIFIED_ARTIFACT_ID: ${{ needs.source-macos-x64-modified.outputs.artifact_id }}
          MODIFIED_ARTIFACT_DIGEST: ${{ needs.source-macos-x64-modified.outputs.artifact_digest }}
          MODIFIED_RECEIPT_SHA256: ${{ needs.source-macos-x64-modified.outputs.variant_receipt_sha256 }}
          MODIFIED_REPOSITORY: ${{ needs.source-macos-x64-modified.outputs.producer_repository }}
          MODIFIED_WORKFLOW: ${{ needs.source-macos-x64-modified.outputs.producer_workflow }}
          MODIFIED_RUN_ID: ${{ needs.source-macos-x64-modified.outputs.producer_run_id }}
          MODIFIED_RUN_ATTEMPT: ${{ needs.source-macos-x64-modified.outputs.producer_attempt }}
          MODIFIED_JOB_ID: ${{ needs.source-macos-x64-modified.outputs.producer_job_id }}
          CURRENT_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for role in BASELINE MODIFIED; do
            id_var="${role}_ARTIFACT_ID"; digest_var="${role}_ARTIFACT_DIGEST"; receipt_var="${role}_RECEIPT_SHA256"
            repository_var="${role}_REPOSITORY"; workflow_var="${role}_WORKFLOW"; run_id_var="${role}_RUN_ID"; attempt_var="${role}_RUN_ATTEMPT"; job_var="${role}_JOB_ID"
            id="${!id_var}"; digest="${!digest_var}"; receipt="${!receipt_var}"; repository="${!repository_var}"; workflow="${!workflow_var}"; run_id="${!run_id_var}"; attempt="${!attempt_var}"; job="${!job_var}"
            [[ "$id" =~ ^[1-9][0-9]*$ ]] && [[ "$receipt" =~ ^[a-f0-9]{64}$ ]]
            [[ "$digest" =~ ^([a-f0-9]{64}|sha256:[a-f0-9]{64})$ ]]
            [[ -n "$repository" && -n "$workflow" && "$run_id" =~ ^[1-9][0-9]*$ && "$attempt" =~ ^[1-9][0-9]*$ ]]
            test "$attempt" -le "$CURRENT_ATTEMPT"
          done
          test "$BASELINE_JOB_ID" = source-macos-x64-baseline
          test "$MODIFIED_JOB_ID" = source-macos-x64-modified
      - name: Download exact macOS baseline variant
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.source-macos-x64-baseline.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/source-variants/baseline
      - name: Download exact macOS modified variant
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.source-macos-x64-modified.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/source-variants/modified
      - name: Join the two verified macOS source variants
        id: join
        timeout-minutes: 60
        env:
          BASELINE_ARTIFACT_ID: ${{ needs.source-macos-x64-baseline.outputs.artifact_id }}
          BASELINE_ARTIFACT_DIGEST: ${{ needs.source-macos-x64-baseline.outputs.artifact_digest }}
          BASELINE_RECEIPT_SHA256: ${{ needs.source-macos-x64-baseline.outputs.variant_receipt_sha256 }}
          BASELINE_REPOSITORY: ${{ needs.source-macos-x64-baseline.outputs.producer_repository }}
          BASELINE_WORKFLOW: ${{ needs.source-macos-x64-baseline.outputs.producer_workflow }}
          BASELINE_RUN_ID: ${{ needs.source-macos-x64-baseline.outputs.producer_run_id }}
          BASELINE_RUN_ATTEMPT: ${{ needs.source-macos-x64-baseline.outputs.producer_attempt }}
          BASELINE_JOB_ID: ${{ needs.source-macos-x64-baseline.outputs.producer_job_id }}
          MODIFIED_ARTIFACT_ID: ${{ needs.source-macos-x64-modified.outputs.artifact_id }}
          MODIFIED_ARTIFACT_DIGEST: ${{ needs.source-macos-x64-modified.outputs.artifact_digest }}
          MODIFIED_RECEIPT_SHA256: ${{ needs.source-macos-x64-modified.outputs.variant_receipt_sha256 }}
          MODIFIED_REPOSITORY: ${{ needs.source-macos-x64-modified.outputs.producer_repository }}
          MODIFIED_WORKFLOW: ${{ needs.source-macos-x64-modified.outputs.producer_workflow }}
          MODIFIED_RUN_ID: ${{ needs.source-macos-x64-modified.outputs.producer_run_id }}
          MODIFIED_RUN_ATTEMPT: ${{ needs.source-macos-x64-modified.outputs.producer_attempt }}
          MODIFIED_JOB_ID: ${{ needs.source-macos-x64-modified.outputs.producer_job_id }}
        run: |
          set -euo pipefail
          sha256_file() { shasum -a 256 "$1" | awk '{print $1}'; }
          baseline_root="$RUNNER_TEMP/source-variants/baseline"
          modified_root="$RUNNER_TEMP/source-variants/modified"
          test -f "$baseline_root/variant-receipt.json" && test -f "$baseline_root/build-tools-receipt.json" && test -f "$baseline_root/tool-pin.json" && test -d "$baseline_root/transport"
          test -f "$modified_root/variant-receipt.json" && test -f "$modified_root/build-tools-receipt.json" && test -f "$modified_root/tool-pin.json" && test -d "$modified_root/transport"
          test "$(sha256_file "$baseline_root/variant-receipt.json")" = "$BASELINE_RECEIPT_SHA256"
          test "$(sha256_file "$modified_root/variant-receipt.json")" = "$MODIFIED_RECEIPT_SHA256"
          test "$(sha256_file "$baseline_root/build-tools-receipt.json")" = "$(jq -er '.tools_receipt_sha256' "$baseline_root/variant-receipt.json")"
          test "$(sha256_file "$modified_root/build-tools-receipt.json")" = "$(jq -er '.tools_receipt_sha256' "$modified_root/variant-receipt.json")"
          test "$(sha256_file "$baseline_root/tool-pin.json")" = "$(jq -er '.tool_pin_sha256' "$baseline_root/variant-receipt.json")"
          test "$(sha256_file "$modified_root/tool-pin.json")" = "$(jq -er '.tool_pin_sha256' "$modified_root/variant-receipt.json")"
          cmp "$baseline_root/tool-pin.json" "$modified_root/tool-pin.json"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg workflow "$GITHUB_WORKFLOW_REF" --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg job_id "$GITHUB_JOB" \
            '{schema_version: 1, kind: "slv-native-producer-context", repository: $repository, workflow: $workflow, run_id: $run_id, run_attempt: $run_attempt, job_id: $job_id}' > "$RUNNER_TEMP/producer-context.json"
          jq -n \
            --arg baseline_receipt "$baseline_root/variant-receipt.json" --arg baseline_materials "$baseline_root" --arg baseline_receipt_sha256 "$BASELINE_RECEIPT_SHA256" --arg baseline_artifact_id "$BASELINE_ARTIFACT_ID" --arg baseline_artifact_digest "$BASELINE_ARTIFACT_DIGEST" --arg baseline_repository "$BASELINE_REPOSITORY" --arg baseline_workflow "$BASELINE_WORKFLOW" --arg baseline_run_id "$BASELINE_RUN_ID" --arg baseline_run_attempt "$BASELINE_RUN_ATTEMPT" --arg baseline_job_id "$BASELINE_JOB_ID" \
            --arg modified_receipt "$modified_root/variant-receipt.json" --arg modified_materials "$modified_root" --arg modified_receipt_sha256 "$MODIFIED_RECEIPT_SHA256" --arg modified_artifact_id "$MODIFIED_ARTIFACT_ID" --arg modified_artifact_digest "$MODIFIED_ARTIFACT_DIGEST" --arg modified_repository "$MODIFIED_REPOSITORY" --arg modified_workflow "$MODIFIED_WORKFLOW" --arg modified_run_id "$MODIFIED_RUN_ID" --arg modified_run_attempt "$MODIFIED_RUN_ATTEMPT" --arg modified_job_id "$MODIFIED_JOB_ID" \
            '{schema_version: 1, kind: "slv-native-variant-dependencies", baseline: {receipt: $baseline_receipt, materials: $baseline_materials, receipt_sha256: $baseline_receipt_sha256, artifact_id: $baseline_artifact_id, artifact_digest: $baseline_artifact_digest, producer: {schema_version: 1, kind: "slv-native-producer-context", repository: $baseline_repository, workflow: $baseline_workflow, run_id: $baseline_run_id, run_attempt: $baseline_run_attempt, job_id: $baseline_job_id}}, modified: {receipt: $modified_receipt, materials: $modified_materials, receipt_sha256: $modified_receipt_sha256, artifact_id: $modified_artifact_id, artifact_digest: $modified_artifact_digest, producer: {schema_version: 1, kind: "slv-native-producer-context", repository: $modified_repository, workflow: $modified_workflow, run_id: $modified_run_id, run_attempt: $modified_run_attempt, job_id: $modified_job_id}}}' > "$RUNNER_TEMP/variant-dependencies.json"
          mkdir -p "dist/release-inputs/source-proofs/$TARGET" dist/release-inputs/tool-pins
          common=(--target "$TARGET" --build-host "$BUILD_HOST" --out "dist/release-inputs/source-proofs/$TARGET" --pins source-materials/pins.json --source-receipt dist/release-inputs/source-materials-receipt.json --slv-source dist/release-inputs/source-materials/slv-source.tar.gz --deno-source dist/release-inputs/source-materials/deno-source.tar.gz --cargo-vendor dist/release-inputs/source-materials/deno-cargo-vendor.tar.gz --notice-file dist/release-inputs/THIRD_PARTY_NOTICES)
          deno run --frozen --allow-read --allow-write --allow-run --allow-env source-rebuild/verify-native.ts --phase join-build "${common[@]}" --source-root "$RUNNER_TEMP/join-source-root" --work-dir "$RUNNER_TEMP/join-work" --producer-context "$RUNNER_TEMP/producer-context.json" --variant-dependencies "$RUNNER_TEMP/variant-dependencies.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/join.log"
          cp "$baseline_root/build-tools-receipt.json" "dist/release-inputs/source-proofs/$TARGET/build-tools-receipt.json"
          cp "$baseline_root/tool-pin.json" "dist/release-inputs/tool-pins/$TARGET.json"
          test "$(sha256_file "dist/release-inputs/tool-pins/$TARGET.json")" = "$(jq -er '.tool_pin_sha256' "dist/release-inputs/source-proofs/$TARGET/build-receipt.json")"
      - name: Join, execute, and merge the native source proof
        id: proof
        timeout-minutes: 60
        env:
          BASELINE_ARTIFACT_ID: ${{ needs.source-macos-x64-baseline.outputs.artifact_id }}
          BASELINE_ARTIFACT_DIGEST: ${{ needs.source-macos-x64-baseline.outputs.artifact_digest }}
          BASELINE_RECEIPT_SHA256: ${{ needs.source-macos-x64-baseline.outputs.variant_receipt_sha256 }}
          BASELINE_REPOSITORY: ${{ needs.source-macos-x64-baseline.outputs.producer_repository }}
          BASELINE_WORKFLOW: ${{ needs.source-macos-x64-baseline.outputs.producer_workflow }}
          BASELINE_RUN_ID: ${{ needs.source-macos-x64-baseline.outputs.producer_run_id }}
          BASELINE_RUN_ATTEMPT: ${{ needs.source-macos-x64-baseline.outputs.producer_attempt }}
          BASELINE_JOB_ID: ${{ needs.source-macos-x64-baseline.outputs.producer_job_id }}
          MODIFIED_ARTIFACT_ID: ${{ needs.source-macos-x64-modified.outputs.artifact_id }}
          MODIFIED_ARTIFACT_DIGEST: ${{ needs.source-macos-x64-modified.outputs.artifact_digest }}
          MODIFIED_RECEIPT_SHA256: ${{ needs.source-macos-x64-modified.outputs.variant_receipt_sha256 }}
          MODIFIED_REPOSITORY: ${{ needs.source-macos-x64-modified.outputs.producer_repository }}
          MODIFIED_WORKFLOW: ${{ needs.source-macos-x64-modified.outputs.producer_workflow }}
          MODIFIED_RUN_ID: ${{ needs.source-macos-x64-modified.outputs.producer_run_id }}
          MODIFIED_RUN_ATTEMPT: ${{ needs.source-macos-x64-modified.outputs.producer_attempt }}
          MODIFIED_JOB_ID: ${{ needs.source-macos-x64-modified.outputs.producer_job_id }}
        run: |
          set -euo pipefail
          resolve_host_python() {
            for candidate in "$(command -v python3 || true)" /usr/local/bin/python3 /opt/homebrew/bin/python3 /usr/bin/python3; do
              test -n "$candidate" && test -x "$candidate" || continue
              "$candidate" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)' || continue
              "$candidate" -c 'import os, sys; print(os.path.realpath(sys.executable))'
              return 0
            done
            return 1
          }
          SLV_HOST_PYTHON="$(resolve_host_python)"
          test "${SLV_HOST_PYTHON#/}" != "$SLV_HOST_PYTHON"
          export SLV_HOST_PYTHON
          sha256_file() { shasum -a 256 "$1" | awk '{print $1}'; }
          mkdir -p "$RUNNER_TEMP/source-logs" dist/release-inputs/source-proofs dist/release-inputs/tool-pins "$RUNNER_TEMP/source-tools"
          test '${{ needs.test.outputs.license_producer_run_id }}' = '${{ github.run_id }}'
          test '${{ needs.source-materials.outputs.producer_run_id }}' = '${{ github.run_id }}'
          test -n '${{ needs.source-materials.outputs.producer_attempt }}'
          test "$(sha256_file dist/release-inputs/source-materials-receipt.json)" = '${{ needs.source-materials.outputs.receipt_sha256 }}'
          deno run --frozen --allow-read scripts/release/release.ts verify-licenses '${{ needs.resolve.outputs.source_sha }}' '${{ github.run_id }}' '${{ needs.test.outputs.license_producer_attempt }}' '${{ needs.test.outputs.license_notice_sha256 }}'
          deno run --frozen --allow-read --allow-write --allow-run --allow-env --allow-net source-rebuild/prepare-tools.ts --target "$TARGET" --build-host "$BUILD_HOST" --purpose execution --pins source-rebuild/tool-prereqs.json --out "$RUNNER_TEMP/source-tools/execution" --receipt "$RUNNER_TEMP/execution-tools.json" --descriptor "dist/release-inputs/tool-pins/$TARGET.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/prepare-execution.log"
          mkdir -p "dist/release-inputs/source-proofs/$TARGET"
          common=(--target "$TARGET" --build-host "$BUILD_HOST" --out "dist/release-inputs/source-proofs/$TARGET" --pins source-materials/pins.json --source-receipt dist/release-inputs/source-materials-receipt.json --slv-source dist/release-inputs/source-materials/slv-source.tar.gz --deno-source dist/release-inputs/source-materials/deno-source.tar.gz --cargo-vendor dist/release-inputs/source-materials/deno-cargo-vendor.tar.gz --notice-file dist/release-inputs/THIRD_PARTY_NOTICES)
          deno run --frozen --allow-read --allow-write --allow-run --allow-env source-rebuild/verify-native.ts --phase execute "${common[@]}" --source-root "$RUNNER_TEMP/execute-source-root" --work-dir "$RUNNER_TEMP/execute-work" --build-receipt "dist/release-inputs/source-proofs/$TARGET/build-receipt.json" --build-materials "dist/release-inputs/source-proofs/$TARGET/transport" --execution-tools-receipt "$RUNNER_TEMP/execution-tools.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/execute.log"
          deno run --frozen --allow-read --allow-write --allow-run --allow-env source-rebuild/verify-native.ts --phase merge "${common[@]}" --source-root "$RUNNER_TEMP/merge-source-root" --work-dir "$RUNNER_TEMP/merge-work" --build-receipt "dist/release-inputs/source-proofs/$TARGET/build-receipt.json" --execution-receipt "dist/release-inputs/source-proofs/$TARGET/execution-receipt.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/merge.log"
          proof_sha256="$(sha256_file "dist/release-inputs/source-proofs/$TARGET/native-proof.json")"
          build_receipt="dist/release-inputs/source-proofs/$TARGET/build-receipt.json"
          baseline_runtime_sha256="$(jq -er '.artifacts.baseline.denort_sha256' "$build_receipt")"
          baseline_derived_lock_sha256="$(jq -er '.artifacts.baseline.derived_relink_cargo_lock_sha256' "$build_receipt")"
          build_receipt_sha256="$(sha256_file "$build_receipt")"
          test -n "$proof_sha256"
          {
            echo "proof_sha256=$proof_sha256"
            echo "baseline_runtime_sha256=$baseline_runtime_sha256"
            echo "baseline_derived_lock_sha256=$baseline_derived_lock_sha256"
            echo "build_receipt_sha256=$build_receipt_sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Persist the three phase receipts for the native proof
        id: upload-proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slv-source-proof-x86_64-apple-darwin-${{ github.run_id }}
          path: |
            dist/release-inputs/source-proofs/x86_64-apple-darwin/native-proof.json
            dist/release-inputs/source-proofs/x86_64-apple-darwin/build-receipt.json
            dist/release-inputs/source-proofs/x86_64-apple-darwin/execution-receipt.json
            dist/release-inputs/tool-pins/x86_64-apple-darwin.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Persist the baseline-only runtime compiler input
        id: upload-runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slv-source-runtime-x86_64-apple-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/release-inputs/source-proofs/x86_64-apple-darwin/build-receipt.json
            dist/release-inputs/source-proofs/x86_64-apple-darwin/transport/manifest.json
            dist/release-inputs/source-proofs/x86_64-apple-darwin/transport/baseline-denort
            dist/release-inputs/source-proofs/x86_64-apple-darwin/transport/baseline-bridge
            dist/release-inputs/source-proofs/x86_64-apple-darwin/transport/baseline-derived-relink-Cargo.lock
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failed native proof diagnostics separately
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 5
        with:
          name: source-proof-diagnostics-x86_64-apple-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-logs
          if-no-files-found: warn
          retention-days: 7

  source-native-macos-arm64:
    needs: [resolve, test, source-materials]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.operation == 'source-native-diagnostic') && (needs.resolve.outputs.release_required == 'true' || github.event_name == 'pull_request') }}
    runs-on: macos-15
    timeout-minutes: 350
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-proof.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-proof.outputs.artifact-digest }}
      runtime_artifact_id: ${{ steps.upload-runtime.outputs.artifact-id }}
      runtime_artifact_digest: ${{ steps.upload-runtime.outputs.artifact-digest }}
      producer_run_id: ${{ github.run_id }}
      producer_attempt: ${{ github.run_attempt }}
      proof_sha256: ${{ steps.proof.outputs.proof_sha256 }}
      baseline_runtime_sha256: ${{ steps.proof.outputs.baseline_runtime_sha256 }}
      baseline_derived_lock_sha256: ${{ steps.proof.outputs.baseline_derived_lock_sha256 }}
      build_receipt_sha256: ${{ steps.proof.outputs.build_receipt_sha256 }}
    env:
      DENO_DIR: /tmp/slv-deno-cache
      TARGET: aarch64-apple-darwin
      BUILD_HOST: aarch64-apple-darwin
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: denoland/setup-deno@01524fade784327df1a5ad1ead94235d392cd443 # v2.0.1
        with:
          deno-version: v2.9.3
      - name: Select the reviewed Xcode and macOS SDK
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 16.2'
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          test "$(xcrun --sdk macosx --show-sdk-version)" = 15.2
          test -d "$sdk_path"
          {
            echo "DEVELOPER_DIR=$DEVELOPER_DIR"
            echo "SLV_APPLE_SDK_PATH=$sdk_path"
          } >> "$GITHUB_ENV"
      - name: Reclaim only the measured unused macOS SDK image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-logs"
          df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee "$RUNNER_TEMP/source-logs/capacity-before-cleanup.txt"
          du -sk /Applications/Xcode_16.2.app 2>/dev/null | tee "$RUNNER_TEMP/source-logs/active-xcode-before.txt"
          if [ -d /Applications/Xcode_16.4.app ]; then sudo rm -rf /Applications/Xcode_16.4.app; fi
          df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee "$RUNNER_TEMP/source-logs/capacity-after-cleanup.txt"
          du -sk /Applications/Xcode_16.2.app 2>/dev/null | tee "$RUNNER_TEMP/source-logs/active-xcode-after.txt"
      - name: Require the pinned Xcode 16.2 SDK 15.2 toolchain
        run: |
          set -euo pipefail
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 16.2'
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          test -d "$sdk_path"
          test "$(xcrun --sdk macosx --show-sdk-version)" = 15.2
          echo "SLV_APPLE_SDK_PATH=$sdk_path" >> "$GITHUB_ENV"
      - name: Download exact notice and source-material artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.test.outputs.license_artifact_id }},${{ needs.source-materials.outputs.artifact_id }}
          merge-multiple: true
          path: dist/release-inputs
      - name: Build, execute, and merge the native source proof
        id: proof
        run: |
          set -euo pipefail
          resolve_host_python() {
            for candidate in "$(command -v python3 || true)" /opt/homebrew/bin/python3 /usr/local/bin/python3 /usr/bin/python3; do
              test -n "$candidate" && test -x "$candidate" || continue
              "$candidate" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)' || continue
              "$candidate" -c 'import os, sys; print(os.path.realpath(sys.executable))'
              return 0
            done
            return 1
          }
          SLV_HOST_PYTHON="$(resolve_host_python)"
          test "${SLV_HOST_PYTHON#/}" != "$SLV_HOST_PYTHON"
          export SLV_HOST_PYTHON
          sha256_file() { shasum -a 256 "$1" | awk '{print $1}'; }
          mkdir -p "$RUNNER_TEMP/source-logs" dist/release-inputs/source-proofs dist/release-inputs/tool-pins "$RUNNER_TEMP/source-tools"
          test '${{ needs.test.outputs.license_producer_run_id }}' = '${{ github.run_id }}'
          test '${{ needs.source-materials.outputs.producer_run_id }}' = '${{ github.run_id }}'
          test -n '${{ needs.source-materials.outputs.producer_attempt }}'
          test "$(sha256_file dist/release-inputs/source-materials-receipt.json)" = '${{ needs.source-materials.outputs.receipt_sha256 }}'
          deno run --frozen --allow-read scripts/release/release.ts verify-licenses '${{ needs.resolve.outputs.source_sha }}' '${{ github.run_id }}' '${{ needs.test.outputs.license_producer_attempt }}' '${{ needs.test.outputs.license_notice_sha256 }}'
          deno run --frozen --allow-read --allow-write --allow-run --allow-env --allow-net source-rebuild/prepare-tools.ts --target "$TARGET" --build-host "$BUILD_HOST" --purpose build --pins source-rebuild/tool-prereqs.json --out "$RUNNER_TEMP/source-tools/build" --receipt "$RUNNER_TEMP/build-tools.json" --descriptor "dist/release-inputs/tool-pins/$TARGET.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/prepare-build.log"
          deno run --frozen --allow-read --allow-write --allow-run --allow-env --allow-net source-rebuild/prepare-tools.ts --target "$TARGET" --build-host "$BUILD_HOST" --purpose execution --pins source-rebuild/tool-prereqs.json --out "$RUNNER_TEMP/source-tools/execution" --receipt "$RUNNER_TEMP/execution-tools.json" --descriptor "dist/release-inputs/tool-pins/$TARGET.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/prepare-execution.log"
          mkdir -p "dist/release-inputs/source-proofs/$TARGET"
          common=(--target "$TARGET" --build-host "$BUILD_HOST" --out "dist/release-inputs/source-proofs/$TARGET" --pins source-materials/pins.json --source-receipt dist/release-inputs/source-materials-receipt.json --slv-source dist/release-inputs/source-materials/slv-source.tar.gz --deno-source dist/release-inputs/source-materials/deno-source.tar.gz --cargo-vendor dist/release-inputs/source-materials/deno-cargo-vendor.tar.gz --notice-file dist/release-inputs/THIRD_PARTY_NOTICES)
          deno run --frozen --allow-read --allow-write --allow-run --allow-env source-rebuild/verify-native.ts --phase build "${common[@]}" --source-root "$RUNNER_TEMP/build-source-root" --work-dir "$RUNNER_TEMP/build-work" --tools-receipt "$RUNNER_TEMP/build-tools.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/build.log"
          deno run --frozen --allow-read --allow-write --allow-run --allow-env source-rebuild/verify-native.ts --phase execute "${common[@]}" --source-root "$RUNNER_TEMP/execute-source-root" --work-dir "$RUNNER_TEMP/execute-work" --build-receipt "dist/release-inputs/source-proofs/$TARGET/build-receipt.json" --build-materials "dist/release-inputs/source-proofs/$TARGET/transport" --execution-tools-receipt "$RUNNER_TEMP/execution-tools.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/execute.log"
          deno run --frozen --allow-read --allow-write --allow-run --allow-env source-rebuild/verify-native.ts --phase merge "${common[@]}" --source-root "$RUNNER_TEMP/merge-source-root" --work-dir "$RUNNER_TEMP/merge-work" --build-receipt "dist/release-inputs/source-proofs/$TARGET/build-receipt.json" --execution-receipt "dist/release-inputs/source-proofs/$TARGET/execution-receipt.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/merge.log"
          proof_sha256="$(sha256_file "dist/release-inputs/source-proofs/$TARGET/native-proof.json")"
          build_receipt="dist/release-inputs/source-proofs/$TARGET/build-receipt.json"
          baseline_runtime_sha256="$(jq -er '.artifacts.baseline.denort_sha256' "$build_receipt")"
          baseline_derived_lock_sha256="$(jq -er '.artifacts.baseline.derived_relink_cargo_lock_sha256' "$build_receipt")"
          build_receipt_sha256="$(sha256_file "$build_receipt")"
          test -n "$proof_sha256"
          {
            echo "proof_sha256=$proof_sha256"
            echo "baseline_runtime_sha256=$baseline_runtime_sha256"
            echo "baseline_derived_lock_sha256=$baseline_derived_lock_sha256"
            echo "build_receipt_sha256=$build_receipt_sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Persist the three phase receipts for the native proof
        id: upload-proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slv-source-proof-aarch64-apple-darwin-${{ github.run_id }}
          path: |
            dist/release-inputs/source-proofs/aarch64-apple-darwin/native-proof.json
            dist/release-inputs/source-proofs/aarch64-apple-darwin/build-receipt.json
            dist/release-inputs/source-proofs/aarch64-apple-darwin/execution-receipt.json
            dist/release-inputs/tool-pins/aarch64-apple-darwin.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Persist the baseline-only runtime compiler input
        id: upload-runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slv-source-runtime-aarch64-apple-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/release-inputs/source-proofs/aarch64-apple-darwin/build-receipt.json
            dist/release-inputs/source-proofs/aarch64-apple-darwin/transport/manifest.json
            dist/release-inputs/source-proofs/aarch64-apple-darwin/transport/baseline-denort
            dist/release-inputs/source-proofs/aarch64-apple-darwin/transport/baseline-bridge
            dist/release-inputs/source-proofs/aarch64-apple-darwin/transport/baseline-derived-relink-Cargo.lock
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failed native proof diagnostics separately
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-proof-diagnostics-aarch64-apple-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-logs
          if-no-files-found: warn
          retention-days: 7

  source-arm-build:
    needs: [
      resolve,
      test,
      source-materials,
      source-arm-baseline,
      source-arm-modified,
    ]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.operation == 'source-native-diagnostic') && (!cancelled() && (needs.resolve.outputs.release_required == 'true' || github.event_name == 'pull_request')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-build.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-build.outputs.artifact-digest }}
      runtime_artifact_id: ${{ steps.upload-runtime.outputs.artifact-id }}
      runtime_artifact_digest: ${{ steps.upload-runtime.outputs.artifact-digest }}
      producer_run_id: ${{ github.run_id }}
      producer_attempt: ${{ github.run_attempt }}
      build_receipt_sha256: ${{ steps.build.outputs.build_receipt_sha256 }}
      baseline_runtime_sha256: ${{ steps.build.outputs.baseline_runtime_sha256 }}
      baseline_derived_lock_sha256: ${{ steps.build.outputs.baseline_derived_lock_sha256 }}
    env:
      DENO_DIR: /tmp/slv-deno-cache
      TARGET: aarch64-unknown-linux-gnu
      BUILD_HOST: x86_64-unknown-linux-gnu
    steps:
      - name: Require every source prerequisite to succeed
        id: prerequisites
        timeout-minutes: 1
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e --slurp --argjson expected '["resolve","test","source-materials","source-arm-baseline","source-arm-modified"]' \
            'length == 1 and (.[0] | type == "object" and (keys == ($expected | sort)) and all(.[]; type == "object" and .result == "success"))' \
            <<< "$NEEDS_JSON" > /dev/null
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: denoland/setup-deno@01524fade784327df1a5ad1ead94235d392cd443 # v2.0.1
        with:
          deno-version: v2.9.3
      - name: Download exact notice and source-material artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.test.outputs.license_artifact_id }},${{ needs.source-materials.outputs.artifact_id }}
          merge-multiple: true
          path: dist/release-inputs
      - name: Reclaim only measured unused Linux runner SDKs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-logs"
          df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee "$RUNNER_TEMP/source-logs/capacity-before-cleanup.txt"
          du -sk /usr/local/lib/android /usr/share/dotnet 2>/dev/null | tee "$RUNNER_TEMP/source-logs/unused-sdk-before.txt" || true
          if [ -d /usr/local/lib/android ]; then sudo rm -rf /usr/local/lib/android; fi
          if [ -d /usr/share/dotnet ]; then sudo rm -rf /usr/share/dotnet; fi
          df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee "$RUNNER_TEMP/source-logs/capacity-after-cleanup.txt"
      - name: Validate trusted ARM variant producer metadata
        env:
          BASELINE_ARTIFACT_ID: ${{ needs.source-arm-baseline.outputs.artifact_id }}
          BASELINE_ARTIFACT_DIGEST: ${{ needs.source-arm-baseline.outputs.artifact_digest }}
          BASELINE_RECEIPT_SHA256: ${{ needs.source-arm-baseline.outputs.variant_receipt_sha256 }}
          BASELINE_REPOSITORY: ${{ needs.source-arm-baseline.outputs.producer_repository }}
          BASELINE_WORKFLOW: ${{ needs.source-arm-baseline.outputs.producer_workflow }}
          BASELINE_RUN_ID: ${{ needs.source-arm-baseline.outputs.producer_run_id }}
          BASELINE_RUN_ATTEMPT: ${{ needs.source-arm-baseline.outputs.producer_attempt }}
          BASELINE_JOB_ID: ${{ needs.source-arm-baseline.outputs.producer_job_id }}
          MODIFIED_ARTIFACT_ID: ${{ needs.source-arm-modified.outputs.artifact_id }}
          MODIFIED_ARTIFACT_DIGEST: ${{ needs.source-arm-modified.outputs.artifact_digest }}
          MODIFIED_RECEIPT_SHA256: ${{ needs.source-arm-modified.outputs.variant_receipt_sha256 }}
          MODIFIED_REPOSITORY: ${{ needs.source-arm-modified.outputs.producer_repository }}
          MODIFIED_WORKFLOW: ${{ needs.source-arm-modified.outputs.producer_workflow }}
          MODIFIED_RUN_ID: ${{ needs.source-arm-modified.outputs.producer_run_id }}
          MODIFIED_RUN_ATTEMPT: ${{ needs.source-arm-modified.outputs.producer_attempt }}
          MODIFIED_JOB_ID: ${{ needs.source-arm-modified.outputs.producer_job_id }}
          CURRENT_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for role in BASELINE MODIFIED; do
            id_var="${role}_ARTIFACT_ID"; digest_var="${role}_ARTIFACT_DIGEST"; receipt_var="${role}_RECEIPT_SHA256"
            repository_var="${role}_REPOSITORY"; workflow_var="${role}_WORKFLOW"; run_id_var="${role}_RUN_ID"; attempt_var="${role}_RUN_ATTEMPT"; job_var="${role}_JOB_ID"
            id="${!id_var}"; digest="${!digest_var}"; receipt="${!receipt_var}"; repository="${!repository_var}"; workflow="${!workflow_var}"; run_id="${!run_id_var}"; attempt="${!attempt_var}"; job="${!job_var}"
            [[ "$id" =~ ^[1-9][0-9]*$ ]] && [[ "$receipt" =~ ^[a-f0-9]{64}$ ]]
            [[ "$digest" =~ ^([a-f0-9]{64}|sha256:[a-f0-9]{64})$ ]]
            [[ -n "$repository" && -n "$workflow" && "$run_id" =~ ^[1-9][0-9]*$ && "$attempt" =~ ^[1-9][0-9]*$ ]]
            test "$attempt" -le "$CURRENT_ATTEMPT"
          done
          test "$BASELINE_JOB_ID" = source-arm-baseline
          test "$MODIFIED_JOB_ID" = source-arm-modified
      - name: Download exact ARM baseline variant
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.source-arm-baseline.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/source-variants/baseline
      - name: Download exact ARM modified variant
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.source-arm-modified.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/source-variants/modified
      - name: Join the two verified ARM source variants
        id: build
        timeout-minutes: 30
        env:
          BASELINE_ARTIFACT_ID: ${{ needs.source-arm-baseline.outputs.artifact_id }}
          BASELINE_ARTIFACT_DIGEST: ${{ needs.source-arm-baseline.outputs.artifact_digest }}
          BASELINE_RECEIPT_SHA256: ${{ needs.source-arm-baseline.outputs.variant_receipt_sha256 }}
          BASELINE_REPOSITORY: ${{ needs.source-arm-baseline.outputs.producer_repository }}
          BASELINE_WORKFLOW: ${{ needs.source-arm-baseline.outputs.producer_workflow }}
          BASELINE_RUN_ID: ${{ needs.source-arm-baseline.outputs.producer_run_id }}
          BASELINE_RUN_ATTEMPT: ${{ needs.source-arm-baseline.outputs.producer_attempt }}
          BASELINE_JOB_ID: ${{ needs.source-arm-baseline.outputs.producer_job_id }}
          MODIFIED_ARTIFACT_ID: ${{ needs.source-arm-modified.outputs.artifact_id }}
          MODIFIED_ARTIFACT_DIGEST: ${{ needs.source-arm-modified.outputs.artifact_digest }}
          MODIFIED_RECEIPT_SHA256: ${{ needs.source-arm-modified.outputs.variant_receipt_sha256 }}
          MODIFIED_REPOSITORY: ${{ needs.source-arm-modified.outputs.producer_repository }}
          MODIFIED_WORKFLOW: ${{ needs.source-arm-modified.outputs.producer_workflow }}
          MODIFIED_RUN_ID: ${{ needs.source-arm-modified.outputs.producer_run_id }}
          MODIFIED_RUN_ATTEMPT: ${{ needs.source-arm-modified.outputs.producer_attempt }}
          MODIFIED_JOB_ID: ${{ needs.source-arm-modified.outputs.producer_job_id }}
        run: |
          set -euo pipefail
          resolve_host_python() {
            for candidate in "$(command -v python3 || true)" /usr/local/bin/python3 /usr/bin/python3; do
              test -n "$candidate" && test -x "$candidate" || continue
              "$candidate" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)' || continue
              "$candidate" -c 'import os, sys; print(os.path.realpath(sys.executable))'
              return 0
            done
            return 1
          }
          SLV_HOST_PYTHON="$(resolve_host_python)"
          test "${SLV_HOST_PYTHON#/}" != "$SLV_HOST_PYTHON"
          export SLV_HOST_PYTHON
          mkdir -p "$RUNNER_TEMP/source-logs" "$RUNNER_TEMP/source-tools" dist/release-inputs/source-proofs dist/release-inputs/tool-pins
          test '${{ needs.test.outputs.license_producer_run_id }}' = '${{ github.run_id }}'
          test '${{ needs.source-materials.outputs.producer_run_id }}' = '${{ github.run_id }}'
          test -n '${{ needs.source-materials.outputs.producer_attempt }}'
          test "$(sha256sum dist/release-inputs/source-materials-receipt.json | cut -d ' ' -f 1)" = '${{ needs.source-materials.outputs.receipt_sha256 }}'
          deno run --frozen --allow-read scripts/release/release.ts verify-licenses '${{ needs.resolve.outputs.source_sha }}' '${{ github.run_id }}' '${{ needs.test.outputs.license_producer_attempt }}' '${{ needs.test.outputs.license_notice_sha256 }}'
          common=(--target "$TARGET" --build-host "$BUILD_HOST" --out "dist/release-inputs/source-proofs/$TARGET" --pins source-materials/pins.json --source-receipt dist/release-inputs/source-materials-receipt.json --slv-source dist/release-inputs/source-materials/slv-source.tar.gz --deno-source dist/release-inputs/source-materials/deno-source.tar.gz --cargo-vendor dist/release-inputs/source-materials/deno-cargo-vendor.tar.gz --notice-file dist/release-inputs/THIRD_PARTY_NOTICES)
          sha256_file() { sha256sum "$1" | awk '{print $1}'; }
          baseline_root="$RUNNER_TEMP/source-variants/baseline"
          modified_root="$RUNNER_TEMP/source-variants/modified"
          test -f "$baseline_root/variant-receipt.json" && test -f "$baseline_root/build-tools-receipt.json" && test -f "$baseline_root/tool-pin.json" && test -d "$baseline_root/transport"
          test -f "$modified_root/variant-receipt.json" && test -f "$modified_root/build-tools-receipt.json" && test -f "$modified_root/tool-pin.json" && test -d "$modified_root/transport"
          test "$(sha256_file "$baseline_root/variant-receipt.json")" = "$BASELINE_RECEIPT_SHA256"
          test "$(sha256_file "$modified_root/variant-receipt.json")" = "$MODIFIED_RECEIPT_SHA256"
          test "$(sha256_file "$baseline_root/build-tools-receipt.json")" = "$(jq -er '.tools_receipt_sha256' "$baseline_root/variant-receipt.json")"
          test "$(sha256_file "$modified_root/build-tools-receipt.json")" = "$(jq -er '.tools_receipt_sha256' "$modified_root/variant-receipt.json")"
          test "$(sha256_file "$baseline_root/tool-pin.json")" = "$(jq -er '.tool_pin_sha256' "$baseline_root/variant-receipt.json")"
          test "$(sha256_file "$modified_root/tool-pin.json")" = "$(jq -er '.tool_pin_sha256' "$modified_root/variant-receipt.json")"
          cmp "$baseline_root/tool-pin.json" "$modified_root/tool-pin.json"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg workflow "$GITHUB_WORKFLOW_REF" --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg job_id "$GITHUB_JOB" \
            '{schema_version: 1, kind: "slv-native-producer-context", repository: $repository, workflow: $workflow, run_id: $run_id, run_attempt: $run_attempt, job_id: $job_id}' > "$RUNNER_TEMP/producer-context.json"
          jq -n \
            --arg baseline_receipt "$baseline_root/variant-receipt.json" --arg baseline_materials "$baseline_root" --arg baseline_receipt_sha256 "$BASELINE_RECEIPT_SHA256" --arg baseline_artifact_id "$BASELINE_ARTIFACT_ID" --arg baseline_artifact_digest "$BASELINE_ARTIFACT_DIGEST" --arg baseline_repository "$BASELINE_REPOSITORY" --arg baseline_workflow "$BASELINE_WORKFLOW" --arg baseline_run_id "$BASELINE_RUN_ID" --arg baseline_run_attempt "$BASELINE_RUN_ATTEMPT" --arg baseline_job_id "$BASELINE_JOB_ID" \
            --arg modified_receipt "$modified_root/variant-receipt.json" --arg modified_materials "$modified_root" --arg modified_receipt_sha256 "$MODIFIED_RECEIPT_SHA256" --arg modified_artifact_id "$MODIFIED_ARTIFACT_ID" --arg modified_artifact_digest "$MODIFIED_ARTIFACT_DIGEST" --arg modified_repository "$MODIFIED_REPOSITORY" --arg modified_workflow "$MODIFIED_WORKFLOW" --arg modified_run_id "$MODIFIED_RUN_ID" --arg modified_run_attempt "$MODIFIED_RUN_ATTEMPT" --arg modified_job_id "$MODIFIED_JOB_ID" \
            '{schema_version: 1, kind: "slv-native-variant-dependencies", baseline: {receipt: $baseline_receipt, materials: $baseline_materials, receipt_sha256: $baseline_receipt_sha256, artifact_id: $baseline_artifact_id, artifact_digest: $baseline_artifact_digest, producer: {schema_version: 1, kind: "slv-native-producer-context", repository: $baseline_repository, workflow: $baseline_workflow, run_id: $baseline_run_id, run_attempt: $baseline_run_attempt, job_id: $baseline_job_id}}, modified: {receipt: $modified_receipt, materials: $modified_materials, receipt_sha256: $modified_receipt_sha256, artifact_id: $modified_artifact_id, artifact_digest: $modified_artifact_digest, producer: {schema_version: 1, kind: "slv-native-producer-context", repository: $modified_repository, workflow: $modified_workflow, run_id: $modified_run_id, run_attempt: $modified_run_attempt, job_id: $modified_job_id}}}' > "$RUNNER_TEMP/variant-dependencies.json"
          deno run --frozen --allow-read --allow-write --allow-run --allow-env source-rebuild/verify-native.ts --phase join-build "${common[@]}" --source-root "$RUNNER_TEMP/join-source-root" --work-dir "$RUNNER_TEMP/join-work" --producer-context "$RUNNER_TEMP/producer-context.json" --variant-dependencies "$RUNNER_TEMP/variant-dependencies.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/join.log"
          cp "$baseline_root/build-tools-receipt.json" "dist/release-inputs/source-proofs/$TARGET/build-tools-receipt.json"
          cp "$baseline_root/tool-pin.json" "dist/release-inputs/tool-pins/$TARGET.json"
          test "$(sha256_file "dist/release-inputs/tool-pins/$TARGET.json")" = "$(jq -er '.tool_pin_sha256' "dist/release-inputs/source-proofs/$TARGET/build-receipt.json")"
          build_receipt_sha256="$(sha256sum "dist/release-inputs/source-proofs/$TARGET/build-receipt.json" | cut -d ' ' -f 1)"
          baseline_runtime_sha256="$(jq -er '.artifacts.baseline.denort_sha256' "dist/release-inputs/source-proofs/$TARGET/build-receipt.json")"
          baseline_derived_lock_sha256="$(jq -er '.artifacts.baseline.derived_relink_cargo_lock_sha256' "dist/release-inputs/source-proofs/$TARGET/build-receipt.json")"
          test -n "$build_receipt_sha256"
          {
            echo "build_receipt_sha256=$build_receipt_sha256"
            echo "baseline_runtime_sha256=$baseline_runtime_sha256"
            echo "baseline_derived_lock_sha256=$baseline_derived_lock_sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Persist only ARM build transport and receipt
        id: upload-build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-arm-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/release-inputs/source-proofs/aarch64-unknown-linux-gnu/build-receipt.json
            dist/release-inputs/source-proofs/aarch64-unknown-linux-gnu/build-tools-receipt.json
            dist/release-inputs/source-proofs/aarch64-unknown-linux-gnu/transport
            dist/release-inputs/tool-pins/aarch64-unknown-linux-gnu.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Persist the ARM baseline-only runtime compiler input
        id: upload-runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slv-source-runtime-aarch64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/release-inputs/source-proofs/aarch64-unknown-linux-gnu/build-receipt.json
            dist/release-inputs/source-proofs/aarch64-unknown-linux-gnu/transport/manifest.json
            dist/release-inputs/source-proofs/aarch64-unknown-linux-gnu/transport/baseline-denort
            dist/release-inputs/source-proofs/aarch64-unknown-linux-gnu/transport/baseline-bridge
            dist/release-inputs/source-proofs/aarch64-unknown-linux-gnu/transport/baseline-derived-relink-Cargo.lock
            dist/release-inputs/source-proofs/aarch64-unknown-linux-gnu/transport/tls-localhost.crt
            dist/release-inputs/source-proofs/aarch64-unknown-linux-gnu/transport/tls-localhost.key
            dist/release-inputs/source-proofs/aarch64-unknown-linux-gnu/transport/tls-root-ca.pem
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failed ARM build diagnostics separately
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 5
        with:
          name: source-arm-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-logs
          if-no-files-found: warn
          retention-days: 7

  source-arm-execute:
    needs: [resolve, test, source-materials, source-arm-build]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.operation == 'source-native-diagnostic') && (needs.resolve.outputs.release_required == 'true' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-execution.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-execution.outputs.artifact-digest }}
      producer_run_id: ${{ github.run_id }}
      producer_attempt: ${{ github.run_attempt }}
      execution_receipt_sha256: ${{ steps.execute.outputs.execution_receipt_sha256 }}
    env:
      DENO_DIR: /tmp/slv-deno-cache
      TARGET: aarch64-unknown-linux-gnu
      BUILD_HOST: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: denoland/setup-deno@01524fade784327df1a5ad1ead94235d392cd443 # v2.0.1
        with:
          deno-version: v2.9.3
      - name: Download exact notice, source, and ARM build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.test.outputs.license_artifact_id }},${{ needs.source-materials.outputs.artifact_id }},${{ needs.source-arm-build.outputs.artifact_id }}
          merge-multiple: true
          path: dist/release-inputs
      - name: Reclaim only measured unused Linux runner SDKs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-logs"
          df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee "$RUNNER_TEMP/source-logs/capacity-before-cleanup.txt"
          du -sk /usr/local/lib/android /usr/share/dotnet 2>/dev/null | tee "$RUNNER_TEMP/source-logs/unused-sdk-before.txt" || true
          if [ -d /usr/local/lib/android ]; then sudo rm -rf /usr/local/lib/android; fi
          if [ -d /usr/share/dotnet ]; then sudo rm -rf /usr/share/dotnet; fi
          df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | tee "$RUNNER_TEMP/source-logs/capacity-after-cleanup.txt"
      - name: Execute the rehashed ARM build transport
        id: execute
        run: |
          set -euo pipefail
          resolve_host_python() {
            for candidate in "$(command -v python3 || true)" /usr/local/bin/python3 /usr/bin/python3; do
              test -n "$candidate" && test -x "$candidate" || continue
              "$candidate" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)' || continue
              "$candidate" -c 'import os, sys; print(os.path.realpath(sys.executable))'
              return 0
            done
            return 1
          }
          SLV_HOST_PYTHON="$(resolve_host_python)"
          test "${SLV_HOST_PYTHON#/}" != "$SLV_HOST_PYTHON"
          export SLV_HOST_PYTHON
          mkdir -p "$RUNNER_TEMP/source-logs" "$RUNNER_TEMP/source-tools"
          test '${{ needs.test.outputs.license_producer_run_id }}' = '${{ github.run_id }}'
          test '${{ needs.source-materials.outputs.producer_run_id }}' = '${{ github.run_id }}'
          test '${{ needs.source-arm-build.outputs.producer_run_id }}' = '${{ github.run_id }}'
          test -n '${{ needs.source-materials.outputs.producer_attempt }}'
          test -n '${{ needs.source-arm-build.outputs.producer_attempt }}'
          test "$(sha256sum dist/release-inputs/source-materials-receipt.json | cut -d ' ' -f 1)" = '${{ needs.source-materials.outputs.receipt_sha256 }}'
          test "$(sha256sum "dist/release-inputs/source-proofs/$TARGET/build-receipt.json" | cut -d ' ' -f 1)" = '${{ needs.source-arm-build.outputs.build_receipt_sha256 }}'
          deno run --frozen --allow-read scripts/release/release.ts verify-licenses '${{ needs.resolve.outputs.source_sha }}' '${{ github.run_id }}' '${{ needs.test.outputs.license_producer_attempt }}' '${{ needs.test.outputs.license_notice_sha256 }}'
          # This ARM execution acquisition is purpose-limited: it has no x64
          # compiler path and the verifier itself receives no network grant.
          deno run --frozen --allow-read --allow-write --allow-run --allow-env --allow-net source-rebuild/prepare-tools.ts --target "$TARGET" --build-host "$BUILD_HOST" --purpose execution --pins source-rebuild/tool-prereqs.json --out "$RUNNER_TEMP/source-tools/execution" --receipt "$RUNNER_TEMP/execution-tools.json" --descriptor "dist/release-inputs/tool-pins/$TARGET.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/prepare-execution.log"
          common=(--target "$TARGET" --build-host "$BUILD_HOST" --out "dist/release-inputs/source-proofs/$TARGET" --pins source-materials/pins.json --source-receipt dist/release-inputs/source-materials-receipt.json --slv-source dist/release-inputs/source-materials/slv-source.tar.gz --deno-source dist/release-inputs/source-materials/deno-source.tar.gz --cargo-vendor dist/release-inputs/source-materials/deno-cargo-vendor.tar.gz --notice-file dist/release-inputs/THIRD_PARTY_NOTICES)
          deno run --frozen --allow-read --allow-write --allow-run --allow-env source-rebuild/verify-native.ts --phase execute "${common[@]}" --source-root "$RUNNER_TEMP/execute-source-root" --work-dir "$RUNNER_TEMP/execute-work" --build-receipt "dist/release-inputs/source-proofs/$TARGET/build-receipt.json" --build-materials "dist/release-inputs/source-proofs/$TARGET/transport" --execution-tools-receipt "$RUNNER_TEMP/execution-tools.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/execute.log"
          execution_receipt_sha256="$(sha256sum "dist/release-inputs/source-proofs/$TARGET/execution-receipt.json" | cut -d ' ' -f 1)"
          test -n "$execution_receipt_sha256"
          echo "execution_receipt_sha256=$execution_receipt_sha256" >> "$GITHUB_OUTPUT"
      - name: Persist only ARM execution receipt
        id: upload-execution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-arm-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release-inputs/source-proofs/aarch64-unknown-linux-gnu/execution-receipt.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failed ARM execution diagnostics separately
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-arm-execution-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-logs
          if-no-files-found: warn
          retention-days: 7

  source-arm-merge:
    needs: [
      resolve,
      test,
      source-materials,
      source-arm-build,
      source-arm-execute,
    ]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.operation == 'source-native-diagnostic') && (needs.resolve.outputs.release_required == 'true' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-proof.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-proof.outputs.artifact-digest }}
      producer_run_id: ${{ github.run_id }}
      producer_attempt: ${{ github.run_attempt }}
      proof_sha256: ${{ steps.merge.outputs.proof_sha256 }}
    env:
      DENO_DIR: /tmp/slv-deno-cache
      TARGET: aarch64-unknown-linux-gnu
      BUILD_HOST: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: denoland/setup-deno@01524fade784327df1a5ad1ead94235d392cd443 # v2.0.1
        with:
          deno-version: v2.9.3
      - name: Download exact notice, source, and ARM build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.test.outputs.license_artifact_id }},${{ needs.source-materials.outputs.artifact_id }},${{ needs.source-arm-build.outputs.artifact_id }}
          merge-multiple: true
          path: dist/release-inputs
      - name: Download the exact ARM execution receipt into its proof directory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.source-arm-execute.outputs.artifact_id }}
          merge-multiple: true
          path: dist/release-inputs/source-proofs/aarch64-unknown-linux-gnu
      - name: Merge only the checked ARM build and execution receipts
        id: merge
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-logs"
          test '${{ needs.test.outputs.license_producer_run_id }}' = '${{ github.run_id }}'
          test '${{ needs.source-materials.outputs.producer_run_id }}' = '${{ github.run_id }}'
          test '${{ needs.source-arm-build.outputs.producer_run_id }}' = '${{ github.run_id }}'
          test '${{ needs.source-arm-execute.outputs.producer_run_id }}' = '${{ github.run_id }}'
          test -n '${{ needs.source-materials.outputs.producer_attempt }}'
          test -n '${{ needs.source-arm-build.outputs.producer_attempt }}'
          test -n '${{ needs.source-arm-execute.outputs.producer_attempt }}'
          test -n '${{ needs.source-arm-execute.outputs.artifact_id }}'
          test -n '${{ needs.source-arm-execute.outputs.artifact_digest }}'
          test "$(sha256sum dist/release-inputs/source-materials-receipt.json | cut -d ' ' -f 1)" = '${{ needs.source-materials.outputs.receipt_sha256 }}'
          test "$(sha256sum "dist/release-inputs/source-proofs/$TARGET/build-receipt.json" | cut -d ' ' -f 1)" = '${{ needs.source-arm-build.outputs.build_receipt_sha256 }}'
          test "$(sha256sum "dist/release-inputs/source-proofs/$TARGET/execution-receipt.json" | cut -d ' ' -f 1)" = '${{ needs.source-arm-execute.outputs.execution_receipt_sha256 }}'
          deno run --frozen --allow-read scripts/release/release.ts verify-licenses '${{ needs.resolve.outputs.source_sha }}' '${{ github.run_id }}' '${{ needs.test.outputs.license_producer_attempt }}' '${{ needs.test.outputs.license_notice_sha256 }}'
          common=(--target "$TARGET" --build-host "$BUILD_HOST" --out "dist/release-inputs/source-proofs/$TARGET" --pins source-materials/pins.json --source-receipt dist/release-inputs/source-materials-receipt.json --slv-source dist/release-inputs/source-materials/slv-source.tar.gz --deno-source dist/release-inputs/source-materials/deno-source.tar.gz --cargo-vendor dist/release-inputs/source-materials/deno-cargo-vendor.tar.gz --notice-file dist/release-inputs/THIRD_PARTY_NOTICES)
          deno run --frozen --allow-read --allow-write --allow-run --allow-env source-rebuild/verify-native.ts --phase merge "${common[@]}" --source-root "$RUNNER_TEMP/merge-source-root" --work-dir "$RUNNER_TEMP/merge-work" --build-receipt "dist/release-inputs/source-proofs/$TARGET/build-receipt.json" --execution-receipt "dist/release-inputs/source-proofs/$TARGET/execution-receipt.json" 2>&1 | tee "$RUNNER_TEMP/source-logs/merge.log"
          proof_sha256="$(sha256sum "dist/release-inputs/source-proofs/$TARGET/native-proof.json" | cut -d ' ' -f 1)"
          test -n "$proof_sha256"
          echo "proof_sha256=$proof_sha256" >> "$GITHUB_OUTPUT"
      - name: Persist the three ARM phase receipts for package verification
        id: upload-proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slv-source-proof-aarch64-unknown-linux-gnu-${{ github.run_id }}
          path: |
            dist/release-inputs/source-proofs/aarch64-unknown-linux-gnu/native-proof.json
            dist/release-inputs/source-proofs/aarch64-unknown-linux-gnu/build-receipt.json
            dist/release-inputs/source-proofs/aarch64-unknown-linux-gnu/execution-receipt.json
            dist/release-inputs/tool-pins/aarch64-unknown-linux-gnu.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failed ARM merge diagnostics separately
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-arm-merge-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-logs
          if-no-files-found: warn
          retention-days: 7

  package:
    needs: [
      resolve,
      test,
      build,
      source-materials,
      source-native-linux-x64,
      source-native-macos-x64,
      source-native-macos-arm64,
      source-arm-build,
      source-arm-merge,
    ]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.operation == 'source-native-diagnostic') && (needs.resolve.outputs.release_required == 'true' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      DENO_DIR: /tmp/slv-deno-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
      - uses: denoland/setup-deno@01524fade784327df1a5ad1ead94235d392cd443 # v2.0.1
        with:
          deno-version: v2.9.3
      - name: Download and verify the test job's exact canonical notice artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.test.outputs.license_artifact_id }}
          merge-multiple: true
          path: dist/release-inputs
      - name: Download the Linux x64 product archive and receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slv-product-x86_64-unknown-linux-gnu-${{ github.run_id }}
          merge-multiple: true
          path: dist
      - name: Download the Linux ARM product archive and receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slv-product-aarch64-unknown-linux-gnu-${{ github.run_id }}
          merge-multiple: true
          path: dist
      - name: Download the macOS Intel product archive and receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slv-product-x86_64-apple-darwin-${{ github.run_id }}
          merge-multiple: true
          path: dist
      - name: Download the macOS ARM product archive and receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slv-product-aarch64-apple-darwin-${{ github.run_id }}
          merge-multiple: true
          path: dist
      - name: Download the exact immutable source and four target proof artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.source-materials.outputs.artifact_id }},${{ needs.source-native-linux-x64.outputs.artifact_id }},${{ needs.source-native-macos-x64.outputs.artifact_id }},${{ needs.source-native-macos-arm64.outputs.artifact_id }},${{ needs.source-arm-merge.outputs.artifact_id }}
          merge-multiple: true
          path: dist/release-inputs
      - name: Package the fixed payload inventory for release or unsigned CI inspection
        run: |
          set -euo pipefail
          deno install --frozen --allow-scripts=npm:protobufjs@7.4.0
          test '${{ needs.test.outputs.license_producer_run_id }}' = '${{ github.run_id }}'
          # This deliberately uses the persisted producer attempt. A downstream
          # retry must not replace it with github.run_attempt.
          deno run --frozen --allow-read scripts/release/release.ts verify-licenses '${{ needs.resolve.outputs.source_sha }}' '${{ github.run_id }}' '${{ needs.test.outputs.license_producer_attempt }}' '${{ needs.test.outputs.license_notice_sha256 }}'
          deno run --frozen --allow-read --allow-write scripts/release/release.ts materialize-licenses '${{ needs.resolve.outputs.source_sha }}' '${{ github.run_id }}' '${{ needs.test.outputs.license_producer_attempt }}' '${{ needs.test.outputs.license_notice_sha256 }}'
          test '${{ needs.source-materials.outputs.producer_run_id }}' = '${{ github.run_id }}'
          test '${{ needs.source-native-linux-x64.outputs.producer_run_id }}' = '${{ github.run_id }}'
          test '${{ needs.source-native-macos-x64.outputs.producer_run_id }}' = '${{ github.run_id }}'
          test '${{ needs.source-native-macos-arm64.outputs.producer_run_id }}' = '${{ github.run_id }}'
          test '${{ needs.source-arm-build.outputs.producer_run_id }}' = '${{ github.run_id }}'
          test '${{ needs.source-arm-merge.outputs.producer_run_id }}' = '${{ github.run_id }}'
          # Each persisted producer attempt stays bound to its artifact during
          # a partial downstream retry; never substitute github.run_attempt.
          test -n '${{ needs.source-materials.outputs.producer_attempt }}'
          test -n '${{ needs.source-native-linux-x64.outputs.producer_attempt }}'
          test -n '${{ needs.source-native-macos-x64.outputs.producer_attempt }}'
          test -n '${{ needs.source-native-macos-arm64.outputs.producer_attempt }}'
          test -n '${{ needs.source-arm-build.outputs.producer_attempt }}'
          test -n '${{ needs.source-arm-merge.outputs.producer_attempt }}'
          test "$(sha256sum dist/release-inputs/source-materials-receipt.json | cut -d ' ' -f 1)" = '${{ needs.source-materials.outputs.receipt_sha256 }}'
          test "$(sha256sum dist/release-inputs/source-proofs/x86_64-unknown-linux-gnu/native-proof.json | cut -d ' ' -f 1)" = '${{ needs.source-native-linux-x64.outputs.proof_sha256 }}'
          test "$(sha256sum dist/release-inputs/source-proofs/x86_64-apple-darwin/native-proof.json | cut -d ' ' -f 1)" = '${{ needs.source-native-macos-x64.outputs.proof_sha256 }}'
          test "$(sha256sum dist/release-inputs/source-proofs/aarch64-apple-darwin/native-proof.json | cut -d ' ' -f 1)" = '${{ needs.source-native-macos-arm64.outputs.proof_sha256 }}'
          test "$(sha256sum dist/release-inputs/source-proofs/aarch64-unknown-linux-gnu/native-proof.json | cut -d ' ' -f 1)" = '${{ needs.source-arm-merge.outputs.proof_sha256 }}'
          deno run --frozen --allow-read scripts/release/source-materials.ts verify-source-proofs dist/release-inputs/source-materials-receipt.json dist/release-inputs/source-materials dist/release-inputs/source-proofs '${{ needs.resolve.outputs.source_sha }}' source-materials/pins.json dist/release-inputs/tool-pins dist/release-inputs/THIRD_PARTY_NOTICES
          deno info --json --frozen cli/src/index.ts > dist/release-inputs/deno-info.json
          deno run --frozen --allow-read --allow-write scripts/release/release.ts graph dist/release-inputs/deno-info.json
          if [ '${{ github.event_name }}' = pull_request ]; then
            deno run --frozen --allow-read --allow-write --allow-run scripts/release/release.ts pack-ci '${{ needs.resolve.outputs.version }}' '${{ needs.resolve.outputs.source_sha }}' '${{ needs.resolve.outputs.source_ref }}' '${{ github.run_id }}' '${{ github.run_attempt }}' '${{ needs.resolve.outputs.source_timestamp }}'
          else
            deno task release:package -- '${{ needs.resolve.outputs.version }}' '${{ needs.resolve.outputs.source_sha }}' '${{ needs.resolve.outputs.source_ref }}' '${{ github.run_id }}' '${{ github.run_attempt }}' '${{ needs.resolve.outputs.source_timestamp }}'
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # PR payloads are deliberately kept out of all publisher and consumer paths.
          name: ${{ github.event_name == 'pull_request' && 'ci-payloads' || 'release-payloads' }}
          path: dist/release
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: [resolve, package]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.operation == 'source-native-diagnostic') && (needs.resolve.outputs.release_required == 'true') }}
    runs-on: ubuntu-26.04
    permissions:
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-payloads
          path: release
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - name: Preserve one standard bundle alias for each attestation subject
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$BUNDLE" && test -s "$BUNDLE"
          mkdir provenance
          subjects="$(jq -r '.assets[].name' release/release-manifest.json; printf '%s\n' release-manifest.json SHA256SUMS)"
          while IFS= read -r subject; do
            cp "$BUNDLE" "provenance/$subject.intoto.jsonl"
          done <<< "$subjects"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-provenance
          path: provenance
          if-no-files-found: error
          retention-days: 7

  activation-required:
    needs: [resolve, package]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.operation == 'source-native-diagnostic') && (needs.resolve.outputs.release_required == 'true') }}
    runs-on: ubuntu-26.04
    permissions: {}
    env:
      ACTIVATED: ${{ vars.SLV_RELEASE_ACTIVATED }}
    steps:
      - name: Fail closed until a protected release environment is activated
        run: |
          set -euo pipefail
          test "$ACTIVATED" = true || { echo 'release is packaged but activation is pending: configure protected release environment and immutable releases, then set SLV_RELEASE_ACTIVATED=true'; exit 1; }

  verify-existing:
    needs: [resolve, test]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.operation == 'source-native-diagnostic') && (needs.resolve.outputs.publication == 'verify') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      attestations: read
    env:
      GH_REPO: ValidatorsDAO/slv
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
      - uses: denoland/setup-deno@01524fade784327df1a5ad1ead94235d392cd443 # v2.0.1
        with:
          deno-version: v2.9.3
      - name: Verify immutable tag binding, complete payloads, and provenance
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.immutable // false')" = true
          gh api "repos/$GH_REPO/git/ref/tags/$TAG" > tag.json
          tag_type="$(jq -r '.object.type' tag.json)"
          tag_source="$(jq -r '.object.sha' tag.json)"
          if [ "$tag_type" = tag ]; then
            gh api "repos/$GH_REPO/git/tags/$tag_source" > tag-object.json
            test "$(jq -r '.object.type' tag-object.json)" = commit
            tag_source="$(jq -r '.object.sha' tag-object.json)"
          elif [ "$tag_type" != commit ]; then
            echo "release tag has unsupported object type: $tag_type" >&2; exit 1
          fi
          test "$tag_source" = "$SOURCE_SHA"
          gh release download "$TAG" --repo "$GH_REPO" --dir downloaded --pattern '*'
          deno run --frozen --allow-read scripts/release/workflow.ts verify-directory downloaded "$VERSION" "$SOURCE_SHA" refs/heads/main "refs/tags/$TAG" > verified
          ATTESTED_SOURCE_REF="$(sed -n '1s/^source_ref=//p' verified)"
          test -n "$ATTESTED_SOURCE_REF"
          sed -n '2,$p' verified > subjects
          while IFS= read -r subject; do
            gh attestation verify "downloaded/$subject" --bundle "downloaded/$subject.intoto.jsonl" --repo "$GH_REPO" --signer-workflow ValidatorsDAO/slv/.github/workflows/slv-remote-build.yml --source-ref "$ATTESTED_SOURCE_REF" --source-digest "$SOURCE_SHA" --deny-self-hosted-runners
          done < subjects

  publish:
    needs: [resolve, package, attest, activation-required]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.operation == 'source-native-diagnostic') && (needs.resolve.outputs.release_required == 'true') }}
    runs-on: ubuntu-26.04
    environment: release
    concurrency:
      group: slv-publish-${{ github.repository }}-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    permissions:
      attestations: read
      contents: write
    env:
      GH_REPO: ValidatorsDAO/slv
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
      SOURCE_TIMESTAMP: ${{ needs.resolve.outputs.source_timestamp }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: denoland/setup-deno@01524fade784327df1a5ad1ead94235d392cd443 # v2.0.1
        with:
          deno-version: v2.9.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-payloads
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-provenance
          path: provenance
      - name: Create or guard the exact tag and draft release
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > tag.json 2> tag.err; then
            object_type="$(jq -r '.object.type' tag.json)"; object_sha="$(jq -r '.object.sha' tag.json)"
            if [ "$object_type" = tag ]; then
              gh api "repos/$GH_REPO/git/tags/$object_sha" > tag-object.json
              test "$(jq -r '.object.type' tag-object.json)" = commit
              object_sha="$(jq -r '.object.sha' tag-object.json)"
            fi
            test "$object_type" = commit || test "$object_type" = tag
            test "$object_sha" = "$SOURCE_SHA" || { echo 'existing tag points at another source'; exit 1; }
          elif grep -q 404 tag.err; then
            # Create an annotated tag object. Existing lightweight and annotated
            # tags remain recoverable above if and only if their commit matches.
            tag_object="$(gh api --method POST "repos/$GH_REPO/git/tags" \
              -f "tag=$TAG" \
              -f "message=$TAG" \
              -f "object=$SOURCE_SHA" \
              -f 'type=commit' \
              -f 'tagger[name]=github-actions[bot]' \
              -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' \
              -f "tagger[date]=$SOURCE_TIMESTAMP" \
              --jq .sha)"
            test -n "$tag_object"
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$tag_object"
          else
            cat tag.err >&2; exit 1
          fi
          if gh api "repos/$GH_REPO/releases/tags/$TAG" > release.json 2> release.err; then
            test "$(jq -r .draft release.json)" = true || { echo 'existing release must be immutable and is verified by verify-existing, never republished'; exit 1; }
          elif grep -q 404 release.err; then
            gh release create "$TAG" --repo "$GH_REPO" --target "$SOURCE_SHA" --draft --title "$TAG"
          else
            cat release.err >&2; exit 1
          fi
      - name: Recover only matching draft payloads, then stage missing payloads
        run: |
          set -euo pipefail
          mkdir existing
          # Enumerate first: a new draft has no assets, whereas a failed download
          # of a declared asset is an error and must not be mistaken for emptiness.
          gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.assets[].name' > existing-names
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            gh release download "$TAG" --repo "$GH_REPO" --dir existing --pattern "$name"
          done < existing-names
          allowed_payloads="$(jq -r '.assets[].name' release/release-manifest.json; printf '%s\n' release-manifest.json SHA256SUMS)"
          allowed_subjects="$(printf '%s\n' "$allowed_payloads" | sed 's/$/.intoto.jsonl/')"
          for path in existing/*; do
            [ -e "$path" ] || continue
            name="$(basename "$path")"
            if [ "$name" = release-manifest.json ]; then
              deno run --frozen --allow-read scripts/release/workflow.ts guard-draft-manifest "$path" "release/$name"
            elif printf '%s\n' "$allowed_payloads" | grep -Fxq "$name"; then
              cmp "release/$name" "$path" || { echo "draft payload conflict: $name"; exit 1; }
            elif ! printf '%s\n' "$allowed_subjects" | grep -Fxq "$name"; then
              echo "unexpected existing draft asset: $name"; exit 1
            fi
          done
          while IFS= read -r name; do
            [ -e "existing/$name" ] || gh release upload "$TAG" --repo "$GH_REPO" "release/$name"
          done <<< "$allowed_payloads"
      - name: Attach the attestation job's standard bundle for every subject
        run: |
          set -euo pipefail
          subjects="$(jq -r '.assets[].name' release/release-manifest.json; printf '%s\n' release-manifest.json SHA256SUMS)"
          while IFS= read -r subject; do
            bundle="provenance/$subject.intoto.jsonl"
            test -s "$bundle"
            test -e "existing/$subject.intoto.jsonl" || gh release upload "$TAG" --repo "$GH_REPO" "$bundle#${subject}.intoto.jsonl"
          done <<< "$subjects"
      - name: Re-download every staged asset and verify provenance before publication
        run: |
          set -euo pipefail
          mkdir downloaded
          gh release download "$TAG" --repo "$GH_REPO" --dir downloaded --pattern '*'
          deno run --frozen --allow-read scripts/release/workflow.ts verify-directory downloaded "$VERSION" "$SOURCE_SHA" "$SOURCE_REF" > verified
          ATTESTED_SOURCE_REF="$(sed -n '1s/^source_ref=//p' verified)"
          test "$ATTESTED_SOURCE_REF" = "$SOURCE_REF"
          sed -n '2,$p' verified > subjects
          while IFS= read -r subject; do
            gh attestation verify "downloaded/$subject" --bundle "downloaded/$subject.intoto.jsonl" --repo "$GH_REPO" --signer-workflow ValidatorsDAO/slv/.github/workflows/slv-remote-build.yml --source-ref "$ATTESTED_SOURCE_REF" --source-digest "$SOURCE_SHA" --deny-self-hosted-runners
          done < subjects
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false
      - name: Assert the published release is immutable without mutation
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.immutable // false')" = true
