    env:
      DENO_DIR: /tmp/slv-deno-cache
      TARGET: aarch64-unknown-linux-gnu
      BUILD_HOST: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
