          execution_receipt_sha256="$(sha256sum "dist/release-inputs/source-proofs/$TARGET/execution-receipt.json" | cut -d ' ' -f 1)"
          test -n "$execution_receipt_sha256"
          echo "execution_receipt_sha256=$execution_receipt_sha256" >> "$GITHUB_OUTPUT"
