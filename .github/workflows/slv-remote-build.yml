        with:
          name: source-arm-execution-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-logs
          if-no-files-found: warn
          retention-days: 7

  source-arm-merge:
    needs: [resolve, test, source-materials, source-arm-build, source-arm-execute]
    if: needs.resolve.outputs.release_required == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-proof.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-proof.outputs.artifact-digest }}
      producer_run_id: ${{ github.run_id }}
      producer_attempt: ${{ github.run_attempt }}
      proof_sha256: ${{ steps.merge.outputs.proof_sha256 }}
    env:
      DENO_DIR: /tmp/slv-deno-cache
      TARGET: aarch64-unknown-linux-gnu
      BUILD_HOST: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
