---
# This playbook set the identity from the staked key, which it took from a file on the node. Deploy puts no staked key
# on a node any more: the key stays on the controller (~/.slv/keys/<identity>.json) and reaches the node on stdin
# during slv v set:identity and slv v switch, and a restarted node comes back on its unstaked identity. So there is
# nothing to set the identity from on the node, and this play only refuses: its first task fails and nothing else runs.
- name: Set Identity to Testnet Validator Key (refused, the node has no staked key)
  hosts: "{{ on_host | default('all') }}"
  gather_facts: no
  tasks:
    - name: Refuse to set the identity from a key on the node
      ansible.builtin.fail:
        msg: >-
          SLV_KEYLESS_REFUSED: set_identity_to_active.yml sets the identity from a staked key on the node, and slv does
          not put the staked key on a node: it stays on the controller and reaches the node on stdin. Nothing was
          changed on {{ inventory_hostname }}. Use slv v set:identity -n testnet -p {{ inventory_hostname }}, or
          slv v switch -n testnet to move the identity from one host to another.
