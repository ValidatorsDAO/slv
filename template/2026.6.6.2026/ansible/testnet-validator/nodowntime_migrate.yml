---
- name: Initialize and Transfer Tower Files
  hosts: "{{ source_host }},{{ target_host }}"
  become: true
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Fail unless the source and target validator types are supported
      ansible.builtin.assert:
        that:
          - hostvars[source_host].validator_type | default('') in ['agave', 'jito', 'allnodes-jito', 'firedancer-agave', 'firedancer-jito']
          - hostvars[target_host].validator_type | default('') in ['agave', 'jito', 'allnodes-jito', 'firedancer-agave', 'firedancer-jito']
        fail_msg: "The source ({{ source_host }}: '{{ hostvars[source_host].validator_type | default('undefined') }}') and target ({{ target_host }}: '{{ hostvars[target_host].validator_type | default('undefined') }}') validator types must each be one of agave, jito, allnodes-jito, firedancer-agave, firedancer-jito. Nothing was changed."
        success_msg: "Source validator type is {{ hostvars[source_host].validator_type | default('undefined') }} and Target validator type is {{ hostvars[target_host].validator_type | default('undefined') }}"
      run_once: true

    - name: Stop while the cluster is between the Alpenglow activation and the genesis certificate
      ansible.builtin.import_tasks: ../cmn/tasks/alpenglow_state.yml
      vars:
        slv_alpenglow_network: testnet
        slv_alpenglow_freeze: true

    - name: Check connectivity to all hosts
      ansible.builtin.ping:
      register: ping_result

    - name: Fail if any host is unreachable
      ansible.builtin.fail:
        msg: "Host {{ inventory_hostname }} is unreachable."
      when: ping_result.ping is not defined

- import_playbook: switch_off_identity.yml
  vars:
    off_host: "{{ source_host }}"
  when: validator_type in ['agave', 'jito', 'allnodes-jito']

- import_playbook: switch_off_firedancer_identity.yml
  vars:
    off_host: "{{ source_host }}"
  when: validator_type in ['firedancer-agave', 'firedancer-jito']

- import_playbook: switch_on_identity.yml
  vars:
    on_host: "{{ target_host }}"
    slv_alpenglow_demoted_source: "{{ source_host }}"
  when: validator_type in ['agave', 'jito', 'allnodes-jito']

- import_playbook: switch_on_firedancer_identity.yml
  vars:
    on_host: "{{ target_host }}"
    slv_alpenglow_demoted_source: "{{ source_host }}"
  when: validator_type in ['firedancer-agave', 'firedancer-jito']
