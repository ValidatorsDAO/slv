---
# This playbook took the staked key from a file on the node (/home/solv/testnet-validator-keypair.json) and gave it to
# fdctl. Deploy puts no staked key on a node any more: the key stays on the controller (~/.slv/keys/<identity>.json)
# and reaches the node on stdin during slv v set:identity and slv v switch. So there is nothing to switch the identity
# on from on the node, and this play only refuses: its first task fails and nothing else runs.
- name: Switch On Firedancer Identity (refused, the node has no staked key)
  hosts: "{{ on_host | default('all') }}"
  gather_facts: no
  any_errors_fatal: true
  tasks:
    - name: Refuse to switch the identity on from a key on the node
      ansible.builtin.fail:
        msg: >-
          SLV_KEYLESS_REFUSED: switch_on_firedancer_identity.yml sets the identity from a staked key on the node, and
          slv does not put the staked key on a node: it stays on the controller and reaches the node on stdin. Nothing
          was changed on {{ inventory_hostname }}. Use slv v set:identity -n testnet -p {{ inventory_hostname }}, or
          slv v switch -n testnet to move the identity from one host to another.
