---
# The templates the init playbooks draw to start a node, by network, role and
# validator_type (and rpc_type for role rpc). Each entry names a template whose rendered
# text the listen model reads to decide what the node listens on, or, for of1-listen, a
# play variable that holds the listen address:
#
#   kind  how the listen model reads the rendered text: agave-args (start script),
#         fd-toml (Frankendancer config), unit (systemd unit), richat (richat
#         config, a YAML document), yellowstone (Yellowstone plugin config, a JSON
#         document) or of1-listen (the Old Faithful listen address)
#   path  the template, relative to the jinja/ directory of this release
#   play  the init playbook that draws it, relative to the ansible/ directory
#   var   of1-listen only: the play variable whose default is the listen address
#         (the address is not a template, so there is no path)
#
# No init or start playbook reads this file yet. The firewall render matrix
# (tests/firewall/render_matrix.yml) reads it and checks two things: that its keys are the
# start configurations that tests/firewall/matrix.py lists (a configuration without an
# entry, or an entry without a configuration, stops the run), and that the text of each
# `play` contains its `path` (for of1-listen, that the play has the `var`). It does not read
# the init.yml playbooks that import the plays (<network>-<role>/init.yml), so it does not
# notice a change to the conditions under which they import a play, nor a play that starts
# to draw another template. When either changes, update this table and matrix.py by hand.
#
# Not listed because init draws nothing for them:
#   - testnet validator with allnodes-jito: testnet-validator/init.yml sets up and
#     starts agave, jito and the Firedancer clients, and does not set up allnodes-jito
#   - the files that update_startup_config.yml draws later. For the testnet
#     validator that is a different start script from the one init draws
#     (start-validator-agave.sh.j2 and start-validator-jito.sh.j2 instead of
#     start-validator.sh.j2), so a node's arguments change after its first update.
#   - testnet and devnet RPC with Old Faithful: those init playbooks do not install it
#
# Geyser gRPC and Index RPC + gRPC on agave and jito: the entry is the geyser.json of the
# Yellowstone plugin, which init installs (geyser_build.yml of the network). The inventory can
# set geyser_plugin: richat, but init stops such a node while richat has no release for its
# agave (4.3 or later, which every pin of this release is), so no node needs a richat entry
# yet. The table has one list for each start configuration and no place for a choice that the
# inventory makes: when richat can be used again, that node would be described by the same
# list with the Yellowstone entry replaced by
#   {kind: richat, path: mainnet-rpc/richat-setting.yml.j2, play: mainnet-rpc/install_richat.yml}
# which has the same consumer gRPC port (10000) and, in the templates of this release, two
# ports that Yellowstone's config does not have: the richat pubsub on 7111 (consumer) and the
# richat metrics on 10124, where Yellowstone's metrics are on 8999. Only mainnet-rpc has
# richat templates; testnet-rpc and devnet-rpc have none.
slv_startup_templates:
  mainnet:
    validator:
      agave: &mainnet_validator_agave_line
        - {kind: agave-args, path: mainnet-validator/start-validator.sh.j2, play: mainnet-validator/create-start-validator-sh.yml}
        - {kind: unit, path: mainnet-validator/solv.service.j2, play: mainnet-validator/setup_solv_service.yml}
      jito: *mainnet_validator_agave_line
      allnodes-jito: *mainnet_validator_agave_line
      firedancer-agave: &mainnet_validator_firedancer_line
        - {kind: fd-toml, path: mainnet-validator/firedancer-config.toml.j2, play: mainnet-validator/setup_firedancer.yml}
      firedancer-jito: *mainnet_validator_firedancer_line
    rpc:
      agave: &mainnet_rpc_agave_line
        "Geyser gRPC":
          - &mainnet_rpc_start {kind: agave-args, path: mainnet-rpc/start-validator.sh.j2, play: mainnet-rpc/create-start-validator-sh.yml}
          - &mainnet_rpc_unit {kind: unit, path: mainnet-rpc/solv.service.j2, play: mainnet-rpc/setup-solv-service.yml}
          - &mainnet_rpc_geyser {kind: yellowstone, path: mainnet-rpc/geyser.json.j2, play: mainnet-rpc/geyser_build.yml}
        "Index RPC":
          - *mainnet_rpc_start
          - *mainnet_rpc_unit
          - &mainnet_rpc_of1 {kind: of1-listen, play: mainnet-rpc/install_of1_service.yml, var: faithful_listen}
        "SendTx RPC":
          - *mainnet_rpc_start
          - *mainnet_rpc_unit
        "Index RPC + gRPC":
          - *mainnet_rpc_start
          - *mainnet_rpc_unit
          - *mainnet_rpc_geyser
          - *mainnet_rpc_of1
      jito: *mainnet_rpc_agave_line
      firedancer-agave: &mainnet_rpc_firedancer_line
        "Index RPC":
          - &mainnet_rpc_fd {kind: fd-toml, path: mainnet-rpc/firedancer-config.toml.j2, play: mainnet-rpc/setup_firedancer.yml}
          - *mainnet_rpc_of1
        "SendTx RPC":
          - *mainnet_rpc_fd
      firedancer-jito: *mainnet_rpc_firedancer_line
  testnet:
    validator:
      agave: &testnet_validator_agave_line
        - {kind: agave-args, path: testnet-validator/start-validator.sh.j2, play: testnet-validator/deploy-start-validator-sh.yml}
        - {kind: unit, path: testnet-validator/solv.service.j2, play: testnet-validator/setup_solv_service.yml}
      jito: *testnet_validator_agave_line
      firedancer-agave:
        - {kind: fd-toml, path: testnet-validator/firedancer-config-agave.toml.j2, play: testnet-validator/setup_firedancer_agave.yml}
      firedancer-jito:
        - {kind: fd-toml, path: testnet-validator/firedancer-config-jito.toml.j2, play: testnet-validator/setup_firedancer_jito.yml}
    rpc:
      agave: &testnet_rpc_agave_line
        "Geyser gRPC":
          - &testnet_rpc_start {kind: agave-args, path: testnet-rpc/start-validator.sh.j2, play: testnet-rpc/create-start-validator-sh.yml}
          - &testnet_rpc_unit {kind: unit, path: testnet-rpc/solv.service.j2, play: testnet-rpc/setup_solv_service.yml}
          - &testnet_rpc_geyser {kind: yellowstone, path: testnet-rpc/geyser.json.j2, play: testnet-rpc/geyser_build.yml}
        "Index RPC":
          - *testnet_rpc_start
          - *testnet_rpc_unit
        "SendTx RPC":
          - *testnet_rpc_start
          - *testnet_rpc_unit
        "Index RPC + gRPC":
          - *testnet_rpc_start
          - *testnet_rpc_unit
          - *testnet_rpc_geyser
      jito: *testnet_rpc_agave_line
      firedancer-agave: &testnet_rpc_firedancer_line
        "Index RPC":
          - &testnet_rpc_fd {kind: fd-toml, path: testnet-rpc/firedancer-config.toml.j2, play: testnet-rpc/setup_firedancer.yml}
        "SendTx RPC":
          - *testnet_rpc_fd
      firedancer-jito: *testnet_rpc_firedancer_line
  devnet:
    rpc:
      agave: &devnet_rpc_agave_line
        "Geyser gRPC":
          - &devnet_rpc_start {kind: agave-args, path: devnet-rpc/start-validator.sh.j2, play: devnet-rpc/create-start-validator-sh.yml}
          - &devnet_rpc_unit {kind: unit, path: devnet-rpc/solv.service.j2, play: devnet-rpc/setup_solv_service.yml}
          - &devnet_rpc_geyser {kind: yellowstone, path: devnet-rpc/geyser.json.j2, play: devnet-rpc/geyser_build.yml}
        "Index RPC":
          - *devnet_rpc_start
          - *devnet_rpc_unit
        "SendTx RPC":
          - *devnet_rpc_start
          - *devnet_rpc_unit
        "Index RPC + gRPC":
          - *devnet_rpc_start
          - *devnet_rpc_unit
          - *devnet_rpc_geyser
      jito: *devnet_rpc_agave_line
      firedancer-agave: &devnet_rpc_firedancer_line
        "Index RPC":
          - &devnet_rpc_fd {kind: fd-toml, path: devnet-rpc/firedancer-config.toml.j2, play: devnet-rpc/setup_firedancer.yml}
        "SendTx RPC":
          - *devnet_rpc_fd
      firedancer-jito: *devnet_rpc_firedancer_line
