---
- name: Update Startup Validator Config
  hosts: all
  become: true
  # versions.yml is read when it exists; -e agave_version, jito_version or
  # allnodes_jito_version also give the start script its agave version.
  vars_files:
    - ["~/.slv/versions.yml", "/dev/null"]
  tasks:
    - name: Set validator type fact for each host
      set_fact:
        validator_type: "{{ validator_type | default('firedancer-jito') }}"

    - name: Updatge start-validator.sh from template for Agave
      template:
        src: ~/.slv/devnet-rpc/start-validator.sh.j2
        dest: /home/solv/start-validator.sh
        mode: "0755"
        owner: solv
        group: solv
      vars:
        vote_account: '{{ hostvars[inventory_hostname].vote_account }}'
      when: validator_type in ['agave', 'jito']

    - name: Update firedancer-config.toml from template
      template:
        src: ~/.slv/devnet-rpc/firedancer-config.toml.j2
        dest: /home/solv/firedancer-config.toml
        owner: solv
        group: solv
        mode: "0644"
      vars:
        block_engine_region: "{{ hostvars[inventory_hostname].block_engine_region }}"
        vote_account: "{{ hostvars[inventory_hostname].vote_account }}"
        commission_bps: "{{ hostvars[inventory_hostname].commission_bps }}"
      when: validator_type in ['firedancer-jito', 'firedancer-agave']