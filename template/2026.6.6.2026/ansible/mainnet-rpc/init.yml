---
# Geyser gRPC and Index RPC + gRPC nodes on agave or jito get the Yellowstone Geyser plugin
# (geyser_build.yml), built at mainnet_rpcs.geyser_version of ~/.slv/versions.yml.
# geyser_plugin: richat in the inventory installs richat instead (geyser_richat_build.yml
# and install_richat.yml, at mainnet_rpcs.richat_version); any other value stops the play.
- name: Load validator type from inventory
  hosts: all
  gather_facts: no
  any_errors_fatal: true
  tasks:
    - name: Fail unless validator_type is a supported type
      ansible.builtin.assert:
        that:
          - validator_type | default('') in ['agave', 'jito', 'allnodes-jito', 'firedancer-agave', 'firedancer-jito']
        fail_msg: "validator_type '{{ validator_type | default('undefined') }}' is not supported on {{ inventory_hostname }}. Set it in the inventory to one of agave, jito, allnodes-jito, firedancer-agave, firedancer-jito. Nothing was changed."
        success_msg: "Validator type is {{ validator_type | default('undefined') }}"

    - name: Set Geyser plugin fact for each host
      set_fact:
        geyser_plugin: "{{ geyser_plugin | default('yellowstone') }}"

    - name: Fail unless geyser_plugin is yellowstone or richat
      ansible.builtin.assert:
        that:
          - geyser_plugin in ['yellowstone', 'richat']
        fail_msg: "geyser_plugin must be yellowstone or richat (or left out for yellowstone), not '{{ geyser_plugin }}'. Nothing was changed on {{ inventory_hostname }}."
        success_msg: "Geyser plugin is {{ geyser_plugin }}"

- import_playbook: ../cmn/fix_permissions.yml
- import_playbook: ../cmn/copy_restart_sh.yml
  vars:
    restarter_snapshot_network: mainnet
- import_playbook: copy_keys.yml
- import_playbook: add_solv.yml
- import_playbook: ../cmn/update_ubuntu.yml
- import_playbook: ../cmn/install_package.yml

- import_playbook: ../cmn/setup_node_exporter.yml
- import_playbook: ../cmn/install_rust.yml
  when: validator_type in ['firedancer-agave', 'firedancer-jito']

- import_playbook: ../cmn/disable_swap.yml
- import_playbook: ../cmn/mount_disks.yml
- import_playbook: ../cmn/optimize_system.yml
- import_playbook: ../cmn/setup_norestart.yml
- import_playbook: ../cmn/setup_logrotate.yml
- import_playbook: ../cmn/build_solana.yml
- import_playbook: create-symlink.yml

- import_playbook: setup_firedancer.yml
  when: validator_type in ['firedancer-agave', 'firedancer-jito']

- import_playbook: setup-solv-service.yml
  when: validator_type in ['agave', 'jito']

- import_playbook: create-start-validator-sh.yml
  when: validator_type in ['agave', 'jito']

- import_playbook: geyser_build.yml
  when:
    - rpc_type in ['Geyser gRPC', 'Index RPC + gRPC']
    - validator_type in ['agave', 'jito']
    - geyser_plugin == 'yellowstone'

- import_playbook: geyser_richat_build.yml
  when:
    - rpc_type in ['Geyser gRPC', 'Index RPC + gRPC']
    - validator_type in ['agave', 'jito']
    - geyser_plugin == 'richat'

- import_playbook: install_richat.yml
  when:
    - rpc_type in ['Geyser gRPC', 'Index RPC + gRPC']
    - validator_type in ['agave', 'jito']
    - geyser_plugin == 'richat'

- import_playbook: ../cmn/wget_snapshot.yml

- import_playbook: start_solv.yml
  when: validator_type in ['agave', 'jito']

- import_playbook: start_firedancer.yml
  when: validator_type in ['firedancer-jito', 'firedancer-agave']

- import_playbook: install_of1.yml
  when:
    - rpc_type in ['Index RPC', 'Index RPC + gRPC']

- import_playbook: install_of1_service.yml
  when:
    - rpc_type in ['Index RPC', 'Index RPC + gRPC']

# Rolling cache: keep last N (default 30) epochs of indexes locally so
# getTransaction etc. answer in ~70ms instead of ~300ms.  CAR files stay
# remote.  Maintained by a daily systemd timer.
- import_playbook: ../cmn/of1_index_cache_sync.yml
  when:
    - rpc_type in ['Index RPC', 'Index RPC + gRPC']
