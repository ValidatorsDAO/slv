---
# The older mainnet RPC initialisation. It begins as init.yml does: the type gate, which stops a validator_type
# that is not supported, and, after the RPC type is set, cmn/check_alpenglow_floor.yml, which stops a jito
# older than 4.3.0, the floor of Alpenglow on mainnet, and a Yellowstone plugin built for a solana older
# than that. Both stop the run before anything is changed. install_jito.yml installs jito_version of the host
# or -e, else version_jito of mainnet_rpcs, and geyser_build.yml builds geyser_version of the host or -e,
# else that of mainnet_rpcs; the check reads the same.
- name: Load validator type from inventory
  hosts: all
  gather_facts: no
  any_errors_fatal: true
  tasks:
    - name: Fail unless validator_type is a supported type
      ansible.builtin.assert:
        that:
          - validator_type | default('') in ['agave', 'jito', 'allnodes-jito', 'firedancer-agave', 'firedancer-jito']
        fail_msg: "validator_type '{{ validator_type | default('undefined') }}' is not supported on {{ inventory_hostname }}. Set it in the inventory to one of agave, jito, allnodes-jito, firedancer-agave, firedancer-jito. Nothing was changed."
        success_msg: "Validator type is {{ validator_type | default('undefined') }}"

- name: Load RPC type from inventory
  hosts: all
  gather_facts: no
  tasks:
    - name: Set RPC type fact for each host
      set_fact:
        rpc_type: "{{ rpc_type | default('Geyser gRPC') }}"
    
    - name: Debug RPC type. Stop if not set
      debug:
        msg: "RPC type is {{ rpc_type }}"

    - name: Fail if RPC type is not set
      fail:
        msg: "RPC type is not set. Please set it in the inventory."
      when: rpc_type is not defined

- import_playbook: ../cmn/check_alpenglow_floor.yml
  vars:
    versions_section: mainnet_rpcs
    floor_client: jito

- import_playbook: ../cmn/fix_permissions.yml
- import_playbook: ../cmn/copy_restart_sh.yml
  vars:
    restarter_snapshot_network: mainnet
- import_playbook: copy_keys.yml
- import_playbook: add_solv.yml
- import_playbook: ../cmn/update_ubuntu.yml
- import_playbook: ../cmn/install_package.yml
- import_playbook: ../cmn/setup_node_exporter.yml
- import_playbook: install_rust.yml
- import_playbook: install_jito.yml
- import_playbook: setup_ufw.yml
- import_playbook: ../cmn/disable_swap.yml
- import_playbook: ../cmn/mount_disks.yml
- import_playbook: ../cmn/optimize_system.yml
- import_playbook: ../cmn/setup_norestart.yml
- import_playbook: configure_hugetlbfs.yml
- import_playbook: setup_logrotate.yml
- import_playbook: ../cmn/setup_unstaked_identity.yml
- import_playbook: update_startup_config.yml
- import_playbook: setup-solv-service.yml

- import_playbook: geyser_build.yml
  when: rpc_type == 'Geyser gRPC'

- import_playbook: ../cmn/wget_snapshot.yml
- import_playbook: start-solv-service.yml
