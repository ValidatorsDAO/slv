---
# Run Richat installation and then deploy the Geyser plugin that uses it.
# richat has no release for agave 4.3 or later yet: cmn/check_richat_release.yml stops a node that is
# set to run such an agave before anything is built.

- import_playbook: ../cmn/check_richat_release.yml
  vars:
    versions_section: mainnet_rpcs

- import_playbook: install_richat.yml
- import_playbook: geyser_richat_build.yml
