---
- name: Install Agave3
  hosts: all
  become: true
  vars_files:
    - ~/.slv/versions.yml
  vars:
    agave_repo: https://github.com/anza-xyz/agave.git
    agave_install_dir: '/home/solv/agave'
    agave_bin_dir: '{{ agave_install_dir }}/target/release'
    solana_release_dir: '/home/solv/.local/share/solana/install/active_release'
    solana_bin_dir: '{{ solana_release_dir }}/bin'
    solana_lib_dir: '{{ solana_release_dir }}/lib'

  tasks:
    # agave_version of -e or of the host, else version_agave of the section of versions.yml that the
    # calling playbook passes as versions_section (mainnet_rpcs, testnet_validators, ...)
    - name: Resolve agave version (override with -e agave_version=)
      set_fact:
        agave_version_resolved: "v{{ agave_version | default(slv_pins.version_agave | default('', true), true) }}"
      vars:
        slv_pins: "{{ lookup('ansible.builtin.vars', versions_section, default={}) if (versions_section | default('')) != '' else {} }}"

    - name: Ensure agave version is resolved
      assert:
        that:
          - agave_version_resolved != 'v'
        fail_msg: "No agave version for {{ inventory_hostname }}: set agave_version (-e or the host), or version_agave in {{ versions_section | default('the section that the calling playbook passes as versions_section') }} of ~/.slv/versions.yml. Nothing was built."

    - name: Check if Rust is installed
      become: no
      shell: command -v rustc
      register: rust_check
      changed_when: false
      failed_when: false

    - name: Install Rust
      become: no
      shell: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        source $HOME/.cargo/env
      when: rust_check.rc != 0
      args:
        executable: /bin/bash

    - name: Install build dependencies
      apt:
        name:
          - build-essential
          - pkg-config
          - libssl-dev
          - libudev-dev
          - libclang-dev
          - cmake
          - protobuf-compiler
          - git
          - curl
        state: present

    - name: Git clone Agave3 repository
      become: no
      git:
        repo: '{{ agave_repo }}'
        dest: '{{ agave_install_dir }}'
        version: '{{ agave_version_resolved }}'
        force: yes

    - name: Build and install Agave
      become: no
      shell: |
        set -e
        source $HOME/.cargo/env
        cd {{ agave_install_dir }}
        ./scripts/cargo-install-all.sh .
      args:
        executable: /bin/bash
      environment:
        PATH: "/home/solv/.cargo/bin:{{ ansible_env.PATH }}"
      register: build_result

    - name: Add Bin to PATH in .profile
      become: no
      lineinfile:
        path: '/home/solv/.profile'
        line: 'export PATH={{ solana_bin_dir }}:$PATH'
        state: present
        create: yes

    - name: Add Lib to LD_LIBRARY_PATH in .profile
      become: no
      lineinfile:
        path: '/home/solv/.profile'
        line: 'export LD_LIBRARY_PATH={{ solana_lib_dir }}:$LD_LIBRARY_PATH'
        state: present
        create: yes

    # ====== Symlink agave*/solana/solana* into active_release/bin ======
    - name: Ensure Solana active release bin directory exists
      file:
        path: '{{ solana_bin_dir }}'
        state: directory
        owner: solv
        group: solv
        mode: '0755'

    - name: Find agave* and solana* binaries in target/release (include 'solana')
      find:
        paths: '{{ agave_bin_dir }}'
        recurse: no
        file_type: file
        patterns:
          - 'agave-*'
          - 'solana'
          - 'solana-*'
      register: found_bins

    - name: Filter only real executables (exclude .d/.rlib/.so)
      set_fact:
        binary_candidates: >-
          {{ found_bins.files
             | map(attribute='path')
             | reject('search', '\.(d|rlib|so)$')
             | list }}

    - name: Symlink binaries into active_release/bin
      become: no
      file:
        src: '{{ item }}'
        dest: '{{ solana_bin_dir }}/{{ item | basename }}'
        state: link
        force: yes
      loop: '{{ binary_candidates }}'
      when: build_result is succeeded

    # ====== Symlink shared libraries into active_release/lib ======
    - name: Ensure Solana active release lib directory exists
      file:
        path: '{{ solana_lib_dir }}'
        state: directory
        owner: solv
        group: solv
        mode: '0755'

    - name: Find shared libraries in target/release/deps
      find:
        paths: '{{ agave_bin_dir }}/deps'
        recurse: no
        file_type: file
        patterns:
          - 'lib*.so'
      register: found_libs

    - name: Symlink shared libraries into active_release/lib
      become: no
      file:
        src: '{{ item.path }}'
        dest: '{{ solana_lib_dir }}/{{ item.path | basename }}'
        state: link
        force: yes
      loop: '{{ found_libs.files }}'
      when: build_result is succeeded

    - name: Verify Agave installation (via active_release/bin)
      become: no
      shell: |
        {{ solana_bin_dir }}/agave-validator --version || true
        {{ solana_bin_dir }}/solana --version || true
      args:
        executable: /bin/bash
      register: agave_version_check
      changed_when: false
      failed_when: false

    - name: Debug Agave version check
      debug:
        var: agave_version_check.stdout
