---
# Generic nginx reverse-proxy installer for SLV. Renders a single
# vhost that proxies a public hostname (typically a Cloudflare-
# proxied `*.erpc.global` record, set via POST /v3/dns/set) down to
# a loopback service on this host — by default the gateway on
# 127.0.0.1:20026, but any `upstream_port` works.
#
# No certbot / Let's Encrypt here. The playbook writes an origin
# certificate and key that the caller supplies (origin_cert_b64 /
# origin_key_b64, e.g. a Cloudflare Origin CA cert) or, when no cert
# is supplied, generates a self-signed one. It then renders a 443
# server block that uses that cert, plus a port 80 block for direct
# access. Cloudflare Full works with either cert; Cloudflare Full
# (strict) needs the supplied one.
#
# Variables (all overridable via --extra-vars):
#   fqdn           — required. Fully-qualified hostname to serve,
#                    e.g. u-a8b3nq9p2xz4k.erpc.global
#   upstream_port  — loopback port to proxy to. Default 20026
#                    (the SLV gateway).
#   server_name    — nginx server_name directive. Defaults to fqdn.
#   origin_cert_b64 — optional. Base64-encoded PEM origin certificate.
#                    Default empty (a self-signed cert is generated).
#   origin_key_b64 — optional. Base64-encoded PEM origin private key.
#                    Default empty. Supply it together with
#                    origin_cert_b64.
#
# Idempotent: re-running rewrites the vhost file and reloads nginx.
# Stale vhosts from a prior `slv install nginx` with a different
# fqdn are NOT cleaned up automatically — they're left in
# sites-available for the operator to remove if they want.
- name: Install nginx reverse proxy
  hosts: all
  become: true

  vars:
    upstream_port: 20026
    server_name: '{{ fqdn }}'
    # Base64-encoded PEM origin cert + private key, optionally
    # supplied by the caller (e.g. `slv install nginx` after a
    # successful Cloudflare Origin CA issuance). Each is written
    # verbatim when its own variable is non-empty. The self-signed
    # fallback keys on the cert variable alone: it runs when
    # origin_cert_b64 is empty (and only if the crt file does not
    # already exist), and it also generates the key. Supply both
    # variables together. A self-signed cert works with Cloudflare
    # Full (not strict) but NOT Full (strict), which needs the
    # supplied cert.
    origin_cert_b64: ''
    origin_key_b64: ''

  pre_tasks:
    - name: Assert fqdn is set
      assert:
        that:
          - fqdn is defined
          - fqdn | length > 0
        fail_msg: >-
          `fqdn` variable is required. Pass it via
          --extra-vars fqdn=<host>.erpc.global

  tasks:
    - name: Install nginx
      apt:
        name:
          - nginx
          - openssl
        state: present
        update_cache: yes
        # Skip the cache refresh when it's less than an hour old —
        # keeps re-runs fast without masking a legitimately stale
        # repo state.
        cache_valid_time: 3600

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    # Origin TLS certificate. Cloudflare in "Full" SSL mode connects
    # to the origin over HTTPS on port 443 without validating the
    # origin certificate, so the self-signed fallback below is
    # enough. A caller-supplied Cloudflare Origin CA cert (written
    # by the tasks below) works with both Full and Full (strict).
    # Port 443 must be served at all: without it
    # Cloudflare reports HTTP 521 ("Web Server Is Down", i.e. it
    # couldn't connect to origin).
    #
    # Cert lives separately from Let's Encrypt or any other managed
    # PKI — Cloudflare fronts user-facing TLS, so the origin cert
    # is purely an internal handshake signal.
    - name: Ensure ssl directory exists
      file:
        path: /etc/nginx/ssl
        state: directory
        mode: '0700'

    # If the caller supplied an Origin CA cert + key via
    # --extra-vars, write those verbatim (overwrites whatever was
    # there before — rotating to a fresh cert is idempotent).
    # These tasks are no-ops when the vars are empty.
    - name: Write caller-supplied origin certificate
      copy:
        content: '{{ origin_cert_b64 | b64decode }}'
        dest: '/etc/nginx/ssl/{{ fqdn }}.crt'
        mode: '0644'
      when: origin_cert_b64 | length > 0

    - name: Write caller-supplied origin private key
      copy:
        content: '{{ origin_key_b64 | b64decode }}'
        dest: '/etc/nginx/ssl/{{ fqdn }}.key'
        mode: '0600'
      diff: false
      when: origin_key_b64 | length > 0

    # Self-signed fallback for when the caller didn't supply a
    # cert (origin_cert_b64 is empty). Only generates if the crt
    # file doesn't already exist (idempotent via `creates:`); it
    # writes both the cert and the key.
    - name: Generate self-signed origin cert (fallback)
      command: >-
        openssl req -x509 -nodes -days 3650 -newkey rsa:2048
        -keyout /etc/nginx/ssl/{{ fqdn }}.key
        -out /etc/nginx/ssl/{{ fqdn }}.crt
        -subj "/CN={{ fqdn }}"
      args:
        creates: /etc/nginx/ssl/{{ fqdn }}.crt
      when: origin_cert_b64 | length == 0

    - name: Render vhost file
      copy:
        dest: '/etc/nginx/sites-available/{{ fqdn }}.conf'
        mode: '0644'
        # TWO server blocks: one on 80, one on 443 with the cert
        # written above (caller-supplied or self-signed). With
        # Cloudflare in Full SSL mode (origin-pull over HTTPS) we
        # NEED 443 open for Cloudflare to reach origin at all — an
        # 80-only config produces HTTP 521 "Web Server Is Down" at
        # the edge. Serving 80 alongside lets users who bypass
        # Cloudflare (direct IP / LAN debugging) also hit nginx
        # without mucking with http/https.
        content: |
          server {
            listen 80;
            listen [::]:80;
            server_name {{ server_name }};

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            location / {
              proxy_pass http://127.0.0.1:{{ upstream_port }};
            }
          }

          server {
            # HTTP/1.1 only: this block proxies to a loopback service.
            listen 443 ssl;
            listen [::]:443 ssl;
            server_name {{ server_name }};

            ssl_certificate     /etc/nginx/ssl/{{ fqdn }}.crt;
            ssl_certificate_key /etc/nginx/ssl/{{ fqdn }}.key;
            ssl_protocols       TLSv1.2 TLSv1.3;
            ssl_ciphers         HIGH:!aNULL:!MD5;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            location / {
              proxy_pass http://127.0.0.1:{{ upstream_port }};
            }
          }
      register: vhost_file

    - name: Enable vhost
      file:
        src: '/etc/nginx/sites-available/{{ fqdn }}.conf'
        dest: '/etc/nginx/sites-enabled/{{ fqdn }}.conf'
        state: link
        force: yes

    - name: Validate nginx config
      command: nginx -t
      changed_when: false

    - name: Reload nginx
      systemd:
        name: nginx
        state: reloaded
        enabled: yes

    - name: Done
      debug:
        msg: >-
          nginx is proxying https://{{ fqdn }}/ →
          http://127.0.0.1:{{ upstream_port }}/. Allow it a minute
          for Cloudflare to converge on the new A record.
