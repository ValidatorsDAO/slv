---
- name: Switch Off Firedancer Identity
  hosts: "{{ off_host }}"
  become: true
  become_user: solv
  gather_facts: no
  any_errors_fatal: true
  tasks:
    - name: Refuse an identity_account that is not a base58 public key, it names files on the controller
      ansible.builtin.assert:
        that:
          - hostvars[inventory_hostname].identity_account | default('') | string is match('^[1-9A-HJ-NP-Za-km-z]{32,44}\\Z')
        fail_msg: "identity_account '{{ hostvars[inventory_hostname].identity_account | default('not set') }}' of {{ inventory_hostname }} is not a base58 public key (32 to 44 characters of the base58 alphabet), so it cannot name the tower file on the controller. Nothing was changed on {{ inventory_hostname }}."
        quiet: true

    - name: Stop while the cluster is between the Alpenglow activation and the genesis certificate
      ansible.builtin.import_tasks: ../cmn/tasks/alpenglow_state.yml
      vars:
        slv_alpenglow_network: mainnet
        slv_alpenglow_freeze: true
        slv_alpenglow_move_types:
          - "{{ validator_type | default('') }}"

    - name: Refuse to move a TowerBFT tower file on a cluster that runs Alpenglow
      ansible.builtin.assert:
        that:
          - slv_alpenglow_state == 'towerbft'
        fail_msg: "This switch moves a TowerBFT tower file with fdctl, and the cluster runs Alpenglow (getAgGenesisCert returned a certificate): Firedancer and Frankendancer cannot move a vote history file yet. Nothing was changed on {{ inventory_hostname }}."
        quiet: true
      run_once: true

    - name: Check that the source holds the tower file of the identity
      ansible.builtin.stat:
        path: "/mnt/ledger/tower-1_9-{{ hostvars[inventory_hostname].identity_account }}.bin"
      register: source_tower_file

    - name: Refuse to demote the source without a tower file to carry
      ansible.builtin.assert:
        that:
          - source_tower_file.stat.exists
        fail_msg: "/mnt/ledger/tower-1_9-{{ hostvars[inventory_hostname].identity_account }}.bin does not exist on {{ inventory_hostname }}, so there is no tower to carry to the target. Nothing was changed."
        quiet: true

    - name: Wait for Restart Window
      shell: |
        . ~/.profile
        agave-validator -l /mnt/ledger wait-for-restart-window --min-idle-time 2 --skip-new-snapshot-check
      args:
        executable: /bin/bash

    - name: Note the time right before the cluster is asked about the demotion
      ansible.builtin.set_fact:
        slv_pre_demotion_probe_at: "{{ now(utc=true).timestamp() | int }}"

    - name: Ask the cluster again right before the demotion
      ansible.builtin.import_tasks: ../cmn/tasks/alpenglow_state.yml
      vars:
        slv_alpenglow_network: mainnet
        slv_alpenglow_freeze: true
        slv_alpenglow_move_types:
          - "{{ validator_type | default('') }}"

    - name: Refuse to demote unless the cluster still runs TowerBFT
      ansible.builtin.assert:
        that:
          - slv_alpenglow_state == 'towerbft'
        fail_msg: "This switch moves a TowerBFT tower file with fdctl, and the cluster runs Alpenglow (getAgGenesisCert returned a certificate): Firedancer and Frankendancer cannot move a vote history file yet. Nothing was changed on {{ inventory_hostname }}."
        quiet: true
      run_once: true

    - name: Remember what the cluster ran when the source is demoted, for the switch_on that follows
      ansible.builtin.set_fact:
        slv_pre_demotion_state: "{{ slv_alpenglow_state }}"
        slv_pre_demotion_feature: "{{ slv_ag_feature_kind | default('') }}"

    - name: Set Identity to Unstaked Key
      shell: |
        . ~/.profile
        sudo fdctl set-identity --config /home/solv/firedancer-config.toml /home/solv/unstaked-identity.json
      args:
        executable: /bin/bash

    - name: Make sure the ~/.slv/tower directory exists
      shell: mkdir -p ~/.slv/tower
      failed_when: false

    - name: Download Tower File - Make Sure it overwrites the existing file if it exists at the destination
      ansible.builtin.fetch:
        src: /mnt/ledger/tower-1_9-{{ hostvars[inventory_hostname].identity_account }}.bin
        dest: ~/.slv/tower/tower-1_9-{{ hostvars[inventory_hostname].identity_account }}.bin
        flat: yes
