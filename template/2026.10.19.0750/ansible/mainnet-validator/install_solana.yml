---
# cmn/check_alpenglow_floor.yml stops, before anything is changed on any host, a client older than 4.3.0, the floor
# of Alpenglow on mainnet. install_agave.yml, install_jito.yml and install_allnodes_jito.yml install the version of -e,
# else the pin of mainnet_validators, whatever the host sets, and the check reads the same.
- import_playbook: ../cmn/check_alpenglow_floor.yml
  vars:
    versions_section: mainnet_validators
    agave_version: "{{ (mainnet_validators | default({})).get('version_agave', '') }}"
    jito_version: "{{ (mainnet_validators | default({})).get('version_jito', '') }}"
    allnodes_jito_version: "{{ (mainnet_validators | default({})).get('version_allnodes_jito', '') }}"

- name: Install Solana Client
  hosts: all
  become: yes
  become_user: solv

- import_playbook: install_agave.yml
  when: validator_type in ['agave', 'firedancer-agave']

- import_playbook: install_jito.yml
  when: validator_type in ['jito', 'firedancer-jito', 'firedancer']

- import_playbook: install_allnodes_jito.yml
  when: validator_type == 'allnodes-jito'
