---
# A mainnet voting validator cannot be Firedancer or Frankendancer: Alpenglow starts on mainnet at epoch 1064 and
# does not support them during the migration, and this playbook sets up Firedancer. It stops every host,
# before anything is changed, with the words of init.yml and of the CLI (cli/lib/fdctlMainnetGuard.ts), whoever
# runs it: slv, the AI console or ansible-playbook by hand. Use init.yml with agave, jito or allnodes-jito.
- name: Refuse Firedancer on mainnet
  hosts: all
  gather_facts: no
  any_errors_fatal: true
  tasks:
    - name: Fail, because a mainnet voting validator cannot be Firedancer or Frankendancer
      ansible.builtin.fail:
        msg: "A mainnet voting validator cannot be Firedancer or Frankendancer, and this playbook sets up Firedancer. Alpenglow starts on mainnet at epoch 1064, and Firedancer and Frankendancer are not supported during the migration. Use agave, jito or allnodes-jito instead, and move a node that already runs Firedancer or Frankendancer to one of them with `slv v switch -n mainnet` before epoch 1064. Nothing was changed on {{ inventory_hostname }}."

- name: Setup Firedancer
  hosts: all
  become: yes
  become_user: solv
  vars_files:
    - ~/.slv/versions.yml
  tasks:
    - name: Clean up residual hugetlbfs directories on /mnt
      shell: |
        rm -rf /mnt/.huge /mnt/.gigantic
      become: yes
      become_user: root
      failed_when: false

    - name: Clone Firedancer repository
      git:
        repo: https://github.com/firedancer-io/firedancer.git
        dest: /home/solv/firedancer
        update: yes
        force: yes
        version: v{{ mainnet_validators.version_firedancer }}

    - name: Initialize git submodules
      command: git submodule update --init --recursive
      args:
        chdir: /home/solv/firedancer
      retries: 3
      delay: 10

    - name: Run deps.sh script with yes (async/poll)
      shell: |
        yes y | ./deps.sh
      args:
        chdir: /home/solv/firedancer
      async: 300 # wait for 5 minutes
      poll: 15 # check every 15 seconds
      register: deps_result
      until: deps_result.rc == 0
      retries: 3
      delay: 10

    - name: Build Firedancer with make
      shell: |
        export PATH="$HOME/.cargo/bin:$PATH"
        . $HOME/.cargo/env
        make -j fdctl solana
      args:
        chdir: /home/solv/firedancer
        executable: /bin/bash
      register: build_result
      until: build_result.rc == 0
      retries: 3
      delay: 10

    - name: Create symbolic link for fdctl
      file:
        src: /home/solv/firedancer/build/native/gcc/bin/fdctl
        dest: /usr/local/bin/fdctl
        state: link
        force: yes
      become: yes
      become_user: root

    - name: Create config.toml
      template:
        src: ~/.slv/mainnet-validator/firedancer-config.toml.j2
        dest: /home/solv/firedancer-config.toml
        owner: solv
        group: solv
        mode: "0644"
      vars:
        block_engine_url: "{{ hostvars[inventory_hostname].block_engine_url }}"
        vote_account: "{{ hostvars[inventory_hostname].vote_account }}"
        commission_bps: "{{ hostvars[inventory_hostname].commission_bps }}"

    - name: Create Firedancer systemd service file with template
      template:
        src: ~/.slv/mainnet-validator/firedancer.service.j2
        dest: /etc/systemd/system/firedancer.service
        owner: root
        group: root
        mode: "0644"
        force: yes
      become: yes
      become_user: root
      register: firedancer_service
      notify: Reload systemd daemon

    - name: Enable Firedancer
      systemd:
        name: firedancer
        enabled: yes
      become: yes
      become_user: root

    - name: Unload irdma module (async/poll)
      shell: sudo rmmod irdma
      args:
        executable: /bin/bash
      ignore_errors: yes

    - name: Ensure /mnt directory has correct permissions
      shell: sudo chown -R solv:solv /mnt && sudo chmod -R 700 /mnt
      failed_when: false

  handlers:
    - name: Reload systemd daemon
      command: systemctl daemon-reload
      become: yes
      become_user: root
