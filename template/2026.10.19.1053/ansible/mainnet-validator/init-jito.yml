---
# Jito initialisation of a mainnet validator. It begins as init.yml does: the type gate, which stops a
# validator_type that mainnet does not take (the Firedancer types among them), and
# cmn/check_alpenglow_floor.yml, which stops a jito older than 4.3.0, the floor of Alpenglow on mainnet. Both
# stop the run before anything is changed. install_jito.yml installs jito_version of -e, else
# v<mainnet_validators.version_jito>, whatever the host sets, and the check reads the same.
- name: Load validator type from inventory
  hosts: all
  gather_facts: no
  any_errors_fatal: true
  tasks:
    - name: Fail unless validator_type is a supported type
      ansible.builtin.assert:
        that:
          - validator_type | default('') in ['agave', 'jito', 'allnodes-jito']
        fail_msg: >-
          {%- set slv_type = validator_type | default('', true) | string | trim | lower -%}
          {%- if slv_type in ['firedancer-agave', 'firedancer-jito', 'firedancer', 'frankendancer'] or slv_type.startswith('firedancer') -%}
          A mainnet voting validator cannot be {{ validator_type }}. Alpenglow starts on mainnet at epoch 1064, and Firedancer and Frankendancer are not supported during the migration. Use agave, jito or allnodes-jito instead, and move a node that already runs Firedancer or Frankendancer to one of them with `slv v switch -n mainnet` before epoch 1064. Nothing was changed on {{ inventory_hostname }}.
          {%- else -%}
          validator_type '{{ validator_type | default('undefined') }}' is not supported on {{ inventory_hostname }}. Set it in the inventory to one of agave, jito, allnodes-jito. Nothing was changed.
          {%- endif -%}
        success_msg: "Validator type is {{ validator_type | default('undefined') }}"

- import_playbook: ../cmn/check_alpenglow_floor.yml
  vars:
    versions_section: mainnet_validators
    floor_client: jito
    jito_version: "{{ (mainnet_validators | default({})).get('version_jito', '') }}"

- import_playbook: ../cmn/copy_restart_sh.yml
  vars:
    restarter_snapshot_network: mainnet
- import_playbook: ../cmn/add_solv.yml
- import_playbook: ../cmn/install_package.yml
- import_playbook: ../cmn/update_ubuntu.yml
- import_playbook: install_rust.yml
- import_playbook: install_jito.yml
- import_playbook: setup_ufw.yml
- import_playbook: fail2ban_solana_rate_limit.yml
- import_playbook: ../cmn/mount_disks.yml
- import_playbook: ../cmn/optimize_system.yml
- import_playbook: ../cmn/setup_norestart.yml
- import_playbook: configure_hugetlbfs.yml
- import_playbook: setup_logrotate.yml
- import_playbook: ../cmn/setup_unstaked_identity.yml
- import_playbook: create_overrides.yml
- import_playbook: deploy-start-validator-sh.yml
- import_playbook: setup_solv_service.yml
- import_playbook: wget_snapshot.yml
- import_playbook: start-solv-service.yml
