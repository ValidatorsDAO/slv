---
# cmn/check_alpenglow_floor.yml stops, before anything is changed on any host, a client older than 4.4.0-beta.0,
# the floor of Alpenglow on testnet. The Agave, Jito and Allnodes Jito installers use the version of -e, else the pin of
# testnet_validators, whatever the host sets, and the check reads the same.
- import_playbook: ../cmn/check_alpenglow_floor.yml
  vars:
    versions_section: testnet_validators
    agave_version: "{{ (testnet_validators | default({})).get('version_agave', '') }}"
    jito_version: "{{ (testnet_validators | default({})).get('version_jito', '') }}"
    allnodes_jito_version: "{{ (testnet_validators | default({})).get('version_allnodes_jito', '') }}"

- name: Install Solana Client
  hosts: all
  become: yes
  become_user: solv

- import_playbook: install_agave.yml
  when: validator_type in ['agave', 'firedancer-agave']

- import_playbook: install_jito.yml
  when: validator_type in ['jito', 'firedancer-jito']

- import_playbook: install_allnodes_jito.yml
  when: validator_type == 'allnodes-jito'
