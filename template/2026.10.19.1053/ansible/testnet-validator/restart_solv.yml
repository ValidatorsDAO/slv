---
# The node must not come back on the staked identity: nothing is stopped or started before this check
- import_playbook: ../cmn/assert_unstaked_identity.yml
  vars:
    slv_network: testnet
    slv_start_identity_source: start-script

- name: Execute tasks as solv user
  hosts: all
  become: true
  become_user: solv
  tasks:
    - name: restart solv
      shell: . ~/.profile && agave-validator -l /mnt/ledger exit --max-delinquent-stake 10
      register: solana_version_output

    - name: Display Solana Restart Result with name
      debug:
        msg: "{{ inventory_hostname }} ({{ hostvars[inventory_hostname]['name'] | default(inventory_hostname) }}): Solana Restart Result: {{ solana_version_output.stdout }}"
