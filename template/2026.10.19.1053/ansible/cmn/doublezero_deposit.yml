---
- name: Deposit DoubleZero validator funds
  hosts: all
  become: yes
  gather_facts: false

  vars:
    doublezero_env: 'mainnet-beta'
    doublezero_deposit_fund: '3'
    doublezero_keypair_path: '/home/solv/mainnet-validator-keypair.json'

  pre_tasks:
    - name: Check SSH reachability
      wait_for_connection:
        timeout: 10
      register: conn_check
      ignore_errors: true
      ignore_unreachable: true

    - meta: end_host
      when: conn_check.unreachable | default(false) or conn_check.failed | default(false)

  tasks:
    # doublezero-solana signs with the key file it is given, and deploy puts no staked key on a node any more
    - name: Look for the key file the deposit is signed with
      ansible.builtin.stat:
        path: '{{ doublezero_keypair_path }}'
      register: dz_keypair

    - name: Stop when the key file the deposit is signed with is not on the node
      ansible.builtin.fail:
        msg: >-
          {{ doublezero_keypair_path }} does not exist on {{ inventory_hostname }}, so there is no key to sign the deposit
          with: slv does not put the staked key on a node, it stays on the controller. Nothing was changed on
          {{ inventory_hostname }}.
      when: not dz_keypair.stat.exists

    - name: Deposit validator funds
      ansible.builtin.command:
        argv:
          - doublezero-solana
          - revenue-distribution
          - validator-deposit
          - --node-id
          - '{{ identity_account }}'
          - --fund
          - '{{ doublezero_deposit_fund }}'
          - -u
          - '{{ doublezero_env }}'
          - -k
          - '{{ doublezero_keypair_path }}'
      register: dz_deposit
      changed_when: dz_deposit.rc == 0
      failed_when: dz_deposit.rc != 0

    - name: Show deposit result
      ansible.builtin.debug:
        msg: '{{ dz_deposit.stdout_lines | default(["(no output)"]) }}'
