---
# Clone pyth-network/pythnet and build solana-validator + solana-keygen +
# solana-gossip.
#
# Pythnet is a Solana 1.14 fork — the bundled rocksdb (v7.4.4) fails to
# compile under modern GCC because it relies on the legacy implicit-include
# behavior for <cstdint>.  We work around this by setting CXXFLAGS for the
# build only (NOT CFLAGS — blake3 uses cc to assemble .S files and
# -include cstdint would be prepended to assembly source, breaking it).

- name: Build Pythnet validator from source
  hosts: all
  become: true
  vars:
    # Each slv_ variable reads the variable of the same name without the prefix (-e or inventory), with its default:
    # a play variable that read its own name would loop.
    slv_pythnet_repo: "{{ pythnet_repo | default('https://github.com/pyth-network/pythnet') }}"
    slv_pythnet_ref: "{{ pythnet_ref | default('pyth-v1.14.17') }}"
    slv_pythnet_ledger_mount: "{{ pythnet_ledger_mount | default('/mnt/ledger') }}"
    src_dir: "{{ slv_pythnet_ledger_mount }}/src/pythnet"

  tasks:
    # the repository and the ref go to git, and the mount is the directory that the build runs in
    - name: Stop when the repository, the ref or the mount of the build is not usable
      ansible.builtin.assert:
        that:
          - slv_pythnet_repo | string is match('^(https://|ssh://git@|git@)[A-Za-z0-9._~:/@%+-]+\\Z')
          - slv_pythnet_ref | string is match('^[A-Za-z0-9][A-Za-z0-9._/+-]*\\Z')
          - "'..' not in (slv_pythnet_ref | string)"
          - slv_pythnet_ledger_mount | string is match('^/[A-Za-z0-9._/-]*\\Z')
          - "'..' not in (slv_pythnet_ledger_mount | string)"
        fail_msg: "pythnet_repo '{{ slv_pythnet_repo }}' has to be an https or ssh git URL, pythnet_ref '{{ slv_pythnet_ref }}' a branch, tag or commit name, and pythnet_ledger_mount '{{ slv_pythnet_ledger_mount }}' an absolute path, all without spaces or shell characters. Nothing was changed on {{ inventory_hostname }}."
        quiet: true

    - name: Ensure src dir exists
      ansible.builtin.file:
        path: "{{ src_dir | dirname }}"
        state: directory
        owner: solv
        group: solv
        mode: "0755"

    - name: Clone pythnet repo (shallow, pinned branch)
      become_user: solv
      ansible.builtin.git:
        repo: "{{ slv_pythnet_repo }}"
        dest: "{{ src_dir }}"
        version: "{{ slv_pythnet_ref }}"
        depth: 1
        force: yes
      register: pythnet_git

    # CXXFLAGS workaround: rocksdb's data_block_hash_index.h drops
    # uint*_t under modern GCC because <cstdint> isn't transitively
    # included.  -include cstdint fixes the build without patching
    # upstream sources.  Scoped to C++ only — blake3's build.rs uses cc
    # to assemble .S files and a C-level -include would corrupt those.
    - name: Build solana-validator + keygen + gossip
      become_user: solv
      ansible.builtin.shell: 'source $HOME/.cargo/env && export CXXFLAGS="-include cstdint" && unset CFLAGS && cargo build --release --bin solana-validator --bin solana-keygen --bin solana-gossip'
      args:
        chdir: "{{ src_dir }}"
        executable: /bin/bash
      register: build_result
      changed_when: build_result.rc == 0
      when: pythnet_git.changed

    - name: Verify binaries exist
      ansible.builtin.stat:
        path: "{{ src_dir }}/target/release/{{ item }}"
      loop:
        - solana-validator
        - solana-keygen
        - solana-gossip
      register: bin_stat

    - name: Fail if any binary is missing
      ansible.builtin.assert:
        that: bin_stat.results | map(attribute='stat.exists') | list | min
        fail_msg: "build_pythnet: one or more binaries missing under {{ src_dir }}/target/release/"

    - name: Symlink binaries to /usr/local/bin
      ansible.builtin.file:
        src: "{{ src_dir }}/target/release/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        state: link
        force: yes
      loop:
        - solana-validator
        - solana-keygen
        - solana-gossip
