---
# The node must not come back on the staked identity: nothing is stopped or started before this check
- import_playbook: ../cmn/assert_unstaked_identity.yml
  vars:
    slv_network: mainnet
    slv_start_identity_source: start-script

- name: Run Command
  hosts: all
  become: true
  become_user: solv
  gather_facts: no
  tasks:
    - name: Start Solv
      shell: . ~/.profile && sudo systemctl start solv
      register: command_output

    - name: Display Command output
      debug:
        msg: '{{ inventory_hostname }} ({{ hostvars[inventory_hostname].name | default(inventory_hostname) }}): Start Solv: {{ command_output.stdout }}'
