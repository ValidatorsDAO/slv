---
# The node must not come back on the staked identity: nothing is stopped or started before this check
- import_playbook: ../cmn/assert_unstaked_identity.yml
  vars:
    slv_network: testnet
    slv_start_identity_source: firedancer-config

- name: Start Firedancer Service
  hosts: all
  become: true
  gather_facts: no
  tasks:
    - name: Start Firedancer Service
      systemd:
        name: firedancer
        state: started
      register: firedancer_result
      retries: 3
      delay: 10
      until: firedancer_result is succeeded
      failed_when: false
