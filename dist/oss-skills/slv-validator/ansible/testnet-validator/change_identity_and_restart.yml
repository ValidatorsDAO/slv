---
# This playbook linked /home/solv/identity.json to the staked key on the node (/home/solv/testnet-validator-keypair.json)
# and restarted firedancer.service. Deploy puts no staked key on a node any more: the key stays on the controller
# (~/.slv/keys/<identity>.json) and reaches the node on stdin during slv v set:identity and slv v switch, and a restarted
# node comes back on its unstaked identity. So there is no staked key to link, and this play only refuses: its first task
# fails and nothing else runs.
- name: Change Identity and Restart firedancer.service (refused, the node has no staked key)
  hosts: all
  gather_facts: no
  tasks:
    - name: Refuse to link the identity to a key on the node
      ansible.builtin.fail:
        msg: >-
          SLV_KEYLESS_REFUSED: change_identity_and_restart.yml links the identity of the node to a staked key on the
          node, and slv does not put the staked key on a node: it stays on the controller and reaches the node on
          stdin. Nothing was changed on {{ inventory_hostname }}. Use slv v set:identity -n testnet -p
          {{ inventory_hostname }}, or slv v switch -n testnet to move the identity from one host to another.
