---
# This playbook is retired. It set the identity without the checks that slv v set:identity makes first: that nothing
# votes with the identity, where the identity is in gossip, and that the tower or vote history file of the identity is
# there (on Alpenglow, also that the host has caught up). For an agave or jito host it read the staked key on the
# controller (~/.slv/keys/<identity>.json) and passed it on stdin to agave-validator set-identity; for a Firedancer host
# it read a key file on the node (/home/solv/testnet-validator-keypair.json), which deploy never copies there (a node
# that an earlier slv deployed may still hold it). The staked key reaches an agave, jito or allnodes-jito node on stdin
# during slv v set:identity and slv v switch, which make the checks. So this play only refuses: its first task fails and
# nothing else runs.
- name: Set Identity to Testnet Validator Key (retired)
  hosts: "{{ on_host | default('all') }}"
  gather_facts: no
  tasks:
    - name: Refuse to set the identity without the checks of the set:identity command
      ansible.builtin.fail:
        msg: >-
          SLV_KEYLESS_REFUSED: set_identity_to_active.yml is retired. It set the identity without the checks that the
          set:identity command of slv makes first: that nothing votes with the identity, where the identity is in
          gossip, and that the tower or vote history file of the identity is there (on Alpenglow, also that the host
          has caught up); and on a Firedancer host it read the staked key from a file on the node
          (/home/solv/testnet-validator-keypair.json), which deploy never copies there. Nothing was changed on
          {{ inventory_hostname }}. Use
          slv v set:identity -n testnet -p {{ inventory_hostname }}, or
          slv v switch -n testnet to move the identity from one host to another; both refuse a Firedancer host of
          testnet, which takes the staked key from a file on the node.
