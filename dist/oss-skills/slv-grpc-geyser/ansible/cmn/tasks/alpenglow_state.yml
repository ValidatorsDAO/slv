---
# Which consensus does the cluster run? This sets slv_alpenglow_state to
#
#   towerbft   the Alpenglow feature account is absent or not activated, and the
#              epoch does not end soon
#   imminent   the feature account exists but is not activated yet (it activates at
#              the next epoch boundary) and fewer than slv_alpenglow_margin_slots
#              slots are left in the epoch: the activation is about to start
#   window     the feature is activated and getAgGenesisCert still returns null:
#              the cluster is between the feature activation and the genesis certificate
#   alpenglow  getAgGenesisCert returns a certificate
#   unknown    an RPC error, or an answer that cannot be read
#
# and slv_alpenglow_detail to a short reason (it never holds the RPC URL).
#
# Import it with ansible.builtin.import_tasks. It asks the cluster RPC from the
# controller, once, and changes nothing. Variables:
#
#   slv_alpenglow_network         mainnet, testnet or devnet (required): picks the public RPC
#   slv_alpenglow_rpc_url         ask this RPC instead (a URL that carries a key is never printed)
#   slv_alpenglow_freeze          true: stop the play while the state is window, unknown or
#                                 imminent. Every identity change sets it.
#   slv_alpenglow_margin_slots    slots left in the epoch below which a pending activation
#                                 counts as imminent (3000, about 11 minutes; 0 turns it off)
#   slv_alpenglow_min_slot_seconds  the shortest time a slot is assumed to take (0.2; about 0.22
#                                 measured on mainnet and testnet). The promotion after a demotion goes on
#                                 without a reading only within slv_alpenglow_margin_slots times this, halved
#   slv_alpenglow_demoted_source  set by nodowntime_migrate for the plays that run after the
#                                 source host was switched to its unstaked identity: the
#                                 refusal then says what is left to do by hand
#   slv_alpenglow_move_types      the validator_type of every host that takes part in the identity
#                                 change: while the state is alpenglow the play stops when one of
#                                 them is firedancer-agave, firedancer-jito or frankendancer
#   slv_alpenglow_rpc_retries     retries of a call whose answer cannot be read (2)
#   slv_alpenglow_rpc_delay       seconds between the attempts (2)
#   slv_alpenglow_patience_seconds  how long a call whose answer cannot be read is retried when
#                                 slv_alpenglow_demoted_source is set and the reading right
#                                 before that demotion was towerbft or alpenglow (60). Downtime
#                                 is already running then, and a refusal would leave both nodes
#                                 unstaked.
#
# The reading right before a demotion (switch_off_identity.yml and switch_off_firedancer_identity.yml)
# is kept in the host facts slv_pre_demotion_state, slv_pre_demotion_feature (what the feature account
# was: absent, inactive, active or not asked) and slv_pre_demotion_probe_at (epoch seconds, the
# controller's clock, taken before the cluster was asked). When the state of a later switch_on is
# still unknown after the patient retries, and less time has passed since that reading than half of
# slv_alpenglow_margin_slots slots take at slv_alpenglow_min_slot_seconds (300 seconds for 3000 slots at
# 0.2 seconds), the probe sets slv_ag_resume to true and slv_ag_resume_mode to what the cluster ran at
# that reading, and does not stop on unknown. The bound assumes that slots do not run faster than
# slv_alpenglow_min_slot_seconds: then at most half of the margin has passed, and an activation, which
# comes with the next epoch, is still at least half of the margin away:
#
#   towerbft   the switch_on goes on with the TowerBFT promotion. When the feature account was
#              pending at that reading, an activation of Alpenglow cannot have started in that time
#              (the epoch had at least slv_alpenglow_margin_slots slots left, and at the assumed slot
#              time at most half of them have passed). When it was absent,
#              one can have been scheduled since, and nothing here rules that out (the known limit
#              of the probe, which reads an absent account as towerbft however few slots are left)
#   alpenglow  Alpenglow does not revert: the switch_on goes on with the vote history file (not
#              when a Firedancer or Frankendancer host takes part, which Alpenglow stops)
#
# window, imminent and alpenglow readings still stop the switch_on, and so does unknown once the time is
# over. agave checks the tower or the vote history file itself when the identity is set.

- name: Check the inputs of the Alpenglow state probe
  ansible.builtin.assert:
    that:
      - slv_alpenglow_network | default('') in ['mainnet', 'testnet', 'devnet']
      - (slv_alpenglow_margin_slots | default(3000) | string) is match('^[0-9]+$')
    fail_msg: "slv_alpenglow_network must be mainnet, testnet or devnet (it is '{{ slv_alpenglow_network | default('not set') }}') and slv_alpenglow_margin_slots a whole number of slots (it is '{{ slv_alpenglow_margin_slots | default(3000) }}'). Nothing was changed."
    quiet: true
  run_once: true

- name: Work out how long a call that cannot be read is retried
  ansible.builtin.set_fact:
    slv_ag_give_up_at: >-
      {%- if (slv_alpenglow_freeze | default(false) | bool) and (slv_alpenglow_demoted_source | default('', true) != '')
          and (hostvars[slv_alpenglow_demoted_source].slv_pre_demotion_state | default('')) in ['towerbft', 'alpenglow'] -%}
      {{ (now(utc=true).timestamp() | int) + (slv_alpenglow_patience_seconds | default(60) | int) }}
      {%- else -%}0{%- endif -%}
    slv_ag_patient_retries: "{{ [((slv_alpenglow_patience_seconds | default(60) | int) / ([slv_alpenglow_rpc_delay | default(2) | int, 1] | max)) | round(0, 'ceil') | int, 1] | max }}"
  run_once: true

- name: Ask the cluster for the Alpenglow genesis certificate (getAgGenesisCert)
  ansible.builtin.uri:
    url: "{{ slv_alpenglow_rpc_url | default('', true) or {'mainnet': 'https://api.mainnet-beta.solana.com', 'testnet': 'https://api.testnet.solana.com', 'devnet': 'https://api.devnet.solana.com'}[slv_alpenglow_network] }}"
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      id: 1
      method: getAgGenesisCert
    return_content: true
    timeout: 20
  register: slv_ag_cert_reply
  until: >-
    ((slv_ag_cert_reply.status | default(0)) == 200 and
    slv_ag_cert_reply.json is defined and slv_ag_cert_reply.json is mapping and
    'error' not in slv_ag_cert_reply.json and 'result' in slv_ag_cert_reply.json) or
    ((slv_ag_give_up_at | default(0) | int) > 0 and (now(utc=true).timestamp() | int) >= (slv_ag_give_up_at | default(0) | int))
  retries: "{{ [slv_alpenglow_rpc_retries | default(2) | int, 0] | max if (slv_ag_give_up_at | default(0) | int) == 0 else slv_ag_patient_retries | int }}"
  delay: "{{ slv_alpenglow_rpc_delay | default(2) | int }}"
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true
  delegate_to: localhost
  run_once: true
  become: false

- name: Read what the genesis certificate answer says
  ansible.builtin.set_fact:
    slv_ag_cert_kind: >-
      {%- set reply = slv_ag_cert_reply -%}
      {%- set body = reply.json | default(none) -%}
      {%- if (reply.status | default(-1)) == -1 -%}unreadable (no answer)
      {%- elif reply.status != 200 -%}unreadable (HTTP {{ reply.status }})
      {%- elif body is not mapping -%}unreadable (no JSON answer)
      {%- elif 'error' in body -%}unreadable (JSON-RPC error{{ ' ' ~ body.error.code if body.error is mapping and body.error.code is defined and body.error.code is integer else '' }})
      {%- elif 'result' not in body -%}unreadable (no result)
      {%- elif body.result is none -%}null
      {%- elif body.result is mapping and 'block' in body.result and 'signature' in body.result -%}certificate
      {%- else -%}unreadable (unexpected result)
      {%- endif -%}
  run_once: true

- name: Ask the cluster whether the Alpenglow feature is activated (its feature account)
  ansible.builtin.uri:
    url: "{{ slv_alpenglow_rpc_url | default('', true) or {'mainnet': 'https://api.mainnet-beta.solana.com', 'testnet': 'https://api.testnet.solana.com', 'devnet': 'https://api.devnet.solana.com'}[slv_alpenglow_network] }}"
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      id: 1
      method: getAccountInfo
      params:
        - A1pengvuM6JEcyNuTnMqepBKhwHE3N6PmUrdATGawhJS
        - encoding: base64
          dataSlice:
            offset: 0
            length: 1
          commitment: processed
    return_content: true
    timeout: 20
  register: slv_ag_feature_reply
  until: >-
    ((slv_ag_feature_reply.status | default(0)) == 200 and
    slv_ag_feature_reply.json is defined and slv_ag_feature_reply.json is mapping and
    'error' not in slv_ag_feature_reply.json and 'result' in slv_ag_feature_reply.json) or
    ((slv_ag_give_up_at | default(0) | int) > 0 and (now(utc=true).timestamp() | int) >= (slv_ag_give_up_at | default(0) | int))
  retries: "{{ [slv_alpenglow_rpc_retries | default(2) | int, 0] | max if (slv_ag_give_up_at | default(0) | int) == 0 else slv_ag_patient_retries | int }}"
  delay: "{{ slv_alpenglow_rpc_delay | default(2) | int }}"
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true
  delegate_to: localhost
  run_once: true
  become: false
  when: slv_ag_cert_kind == 'null'

- name: Read what the feature account answer says
  ansible.builtin.set_fact:
    slv_ag_feature_kind: >-
      {%- set reply = slv_ag_feature_reply -%}
      {%- set body = reply.json | default(none) -%}
      {%- if reply is skipped -%}not asked
      {%- elif (reply.status | default(-1)) == -1 -%}unreadable (no answer)
      {%- elif reply.status != 200 -%}unreadable (HTTP {{ reply.status }})
      {%- elif body is not mapping -%}unreadable (no JSON answer)
      {%- elif 'error' in body -%}unreadable (JSON-RPC error{{ ' ' ~ body.error.code if body.error is mapping and body.error.code is defined and body.error.code is integer else '' }})
      {%- elif body.result is not mapping or 'context' not in body.result or body.result.context is not mapping or 'value' not in body.result -%}unreadable (unexpected result)
      {%- elif body.result.value is none -%}absent
      {%- elif body.result.value is not mapping or body.result.value.owner | default('') != 'Feature111111111111111111111111111111111111' -%}unreadable (not a feature account)
      {%- elif body.result.value.data | default([]) == ['AA==', 'base64'] -%}inactive
      {%- elif body.result.value.data | default([]) == ['AQ==', 'base64'] -%}active
      {%- else -%}unreadable (unexpected account data)
      {%- endif -%}
  run_once: true

- name: Ask the cluster how many slots are left in the epoch (getEpochInfo)
  ansible.builtin.uri:
    url: "{{ slv_alpenglow_rpc_url | default('', true) or {'mainnet': 'https://api.mainnet-beta.solana.com', 'testnet': 'https://api.testnet.solana.com', 'devnet': 'https://api.devnet.solana.com'}[slv_alpenglow_network] }}"
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      id: 1
      method: getEpochInfo
      params:
        - commitment: processed
    return_content: true
    timeout: 20
  register: slv_ag_epoch_reply
  until: >-
    ((slv_ag_epoch_reply.status | default(0)) == 200 and
    slv_ag_epoch_reply.json is defined and slv_ag_epoch_reply.json is mapping and
    'error' not in slv_ag_epoch_reply.json and 'result' in slv_ag_epoch_reply.json) or
    ((slv_ag_give_up_at | default(0) | int) > 0 and (now(utc=true).timestamp() | int) >= (slv_ag_give_up_at | default(0) | int))
  retries: "{{ [slv_alpenglow_rpc_retries | default(2) | int, 0] | max if (slv_ag_give_up_at | default(0) | int) == 0 else slv_ag_patient_retries | int }}"
  delay: "{{ slv_alpenglow_rpc_delay | default(2) | int }}"
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true
  delegate_to: localhost
  run_once: true
  become: false
  when: slv_ag_feature_kind == 'inactive'

- name: Read what the epoch answer says
  ansible.builtin.set_fact:
    slv_ag_epoch_kind: >-
      {%- set reply = slv_ag_epoch_reply -%}
      {%- set body = reply.json | default(none) -%}
      {%- set info = body.result if body is mapping and body.result is defined else none -%}
      {%- if reply is skipped -%}not asked
      {%- elif (reply.status | default(-1)) == -1 -%}unreadable (no answer)
      {%- elif reply.status != 200 -%}unreadable (HTTP {{ reply.status }})
      {%- elif body is not mapping -%}unreadable (no JSON answer)
      {%- elif 'error' in body -%}unreadable (JSON-RPC error{{ ' ' ~ body.error.code if body.error is mapping and body.error.code is defined and body.error.code is integer else '' }})
      {%- elif info is not mapping or 'slotIndex' not in info or 'slotsInEpoch' not in info -%}unreadable (unexpected result)
      {%- elif info.slotIndex is not integer or info.slotIndex is boolean or info.slotsInEpoch is not integer or info.slotsInEpoch is boolean -%}unreadable (unexpected result)
      {%- elif info.slotIndex < 0 or info.slotsInEpoch <= info.slotIndex -%}unreadable (unexpected result)
      {%- else -%}{{ info.slotsInEpoch - info.slotIndex }} slots left
      {%- endif -%}
  run_once: true

- name: Decide which consensus the cluster runs
  ansible.builtin.set_fact:
    slv_alpenglow_state: >-
      {%- if slv_ag_cert_kind.startswith('unreadable') -%}unknown
      {%- elif slv_ag_cert_kind == 'certificate' -%}alpenglow
      {%- elif slv_ag_feature_kind.startswith('unreadable') -%}unknown
      {%- elif slv_ag_feature_kind == 'active' -%}window
      {%- elif slv_ag_feature_kind == 'inactive' -%}
      {%- if slv_ag_epoch_kind.startswith('unreadable') or slv_ag_epoch_kind == 'not asked' -%}unknown
      {%- elif (slv_ag_epoch_kind.split(' ')[0] | int) < (slv_alpenglow_margin_slots | default(3000) | int) -%}imminent
      {%- else -%}towerbft
      {%- endif -%}
      {%- else -%}towerbft
      {%- endif -%}
    slv_alpenglow_detail: "getAgGenesisCert: {{ slv_ag_cert_kind }}; feature account: {{ slv_ag_feature_kind }}{{ '; epoch: ' ~ slv_ag_epoch_kind if slv_ag_epoch_kind != 'not asked' else '' }}"
  run_once: true

- name: Work out whether the promotion goes on although the cluster could not be read
  ansible.builtin.set_fact:
    slv_ag_resume_mode: >-
      {{ (hostvars[slv_alpenglow_demoted_source].slv_pre_demotion_state | default('')) if (slv_ag_give_up_at | default(0) | int) > 0 else '' }}
    slv_ag_resume: >-
      {{ slv_alpenglow_state == 'unknown'
         and (slv_ag_give_up_at | default(0) | int) > 0
         and (hostvars[slv_alpenglow_demoted_source].slv_pre_demotion_state | default('')) in ['towerbft', 'alpenglow']
         and (hostvars[slv_alpenglow_demoted_source].slv_pre_demotion_probe_at | default(0) | int) > 0
         and ((now(utc=true).timestamp() | int) - (hostvars[slv_alpenglow_demoted_source].slv_pre_demotion_probe_at | int))
             < ((slv_alpenglow_margin_slots | default(3000) | int) * (slv_alpenglow_min_slot_seconds | default(0.2) | float) / 2)
         and ((hostvars[slv_alpenglow_demoted_source].slv_pre_demotion_state | default('')) == 'towerbft'
              or (slv_alpenglow_move_types | default([]) | intersect(['firedancer-agave', 'firedancer-jito', 'frankendancer']) | length) == 0) }}
    slv_ag_resume_elapsed: >-
      {{ ((now(utc=true).timestamp() | int) - (hostvars[slv_alpenglow_demoted_source].slv_pre_demotion_probe_at | default(0) | int))
         if (slv_ag_give_up_at | default(0) | int) > 0 else 0 }}
  run_once: true

- name: Look for the vote history file the demoted source left on the controller
  ansible.builtin.stat:
    path: "~/.slv/vote_history/vote_history-{{ hostvars[inventory_hostname].identity_account | default('') }}.bin"
  register: slv_ag_controller_copy
  delegate_to: localhost
  run_once: true
  become: false
  check_mode: false
  when:
    - slv_alpenglow_freeze | default(false) | bool
    - slv_alpenglow_demoted_source | default('', true) != ''

- name: Say what a refusal leaves behind
  ansible.builtin.set_fact:
    slv_ag_outcome: >-
      {%- if slv_alpenglow_demoted_source | default('', true) -%}
      The source host {{ slv_alpenglow_demoted_source }} was already switched to its unstaked identity in this run, so {{ slv_alpenglow_demoted_source }} and {{ inventory_hostname }} are both unstaked now. {{ 'Wait until getAgGenesisCert returns a certificate, then promote' if slv_alpenglow_state in ['window', 'unknown', 'imminent'] else 'Promote' }} {{ hostvars[inventory_hostname].identity_account | default('its identity') }} on {{ inventory_hostname }} yourself. Nothing is promoted automatically.
      {%- if slv_ag_controller_copy.stat.exists | default(false) %} The vote history file taken from {{ slv_alpenglow_demoted_source }} is at ~/.slv/vote_history/vote_history-{{ hostvars[inventory_hostname].identity_account | default('') }}.bin on the controller: copy it to /mnt/ledger on {{ inventory_hostname }} (owner solv), wait until the vote account has not voted for 270 slots (about one minute after {{ slv_alpenglow_demoted_source }} was switched) and run slv v set:identity -n {{ slv_alpenglow_network }} -p {{ inventory_hostname }}.
      {%- else %} {{ slv_alpenglow_demoted_source }} left no vote history file on the controller. When the cluster runs Alpenglow, wait until the vote account has not voted for 270 slots (about one minute after {{ slv_alpenglow_demoted_source }} was switched) and run slv v set:identity -n {{ slv_alpenglow_network }} -p {{ inventory_hostname }} --first-activation when the vote account has not voted since the Alpenglow genesis (it voted under TowerBFT only), and --primary-down when it has; while it runs TowerBFT, copy the tower file from ~/.slv/tower on the controller to /mnt/ledger on {{ inventory_hostname }} and run slv v set:identity -n {{ slv_alpenglow_network }} -p {{ inventory_hostname }}.{% endif -%}
      {%- else -%}
      Nothing was changed on {{ ansible_play_hosts_all | join(', ') }}.
      {%- endif -%}
  run_once: true
  when: slv_alpenglow_freeze | default(false) | bool

- name: Stop the identity change while the cluster is between the Alpenglow activation and the genesis certificate
  ansible.builtin.assert:
    that:
      - slv_alpenglow_state not in ['window', 'unknown']
    fail_msg: "The cluster is between the Alpenglow feature activation and the genesis certificate, or its state cannot be read: identity changes wait until getAgGenesisCert returns a certificate. State: {{ slv_alpenglow_state }} ({{ slv_alpenglow_detail }}). {{ slv_ag_outcome }}"
    quiet: true
  run_once: true
  when:
    - slv_alpenglow_freeze | default(false) | bool
    - not (slv_ag_resume | default(false) | bool)

- name: Stop the identity change while the Alpenglow activation is about to start
  ansible.builtin.assert:
    that:
      - slv_alpenglow_state != 'imminent'
    fail_msg: "The Alpenglow activation is about to start: the feature is pending and the epoch ends in fewer than {{ slv_alpenglow_margin_slots | default(3000) }} slots. Run the identity change after the genesis certificate: wait until getAgGenesisCert returns a certificate. State: {{ slv_alpenglow_state }} ({{ slv_alpenglow_detail }}). {{ slv_ag_outcome }}"
    quiet: true
  run_once: true
  when: slv_alpenglow_freeze | default(false) | bool

- name: Stop an identity change that would move the vote history of Firedancer or Frankendancer
  ansible.builtin.assert:
    that:
      - slv_alpenglow_state != 'alpenglow' or (slv_alpenglow_move_types | default([]) | intersect(['firedancer-agave', 'firedancer-jito', 'frankendancer']) | length) == 0
    fail_msg: "Firedancer and Frankendancer cannot move an identity on a cluster that runs Alpenglow yet: where they keep the vote history file is unconfirmed. Use agave, jito or allnodes-jito hosts. {{ slv_ag_outcome }}"
    quiet: true
  run_once: true
  when: slv_alpenglow_freeze | default(false) | bool

- name: Say that the promotion goes on although the cluster could not be read
  ansible.builtin.debug:
    msg: >-
      The cluster could not be read for {{ slv_alpenglow_patience_seconds | default(60) }} seconds after {{ slv_alpenglow_demoted_source }} was switched to its unstaked identity ({{ slv_alpenglow_detail }}).
      {% if slv_ag_resume_mode == 'towerbft' -%}
      {%- set feature = hostvars[slv_alpenglow_demoted_source].slv_pre_demotion_feature | default('') -%}
      {%- if feature == 'inactive' -%}
      The reading right before that demotion, {{ slv_ag_resume_elapsed }} seconds ago, was TowerBFT with the Alpenglow feature pending and at least {{ slv_alpenglow_margin_slots | default(3000) }} slots left in the epoch. Slots are assumed to take at least {{ slv_alpenglow_min_slot_seconds | default(0.2) }} seconds, so at most half of those slots have passed since (the promotion goes on within {{ ((slv_alpenglow_margin_slots | default(3000) | int) * (slv_alpenglow_min_slot_seconds | default(0.2) | float) / 2) | int }} seconds of the reading), and the activation, which comes with the next epoch, cannot have started: {{ inventory_hostname }} takes the identity with the tower now. agave still checks the tower file, and on Alpenglow the vote history file, itself.
      {%- else -%}
      The reading right before that demotion, {{ slv_ag_resume_elapsed }} seconds ago, was TowerBFT, and {{ 'the cluster had no Alpenglow feature account then' if feature == 'absent' else 'the state of the Alpenglow feature account was not recorded' }}. That does not rule out an activation that was scheduled since, so {{ inventory_hostname }} takes the identity with the tower now without that assurance. agave still checks the tower file, and on Alpenglow the vote history file, itself.
      {%- endif -%}
      {%- else -%}
      The reading right before that demotion, {{ slv_ag_resume_elapsed }} seconds ago, was Alpenglow, which does not revert, so {{ inventory_hostname }} takes the identity with the vote history file now. agave still checks the vote history file itself.
      {%- endif %}
  run_once: true
  when:
    - slv_alpenglow_freeze | default(false) | bool
    - slv_ag_resume | default(false) | bool
