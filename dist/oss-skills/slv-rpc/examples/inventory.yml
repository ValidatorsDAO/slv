# SLV RPC — Example Inventory
#
# Usage:
#   ansible-playbook -i inventory.yml mainnet-rpc/init.yml
#
# Or with extra_vars:
#   ansible-playbook -i inventory.yml mainnet-rpc/init.yml \
#     -e '{"agave_version":"4.3.2","rpc_type":"Geyser gRPC"}'

all:
  hosts:
    rpc-1:
      ansible_host: "<server-ip>"
      ansible_user: "solv"
      ansible_ssh_private_key_file: "~/.ssh/id_rsa"

  vars:
    # --- RPC Type ---
    # Options: RPC, Index RPC, Geyser gRPC, Index RPC + gRPC
    rpc_type: "RPC"

    # --- Validator Type (underlying client) ---
    # Options: agave, jito, allnodes-jito, firedancer-agave
    validator_type: "agave"

    # --- Versions ---
    # The version variable of the validator_type; when it is left out the build takes version_agave or
    # version_jito of the network's *_rpcs section of ~/.slv/versions.yml
    agave_version: "4.3.2"             # validator_type: agave
    # jito_version: "4.3.2-jito"       # validator_type: jito
    # allnodes_jito_version: "4.3.2-allnodes"  # validator_type: allnodes-jito (no pin in versions.yml)
    # firedancer_version: "0.305.20104"
    # geyser_version: "<Yellowstone release tag>"  # default: geyser_version of the network in ~/.slv/versions.yml
    # geyser_plugin: richat  # Yellowstone is the default; richat has no release for agave 4.3 or later yet,
    #                        # so init.yml stops on a node that is set to run such an agave
    # richat_version: "richat-v8.1.0"  # only with geyser_plugin: richat

    # --- Snapshot ---
    snapshot_url: ""

    # --- Network ---
    limit_ledger_size: 100000000
    dynamic_port_range: "8000-8025"

    # --- gRPC (when rpc_type includes gRPC) ---
    # port_grpc: 10000

    # --- Testnet Only ---
    # expected_shred_version: ""

    # --- Performance Tuning (auto-managed by init) ---
    smt_disable: false
    irq_tuning: false
    cpu_boost: false
    need_reboot: false
