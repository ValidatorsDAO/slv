---
- name: Copy restart.sh
  hosts: all
  gather_facts: no
  tasks:
    - name: Copy restart.sh
      become: yes
      become_user: solv
      template:
        src: "~/.slv/cmn/restart.sh.j2"
        dest: "/home/solv/restarter.sh"
        owner: solv
        group: solv
        mode: "0700"
      vars:
        snapshot_direct_fra_url: "{{ hostvars[inventory_hostname].snapshot_direct_fra_url | default('') }}"
        snapshot_url: "{{ hostvars[inventory_hostname].snapshot_url | default('') }}"
        validator_type: "{{ hostvars[inventory_hostname].validator_type }}"
