---
- name: Clone and build Yellowstone GRPC with specific tag
  hosts: all
  vars_files:
    - ~/.slv/versions.yml
  become: true
  vars:
    working_dir: "/home/solv"
    repo_url: "https://github.com/rpcpool/yellowstone-grpc.git"
    geyser_config_template: "~/.slv/testnet-rpc/geyser.json.j2"
    geyser_config_path: "/home/solv/geyser.json"
  tasks:
    # geyser_version of the host or -e, else geyser_version of testnet_rpcs: what the geyser_build.yml of
    # mainnet-rpc does, and what cmn/check_alpenglow_floor.yml checks against the floor.
    - name: Resolve geyser version (overridable via -e geyser_version= or the host)
      set_fact:
        geyser_version_resolved: "{{ geyser_version | default(testnet_rpcs.geyser_version, true) }}"

    - name: Ensure Cargo and Rust environment is loaded
      shell: |
        source ~/.profile
        rustup show
      args:
        executable: /bin/bash
      become_user: solv

    - name: Clone or update the Yellowstone GRPC repository with specific tag
      git:
        repo: "{{ repo_url }}"
        dest: "{{ working_dir }}/yellowstone-grpc"
        version: "{{ geyser_version_resolved }}"
        update: yes
      become_user: solv

    - name: Copy the geyser.json configuration file
      template:
        src: "{{ geyser_config_template }}"
        dest: "{{ geyser_config_path }}"
        owner: solv
        group: solv
        mode: "0644"

    - name: Build the project using Cargo
      shell: |
        source ~/.profile
        cargo build -r
      args:
        chdir: "{{ working_dir }}/yellowstone-grpc"
        executable: /bin/bash
      become_user: solv

    - name: Format and run config-check with Cargo
      shell: |
        source ~/.profile
        cargo fmt && cargo run --bin config-check -- --config '{{ geyser_config_path }}'
      args:
        chdir: "{{ working_dir }}/yellowstone-grpc"
        executable: /bin/bash
      become_user: solv
